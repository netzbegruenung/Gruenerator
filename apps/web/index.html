    <script>
      /* Desktop (Tauri) only: the mobile `width=device-width` viewport makes
         macOS WKWebView lay the whole app out at a narrow mobile width, so
         responsive grids collapse to their tablet/mobile tiers ("iPad view").
         Removing the meta AT RUNTIME makes the webview reflow to the real
         window width. (Stripping it at build time instead leaves WKWebView on
         its 980px no-viewport default, so it must be a runtime removal.) Web
         keeps the meta — `__TAURI__` is only present in the desktop shell. */
      if ('__TAURI__' in window) {
        document.querySelector('meta[name=viewport]')?.remove();
      }

    <!-- Pre-paint theme application: prevents flash of wrong theme. Must mirror
         the resolution used by src/components/hooks/useDarkMode.ts -->
    <script>
      (function () {
        try {
          var EXPIRY = 7 * 24 * 60 * 60 * 1000; // explicit choice lapses to system after 7d inactivity
          var isPref = function (v) {
            return v === 'light' || v === 'dark' || v === 'system';
          };
          var pref = null;
          var ts = 0;

          var stored = localStorage.getItem('themePreference');
          if (stored) {
            try {
              var parsed = JSON.parse(stored);
              if (parsed && isPref(parsed.value)) {
                pref = parsed.value;
                ts = typeof parsed.timestamp === 'number' ? parsed.timestamp : Date.now();
              }
            } catch (e) {
              if (isPref(stored)) {
                pref = stored;
                ts = Date.now();
              }
            }
          }
          // Migrate legacy `darkMode` JSON (honor its timestamp).
          if (pref === null) {
            var legacyDark = localStorage.getItem('darkMode');
            if (legacyDark) {
              try {
                var p2 = JSON.parse(legacyDark);
                if (p2 && typeof p2.value === 'boolean') {
                  pref = p2.value ? 'dark' : 'light';
                  ts = typeof p2.timestamp === 'number' ? p2.timestamp : Date.now();
                }
              } catch (e) {}
            }
          }
          // Migrate original `theme` string key.
          if (pref === null) {
            var legacyTheme = localStorage.getItem('theme');
            if (legacyTheme === 'dark' || legacyTheme === 'light') {
              pref = legacyTheme;
              ts = Date.now();
            }
          }

          // Apply the inactivity rule (system never expires).
          if (pref === null || pref === 'system' || Date.now() - ts >= EXPIRY) pref = 'system';

          var dark =
            pref === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : pref === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!-- Early session probe (#5891): start the Better Auth get-session request
         now so it runs in parallel with the entry closure instead of after it.
         Mirrors src/lib/authClient.ts (base = VITE_API_BASE_URL ?? '/api',
         path /auth/v2/get-session, credentials include); the consumer in
         src/lib/earlyAuthStatus.ts only uses it when the URL matches exactly
         and falls back to a normal request otherwise. Skipped for Tauri
         (bearer token, absolute base) and localhost (dev / E2E auth bypass). -->
    <script>
      (function () {
        try {
          if ('__TAURI__' in window) return;
          if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
          var base = '%VITE_API_BASE_URL%';
          if (!base || base.charAt(0) === '%') base = '/api';
          var url = new URL(base + '/auth/v2/get-session', location.origin).toString();
          var promise = fetch(url, { method: 'GET', credentials: 'include' });
          promise.catch(function () {});
          window.__gruenAuthStatus = { url: url, startedAt: Date.now(), promise: promise };
        } catch (e) {}
      })();
    </script>

    <!-- React Scan (dev only) - highlights unnecessary re-renders -->
    <script>
      if (
        location.protocol.startsWith('http') &&
        (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ) {
        var s = document.createElement('script');
        s.src = '//unpkg.com/react-scan/dist/auto.global.js';
        s.crossOrigin = 'anonymous';
        document.currentScript.after(s);
      }
    </script>

    <!-- Konfigurationsdatei. defer keeps document order with the module
         entry below, so window.API_BASE_URL is still set before React boots,
         while no longer parser-blocking on the critical path. -->
    <script defer src="/config.js"></script>

    <!-- Umami Analytics (GDPR-compliant with consent) -->
    <script>
      (function () {
        // Only load Umami if consent is given
        if (localStorage.getItem('analyticsConsent') === 'true') {
          var script = document.createElement('script');
          script.defer = true;
          script.src = 'https://umami-f0s4w04kg4oww8cg44ssg4w8.moritz-waechter.de/script.js';
          script.setAttribute('data-website-id', '86496802-6720-416a-9035-ec19c2ed8fc4');
          document.head.appendChild(script);
        }
      })();

      // Consent management functions
      window.grantAnalyticsConsent = function () {
        localStorage.setItem('analyticsConsent', 'true');
        window.location.reload(); // Reload to load Umami script
      };

      window.revokeAnalyticsConsent = function () {
        localStorage.removeItem('analyticsConsent');
        window.location.reload(); // Reload to remove Umami script
      };
    </script>
    <!-- End Umami Code -->

    <!-- Cookie/terms banner styling. Self-contained so the banner can paint
         before the app stylesheet loads. Uses CSS variable fallbacks so it
         still looks right under both themes (the pre-paint theme script
         above sets data-theme="dark"|"light" before any paint). -->
    <style>
      .terms-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: var(--background-color, #ffffff);
        color: var(--font-color, #1a1a1a);
        padding: 10px 20px;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.15);
        z-index: 1003;
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
        font-family: 'PT Sans', Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
      .terms-banner p {
        flex: 1 1 auto;
        margin: 0;
      }
      .terms-banner a {
        color: inherit;
        text-decoration: underline;
      }
      .terms-banner__actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .terms-banner button {
        background: var(--font-color-h, #1a1a1a);
        color: var(--background-color, #ffffff);
        border: none;
        border-radius: 50px;
        padding: 10px 20px;
        font: inherit;
        cursor: pointer;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      .terms-banner button:hover {
        background: var(--secondary-600, #005538);
        color: #ffffff;
      }
      @media (max-width: 768px) {
        .terms-banner {
          flex-direction: column;
          padding: 15px 15px 25px;
          gap: 10px;
          text-align: center;
          font-size: 0.9em;
        }
        .terms-banner__actions {
          flex-direction: column;
          width: 100%;
        }
        .terms-banner button {
          width: 100%;
          padding: 12px 20px;
        }
      }
    </style>
    <!-- Static app shell: paints with the first byte of HTML, before any JS.
         Mirrors AuthSplash (src/components/routing/AuthSplash.tsx) 1:1 in
         geometry and uses the literal values of the design tokens
         (--background-color, --color-border-val, --color-muted-val from
         variables.css) because the app stylesheet is not loaded yet.
         createRoot().render() replaces #root's children on first render, so
         no hydration is involved. Hidden via html.no-shell (set by the
         terms-banner script below) for -no-header-footer and embedded=1. -->
    <style>
      /* Only while the shell is mounted. These rules are unlayered, and the
         app's own body background lives in @layer legacy (global.css), so an
         unscoped rule here would beat it forever and paint every page,
         including the chat, white. */
      html:has(#root > .app-shell),
      html:has(#root > .app-shell) body {
        background: #ffffff;
      }
      html[data-theme='dark']:has(#root > .app-shell),
      html[data-theme='dark']:has(#root > .app-shell) body {
        background: #1a1a1a;
      }
      .app-shell {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }
      .app-shell__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e5e5;
      }
      .app-shell__logo {
        display: block;
        width: 24px;
        height: 24px;
        color: #005437;
      }
      .app-shell__main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 48rem;
        margin: 32px auto 0;
        padding: 0 16px;
        box-sizing: border-box;
      }
      .app-shell__grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      @media (min-width: 768px) {
        .app-shell__grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .app-shell__bar {
        border-radius: 6px;
        background: #f3f4f6;
      }
      html[data-theme='dark'] .app-shell {
        background: #1a1a1a;
      }
      html[data-theme='dark'] .app-shell__header {
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }
      html[data-theme='dark'] .app-shell__logo {
        color: #ffffff;
      }
      html[data-theme='dark'] .app-shell__bar {
        background: #2a2a2a;
      }
      html.no-shell .app-shell {
        display: none;
      }
    </style>
  </head>

    <!-- Cookie/terms banner — rendered inline (not by React) so it paints
         with the first byte of HTML. Previously a lazy React component that
         was the LCP element on the public landing page for every fresh
         visitor, gated by ~5s of JS download. The inline <script> below
         decides whether to keep it visible based on the same `termsAccepted`
         localStorage key the React version used. Runs synchronously before
         first paint, so dismissed visitors never see a flash. -->
    <div id="terms-banner" class="terms-banner">
      <!-- „Durch die Nutzung stimmst du zu" stand hier früher — das ist keine
           Einwilligung nach § 25 Abs. 1 TDDDG. Technisch notwendige Cookies
           brauchen sie nicht, die Reichweitenmessung schon, und die gibt es nur
           über „Alle akzeptieren". -->
      <p>
        Technisch notwendige Cookies setzen wir immer. Die anonyme Reichweitenmessung nur, wenn du
        zustimmst.
        <a href="/datenschutz#webanalyse">Mehr erfahren</a> ·
        <a href="/nutzungsbedingungen">Nutzungsbedingungen</a> ·
        <a href="/ki-transparenz">KI-Transparenz</a>
      </p>
      <div class="terms-banner__actions">
        <button type="button" id="terms-banner-necessary">Nur Notwendige</button>
        <button type="button" id="terms-banner-accept-all">Alle akzeptieren</button>
      </div>
    </div>
    <script>
      // Mirrors the 'termsAccepted' key tracked by usePopupDismiss.ts
      // (POPUP_KEYS registry). The inline write below bypasses the
      // server-side cross-device sync that the React hook performed for
      // authenticated users — acceptable because the banner is shown once
      // on signed-out landing and the vast majority of dismissals happen
      // before sign-in.
      (function () {
        var banner = document.getElementById('terms-banner');
        if (!banner) return;
        var dismissed = false;
        try {
          dismissed = localStorage.getItem('termsAccepted') === 'true';
        } catch (e) {}
        var noChrome = /-no-header-footer/.test(location.pathname);
        // Embedded in the mobile app's WebView. The banner's three links are
        // the easiest way out of a WebView meant to show exactly one page.
        // Removing it grants nothing: analytics stays off until accepted.
        var embedded = /(^|[?&])embedded=1(&|$)/.test(location.search);
        if (noChrome || embedded) document.documentElement.classList.add('no-shell');
        if (dismissed || noChrome || embedded) {
          banner.remove();
          return;
        }
        function accept(grantAnalytics) {
          try {
            localStorage.setItem('termsAccepted', 'true');
          } catch (e) {}
          if (grantAnalytics && typeof window.grantAnalyticsConsent === 'function') {
            window.grantAnalyticsConsent(); // reloads the page to load Umami
            return;
          }
          banner.remove();
        }
        var btnNecessary = document.getElementById('terms-banner-necessary');
        var btnAccept = document.getElementById('terms-banner-accept-all');
        if (btnNecessary)
          btnNecessary.addEventListener('click', function () {
            accept(false);
          });
        if (btnAccept)
          btnAccept.addEventListener('click', function () {
            accept(true);
          });
      })();
    </script>
