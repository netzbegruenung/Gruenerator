    <!-- Strukturierte Daten für Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Grünerator",
      "url": "https://www.gruenerator.de",

      "offers": {

        "price": "0"
      }
    }
    </script>
    <link rel="canonical" href="https://www.gruenerator.de" />

    <!-- Pre-paint theme application: prevents flash of wrong theme. Must mirror
         the storage format used by src/components/hooks/useDarkMode.ts -->
    <script>
      (function () {
        try {
          var EXPIRY = 7 * 24 * 60 * 60 * 1000;
          var dark = null;
          var saved = localStorage.getItem('darkMode');
          if (saved) {
            try {
              var parsed = JSON.parse(saved);
              if (
                parsed &&
                typeof parsed.value === 'boolean' &&
                typeof parsed.timestamp === 'number' &&
                Date.now() - parsed.timestamp < EXPIRY
              ) {
                dark = parsed.value;
              }
            } catch (e) {}
          }
          if (dark === null) {
            var legacy = localStorage.getItem('theme');
            if (legacy === 'dark') dark = true;
            else if (legacy === 'light') dark = false;
          }
          if (dark === null) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>

    <!-- React Scan (dev only) - highlights unnecessary re-renders -->
    <script>
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        var s = document.createElement('script');
        s.src = '//unpkg.com/react-scan/dist/auto.global.js';
        s.crossOrigin = 'anonymous';
        document.currentScript.after(s);
      }
    </script>

    <!-- Konfigurationsdatei. defer keeps document order with the module
         entry below, so window.API_BASE_URL is still set before React boots,
         while no longer parser-blocking on the critical path. -->
    <script defer src="/config.js"></script>

    <!-- Umami Analytics (GDPR-compliant with consent) -->
    <script>
      (function() {
        // Only load Umami if consent is given
        if (localStorage.getItem('analyticsConsent') === 'true') {
          var script = document.createElement('script');
          script.defer = true;
          script.src = 'https://umami-f0s4w04kg4oww8cg44ssg4w8.moritz-waechter.de/script.js';
          script.setAttribute('data-website-id', '86496802-6720-416a-9035-ec19c2ed8fc4');
          document.head.appendChild(script);
        }
      })();

      // Consent management functions
      window.grantAnalyticsConsent = function() {
        localStorage.setItem('analyticsConsent', 'true');
        window.location.reload(); // Reload to load Umami script
      };

      window.revokeAnalyticsConsent = function() {
        localStorage.removeItem('analyticsConsent');
        window.location.reload(); // Reload to remove Umami script
      };
    </script>
    <!-- End Umami Code -->

    <!-- Cookie/terms banner styling. Self-contained so the banner can paint
         before the app stylesheet loads. Uses CSS variable fallbacks so it
         still looks right under both themes (the pre-paint theme script
         above sets data-theme="dark"|"light" before any paint). -->
    <style>
      .terms-banner {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: var(--background-color, #ffffff);
        color: var(--font-color, #1a1a1a);
        padding: 10px 20px;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.15);
        z-index: 1003;
        display: flex; align-items: center; gap: 12px;
        box-sizing: border-box;
        font-family: 'PT Sans', Arial, sans-serif;
        font-size: 16px; line-height: 1.5;
      }
      .terms-banner p { flex: 1 1 auto; margin: 0; }
      .terms-banner a { color: inherit; text-decoration: underline; }
      .terms-banner__actions { display: flex; gap: 12px; align-items: center; }
      .terms-banner button {
        background: var(--font-color-h, #1a1a1a);
        color: var(--background-color, #ffffff);
        border: none; border-radius: 50px;
        padding: 10px 20px;
        font: inherit; cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
      }
      .terms-banner button:hover { background: var(--secondary-600, #005538); color: #ffffff; }
      @media (max-width: 768px) {
        .terms-banner { flex-direction: column; padding: 15px 15px 25px; gap: 10px; text-align: center; font-size: 0.9em; }
        .terms-banner__actions { flex-direction: column; width: 100%; }
        .terms-banner button { width: 100%; padding: 12px 20px; }
      }
    </style>

  </head>
  <body>
    <noscript>Sie müssen JavaScript aktivieren, um diese App nutzen zu können.</noscript>

    <!-- Cookie/terms banner — rendered inline (not by React) so it paints
         with the first byte of HTML. Previously a lazy React component that
         was the LCP element on the public landing page for every fresh
         visitor, gated by ~5s of JS download. The inline <script> below
         decides whether to keep it visible based on the same `termsAccepted`
         localStorage key the React version used. Runs synchronously before
         first paint, so dismissed visitors never see a flash. -->
    <div id="terms-banner" class="terms-banner">
      <p>
        Diese Website verwendet Cookies. Durch die Nutzung stimmst du den
        <a href="/nutzungsbedingungen">Nutzungsbedingungen</a> zu.
        <a href="/datenschutz#webanalyse">Mehr erfahren</a>
      </p>
      <div class="terms-banner__actions">
        <button type="button" id="terms-banner-necessary">Nur Notwendige</button>
        <button type="button" id="terms-banner-accept-all">Alle akzeptieren</button>
      </div>
    </div>
    <script>
      // Mirrors the 'termsAccepted' key tracked by usePopupDismiss.ts
      // (POPUP_KEYS registry). The inline write below bypasses the
      // server-side cross-device sync that the React hook performed for
      // authenticated users — acceptable because the banner is shown once
      // on signed-out landing and the vast majority of dismissals happen
      // before sign-in.
      (function () {
        var banner = document.getElementById('terms-banner');
        if (!banner) return;
        var dismissed = false;
        try { dismissed = localStorage.getItem('termsAccepted') === 'true'; } catch (e) {}
        var noChrome = /-no-header-footer/.test(location.pathname);
        if (dismissed || noChrome) {
          banner.remove();
          return;
        }
        function accept(grantAnalytics) {
          try { localStorage.setItem('termsAccepted', 'true'); } catch (e) {}
          if (grantAnalytics && typeof window.grantAnalyticsConsent === 'function') {
            window.grantAnalyticsConsent(); // reloads the page to load Umami
            return;
          }
          banner.remove();
        }
        var btnNecessary = document.getElementById('terms-banner-necessary');
        var btnAccept = document.getElementById('terms-banner-accept-all');
        if (btnNecessary) btnNecessary.addEventListener('click', function () { accept(false); });
        if (btnAccept) btnAccept.addEventListener('click', function () { accept(true); });
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
