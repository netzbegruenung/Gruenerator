  - heading "Mit dem MCP-Server verbinden" [level=2]
  - paragraph: Nutze die Grünerator-Tools direkt in deinem KI-Client — inklusive deiner eigenen Dokumente, Boards und Notebooks. Beim Verbinden meldest du dich mit deinem Grünerator-Konto an und entscheidest, worauf der Client zugreifen darf.
