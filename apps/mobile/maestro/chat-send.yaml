# Sending a message clears the composer and the turn appears in the thread.
#
# Needs a reachable backend — set EXPO_PUBLIC_API_URL at the test environment.
# Under the plain dev bypass (no backend) the request 401s and no assistant turn
# arrives, so this flow is excluded from the default local run and gated on
# GRUENERATOR_E2E_BACKEND in CI.
appId: de.gruenerator.app
---
- launchApp:
    clearState: true
    stopApp: true

- assertVisible: 'Chat'
- tapOn:
    id: 'chat-composer-input'
- inputText: 'Was steht im Grundsatzprogramm zu Klimaschutz?'

- tapOn:
    id: 'chat-composer-send'

# The composer empties immediately (optimistic), so the send button unmounts.
- assertNotVisible:
    id: 'chat-composer-send'

# The user turn renders, then the assistant answers. 60s covers a cold model.
- assertVisible: 'Was steht im Grundsatzprogramm zu Klimaschutz?'
- extendedWaitUntil:
    visible:
      id: 'chat-composer-send'
    timeout: 60000
    optional: true
