# App boots and every tab mounts without a redbox.
#
# This is the flow that would have caught `68ff3ec66 dedupe react in metro so
# chat finds the QueryClient`: a second React copy in the bundle made the chat
# subtree read a different QueryClientContext than the provider, and the tab
# threw "No QueryClient set" the moment it mounted. Nothing below the bundler
# can see that.
appId: de.gruenerator.app
---
# No clearState: these run against a local DEBUG build, where clearing state
# also wipes the dev-launcher's saved Metro URL and the app relaunches into the
# launcher instead of itself. The release APK EAS builds has no launcher, so
# boot-to-login can and does clear state.
- launchApp:
    stopApp: true
- runFlow: _dev-client-preamble.yaml

# Past the auth gate via the dev bypass. Generous timeout: a debug build pulls
# the bundle from Metro on first launch (~10s), and the splash only hands over
# once fonts and the rehydrated onboarding flag both settle.
- extendedWaitUntil:
    visible: 'Chat'
    timeout: 60000

# Three tabs, not four: `profile` is registered in ClassicTabLayout with
# href: null, so it is reachable from the avatar, not the tab bar.
- tapOn: 'Arbeiten'
- assertVisible: 'Arbeiten'
- assertNotVisible:
    text: '.*No QueryClient set.*'
    optional: true

- tapOn: 'Wissen'
- assertVisible: 'Wissen'
- assertNotVisible:
    text: '.*No QueryClient set.*'
    optional: true

- tapOn: 'Chat'
- assertVisible: 'Chat'
