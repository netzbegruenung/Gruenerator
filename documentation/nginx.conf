server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus prerenders every route as its own HTML file, so no SPA fallback
    # is needed. An unknown path gets a real 404 instead of the start page with
    # 200 — otherwise a chat citation to a page the deployed site lacks lands on
    # the home page silently, with nothing in any log (#5013).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # /docs-index.json (~490 KB) is the chat's docs index, polled by every API
    # worker (apps/api/services/docs/docsIndex.ts). nginx's ETag answers most
    # polls with 304; gzip cuts the rest to ~140 KB.
    gzip on;
    gzip_types application/json;

    # Optional: Basic performance optimization
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
