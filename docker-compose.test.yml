# Gruenerator Test Docker Compose
# Uses locally built images for testing
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml logs -f
#   docker compose -f docker-compose.test.yml down

services:
  web:
    image: gruenerator-web:test
    restart: unless-stopped
    networks:
      - gruenerator

  sites:
    image: gruenerator-sites:test
    restart: unless-stopped
    networks:
      - gruenerator

  api:
    image: gruenerator-api:test
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gruenerator
      - REDIS_URL=redis://host.docker.internal:6379
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/apps/api/logs
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  docs:
    image: gruenerator-docs:test
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - gruenerator
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hocuspocus:
    image: gruenerator-hocuspocus:test
    restart: unless-stopped
    environment:
      - HOCUSPOCUS_PORT=1240
      - HEALTH_PORT=1241
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gruenerator
      - REDIS_URL=redis://host.docker.internal:6379
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1241/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp:
    image: gruenerator-mcp:test
    restart: unless-stopped
    environment:
      - PORT=3004
      - NODE_ENV=production
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Docling-Serve - Self-hosted document OCR/conversion (PDF, DOCX, PPTX, images → Markdown)
  # Pre-built image from quay.io, no custom build needed
  ocr:
    image: quay.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped
    environment:
      - DOCLING_SERVE_MAX_NUM_PAGES=1000
      - DOCLING_SERVE_MAX_FILE_SIZE=104857600
      - DOCLING_NUM_THREADS=4
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - DOCLING_SERVE_MAX_SYNC_WAIT=300
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=ocr'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  presenton:
    image: gruenerator-presenton:test
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/gruenerator
      - LLM=custom
      - CUSTOM_LLM_URL=http://host.docker.internal:4000/v1
      - CUSTOM_LLM_API_KEY=${LITELLM_API_KEY:-}
      - CUSTOM_MODEL=mistral/mistral-small-latest
      - IMAGE_PROVIDER=pexels
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - CAN_CHANGE_KEYS=false
      - MIGRATE_DATABASE_ON_STARTUP=false
      - BETTER_AUTH_URL=http://api:3001
    volumes:
      - presenton-data:/app_data
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  doku:
    image: gruenerator-doku:test
    restart: unless-stopped
    networks:
      - gruenerator

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - sites
      - api
      - docs
      - hocuspocus
      - mcp
      - doku
    networks:
      - gruenerator
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  api-uploads:
  api-logs:
  presenton-data:

networks:
  gruenerator:
    driver: bridge
