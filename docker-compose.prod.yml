# Gruenerator Production Docker Compose
# Deployed via Salt to /opt/gruenerator/docker-compose.yml
#
# Usage:
#   TAG=latest docker compose -f docker-compose.prod.yml up -d
#
# Services:
#   - web: Static frontend (nginx serving Vite build)
#   - sites: Candidate website builder (nginx serving Vite build)
#   - api: Backend API (Node.js, port 3001)
#   - mcp: MCP server for AI integrations (Node.js, port 3004)
#   - doku: Static Docusaurus documentation
#   - nginx: Internal reverse proxy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - gruenerator
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - 'com.gruenerator.service=redis'

  web:
    image: ghcr.io/netzbegruenung/gruenerator-web:${TAG:-latest}
    restart: unless-stopped
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=web'

  sites:
    image: ghcr.io/netzbegruenung/gruenerator-sites:${TAG:-latest}
    restart: unless-stopped
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=sites'

  api:
    image: ghcr.io/netzbegruenung/gruenerator-api:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - WEB_BASE_URL=${WEB_BASE_URL:-https://www.gruenerator.de}
    volumes:
      - api-uploads:/app/apps/api/uploads
      - api-logs:/app/apps/api/logs
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - 'com.gruenerator.service=api'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hocuspocus:
    image: ghcr.io/netzbegruenung/gruenerator-hocuspocus:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - HOCUSPOCUS_PORT=1240
      - HEALTH_PORT=1241
      - NODE_ENV=production
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - 'com.gruenerator.service=hocuspocus'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1241/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp:
    image: ghcr.io/netzbegruenung/gruenerator-mcp:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3004
      - NODE_ENV=production
      - PUBLIC_URL=${MCP_PUBLIC_URL}
      - LOG_LEVEL=${MCP_LOG_LEVEL:-INFO}
      - GRUENERATOR_API_URL=${GRUENERATOR_API_URL}
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - 'com.gruenerator.service=mcp'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  doku:
    image: ghcr.io/netzbegruenung/gruenerator-doku:${TAG:-latest}
    restart: unless-stopped
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=doku'

  iconify:
    image: ghcr.io/netzbegruenung/gruenerator-iconify:${TAG:-latest}
    restart: unless-stopped
    environment:
      - PORT=3100
    networks:
      - gruenerator
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/collections']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - 'com.gruenerator.service=iconify'

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_started
      sites:
        condition: service_started
      api:
        condition: service_healthy
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=nginx'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Docling-Serve - Self-hosted document OCR/conversion (PDF, DOCX, PPTX, images → Markdown)
  # Pre-built image from quay.io, no custom build needed
  ocr:
    image: quay.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped
    # Hard memory ceiling. docling-serve has no internal cap; a large multi-page OCR
    # job can balloon to tens of GB. With vm.overcommit_memory=1 the kernel never
    # refuses the allocation, so an uncapped container OOM-kills the whole host.
    # mem_limit scopes the OOM kill to this container -> it dies and restarts.
    mem_limit: 8g
    mem_reservation: 2g
    environment:
      - DOCLING_SERVE_MAX_NUM_PAGES=1000
      - DOCLING_SERVE_MAX_FILE_SIZE=104857600
      # Fewer parallel page pipelines = lower peak RAM.
      - DOCLING_NUM_THREADS=2
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - DOCLING_SERVE_MAX_SYNC_WAIT=300
    networks:
      - gruenerator
    labels:
      - 'com.gruenerator.service=ocr'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Nango - Self-hosted OAuth connector middleware (Google, Microsoft, Atlassian)
  # Pre-built image, no custom build needed. Dashboard at nango.* subdomain.
  nango:
    image: nangohq/nango-server:hosted
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NANGO_DB_HOST=host.docker.internal
      - NANGO_DB_PORT=5432
      - NANGO_DB_USER=${POSTGRES_USER:-gruenerator}
      - NANGO_DB_PASSWORD=${POSTGRES_PASSWORD}
      - NANGO_DB_NAME=nango
      - NANGO_SERVER_URL=${NANGO_PUBLIC_URL}
      - NANGO_ENCRYPTION_KEY=${NANGO_ENCRYPTION_KEY}
      - FLAG_SERVE_CONNECT_UI=true
      - FLAG_AUTH_ENABLED=false
      - NANGO_DASHBOARD_USERNAME=${NANGO_DASHBOARD_USERNAME:-admin}
      - NANGO_DASHBOARD_PASSWORD=${NANGO_DASHBOARD_PASSWORD}
      - SERVER_PORT=3003
      - CONNECT_UI_PORT=3009
      - TELEMETRY=false
    networks:
      - gruenerator
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - 'com.gruenerator.service=nango'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:
  api-uploads:
  api-logs:

networks:
  gruenerator:
    driver: bridge
