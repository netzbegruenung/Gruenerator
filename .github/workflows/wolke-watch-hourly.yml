name: Hourly Wolke Watch

on:
  schedule:
    - cron: '0 * * * *' # Hourly, on the hour (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wolke-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Run Wolke Watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_API_URL: ${{ vars.WOLKE_WATCH_API_URL || 'https://gruenerator.eu' }}
    steps:
      - uses: actions/checkout@v7

      - name: Run wolke watch
        id: watch
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "Scanning auto_sync notebooks for new Wolke files at $ADMIN_API_URL..."
          HTTP_CODE=$(.github/scripts/admin-post.sh /api/internal/wolke-watch/run /tmp/wolke.json)
          jq . /tmp/wolke.json

          # Only the status code travels as a step output. The body stays in the
          # file and is read back with `cat`: an upstream error page can contain
          # an apostrophe, which would break the single-quoted expansion of a
          # step output in the summary step below.
          echo "status=$HTTP_CODE" >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Wolke watch failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Generate summary
        if: always()
        run: |
          STATUS='${{ steps.watch.outputs.status }}'
          RESULT=$(cat /tmp/wolke.json 2>/dev/null || echo '{}')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" != "200" ]; then
            case "$STATUS" in
              000 | '') REASON="Could not reach $ADMIN_API_URL (timeout, DNS, or TLS error)." ;;
              403) REASON="The API rejected the admin token — the \`ADMIN_TOKEN\` secret does not match \`env.ADMIN_TOKEN\` on $ADMIN_API_URL." ;;
              5*) REASON="The wolke-watch endpoint failed server-side (HTTP $STATUS), and the retries did not recover it." ;;
              *) REASON="The wolke-watch endpoint answered HTTP $STATUS." ;;
            esac
            {
              echo "## :x: Wolke Watch — HTTP ${STATUS:-000}"
              echo ""
              echo "$REASON"
              echo ""
              echo '```json'
              echo "$RESULT"
              echo '```'
              echo ""
              echo "[Workflow logs]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SCANNED=$(echo "$RESULT" | jq -r '.scannedCollections // "?"')
          WITH_NEW=$(echo "$RESULT" | jq -r '.collectionsWithNewFiles // "?"')
          NEW_FILES=$(echo "$RESULT" | jq -r '.totalNewFiles // "?"')
          NOTIFIED=$(echo "$RESULT" | jq -r '.notificationsSent // "?"')

          {
            echo "## :cloud: Wolke Watch"
            echo ""
            echo "**Date:** $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Notebooks scanned | $SCANNED |"
            echo "| With new files | $WITH_NEW |"
            echo "| New files detected | $NEW_FILES |"
            echo "| Notifications sent | $NOTIFIED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if watch run errored
        if: steps.watch.outcome == 'failure'
        run: exit 1
