name: Content Sync

on:
  # Started only by the Grünerator API (workflow_dispatch with `mode`, see
  # apps/api/services/scrapers/contentSyncDispatcher.ts). The `schedule:` crons
  # are gone: GitHub throttled them to ~5 of 18 slots a day and fired the rest
  # hours late (#2972, #3048). Once dispatch ran every slot (18/18 a day since
  # 2026-10-30), the crons only produced late duplicates, and a duplicate holds
  # the server's per-source lock: on 2026-11-04 the 02:17 nightly cron fired
  # at 09:15 as a second full run, and the 09:23 hourly dispatch got HTTP 409
  # for LV HE (#5329). They were no fallback anyway, since every sync job calls
  # the same API that dispatches. A dispatcher that stops is caught by
  # content-sync-watchdog.yml.
  workflow_dispatch:
    inputs:
      mode:
        # What the API dispatcher sends. 'hourly' is LV-only and `recent`,
        # still promotable to full by the catch-up below; 'full' — the default,
        # so a bare manual dispatch keeps meaning a full run — is the nightly
        # one. Ignored with source/landesverband.
        description: 'Run kind: full (all sources) or hourly (Landesverbände only)'
        type: choice
        options:
          - full
          - hourly
        default: full
      source:
        description: 'Single non-LV source (gruenblog, gruene-at, kommunalwiki, boell-stiftung, bundestag, bundestag-dip, abgeordnetenwatch, grundsatz, gruene-de, oesterreich, landtag-nrw, landtag-berlin, landtag-bayern). Mutually exclusive with landesverband.'
        required: false
        type: string
      landesverband:
        description: 'Single Landesverband shortName prefix (BB, BE, BY, HE, LSA, MV, NRW, SL, TH). Mutually exclusive with source.'
        required: false
        type: string
      dry_run:
        # Only 'landesverbaende', 'abgeordnetenwatch', 'landtag-nrw', 'landtag-berlin', 'landtag-bayern' and 'bundestag-dip' have a dry-run branch.
        # Every other source answers HTTP 400 rather than storing for real under
        # a report headed "Dry Run" (#2970) — so a dry run over the full matrix
        # is expected to fail those jobs.
        description: 'Preview without storing (landesverbaende, abgeordnetenwatch, landtag-nrw, landtag-berlin, landtag-bayern, bundestag-dip only)'
        type: boolean
        default: false
      force:
        description: 'Force re-index even if unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # The setup job asks the Actions API when a full run last happened, so a
  # dropped nightly slot can be caught up rather than silently skipped.
  actions: read

concurrency:
  # One group per run kind. A newer run cancels a *pending* one in the same
  # group, so dispatched hourly and full runs must not share one — an hourly
  # dispatch would otherwise drop a full run that is waiting its turn. Single
  # source/LV runs get their own group for the same reason.
  group: content-sync-${{ ((inputs.source || inputs.landesverband) && 'single') || inputs.mode || 'full' }}
  cancel-in-progress: false

jobs:
  # ─── Determine execution strategy ──────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      lv_matrix: ${{ steps.set.outputs.lv_matrix }}
      source_matrix: ${{ steps.set.outputs.source_matrix }}
      # The single answer to "is this the full nightly run?". Three jobs need
      # it — the source matrix here, the LV jobs' `recent` flag, the aggregate
      # digest's --no-email. Three copies of one decision is how an edit
      # silently demotes the nightly run in two of the three places and
      # nothing turns red. Decided once, read everywhere.
      is_full_run: ${{ steps.set.outputs.is_full_run }}
      single_kind: ${{ steps.set.outputs.single_kind }}
      single_value: ${{ steps.set.outputs.single_value }}
    steps:
      # Only so the local composite action below can be loaded; this job builds
      # nothing and needs no dependencies.
      - uses: actions/checkout@v7
      - id: lastfull
        uses: ./.github/actions/last-full-sync
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
      - id: set
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_LV: ${{ inputs.landesverband }}
          FULL_RUN_FOUND: ${{ steps.lastfull.outputs.found }}
          HOURS_SINCE_FULL: ${{ steps.lastfull.outputs.hours_since }}
        run: |
          # Which run is the full one is decided HERE and nowhere else.
          # First door: a dispatch without mode=hourly (the API's 02:17 slot,
          # or a bare manual dispatch).
          #
          # Second door into the full run: catch one up that never fired.
          #
          # The 02:17 slot is a single dispatch — lose it and the nine non-LV
          # sources, the full archive walks and the admin digest are skipped for the whole day,
          # with every run that *did* fire reporting success. Measured on
          # 2026-09-15: four of eighteen slots arrived, and no run at hour 2 for
          # nine days straight, so the non-LV corpus had been stale that long
          # while the workflow history was uniformly green.
          #
          # 22 h, not 24: at 24 the catch-up could never fire before the next
          # nightly slot and would be decorative. The floor is set by the widest
          # gap a HEALTHY schedule produces — nightly 02:17 to the last hourly
          # at 20:23 is 18 h, plus the drift GitHub adds under load (+88 min was
          # measured) — so 22 h clears it without firing on a schedule that is
          # merely late.
          #
          # `found=false` means no full run in the inspected window at all, which
          # is worse than a stale one, so it catches up too. An unreadable jobs
          # API can inflate the age here (see the action's `unreadable` output);
          # unlike the watchdog, the cost of being wrong is one redundant full
          # run rather than a false alarm, so this deliberately does not guard
          # against it.
          FULL_RUN_CATCHUP_HOURS=22

          if [ "$INPUT_MODE" != "hourly" ]; then
            IS_FULL_RUN=true
          elif [ "$FULL_RUN_FOUND" != "true" ]; then
            echo "::warning::No full Content Sync run found in the recent history — running this one as the full sync."
            IS_FULL_RUN=true
          elif [ -n "$HOURS_SINCE_FULL" ] && [ "$HOURS_SINCE_FULL" -gt "$FULL_RUN_CATCHUP_HOURS" ]; then
            echo "::warning::Last full Content Sync run was ${HOURS_SINCE_FULL}h ago (limit ${FULL_RUN_CATCHUP_HOURS}h) — catching one up now."
            IS_FULL_RUN=true
          else
            IS_FULL_RUN=false
          fi
          echo "is_full_run=$IS_FULL_RUN" >> "$GITHUB_OUTPUT"

          ALL_LVS='["BB","BE","BY","HE","LSA","MV","NRW","SL","TH"]'
          # bundestag-dip stays manual-only: its import is shelved so the Qdrant
          # disk keeps room for the nightly full snapshot (2026-10-06).
          ALL_SOURCES='["gruenblog","gruene-at","kommunalwiki","boell-stiftung","bundestag","abgeordnetenwatch","grundsatz","gruene-de","oesterreich","lv-instagram","landtag-nrw","landtag-berlin","landtag-bayern"]'
          EMPTY='[]'

          if [ -n "$INPUT_SOURCE" ] && [ -n "$INPUT_LV" ]; then
            echo "::error::Provide either 'source' or 'landesverband', not both."
            exit 1
          fi

          if [ -n "$INPUT_LV" ]; then
            echo "single_kind=landesverband" >> "$GITHUB_OUTPUT"
            echo "single_value=$INPUT_LV" >> "$GITHUB_OUTPUT"
            echo "lv_matrix=$EMPTY" >> "$GITHUB_OUTPUT"
            echo "source_matrix=$EMPTY" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SOURCE" ]; then
            echo "single_kind=source" >> "$GITHUB_OUTPUT"
            echo "single_value=$INPUT_SOURCE" >> "$GITHUB_OUTPUT"
            echo "lv_matrix=$EMPTY" >> "$GITHUB_OUTPUT"
            echo "source_matrix=$EMPTY" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FULL_RUN" = "true" ]; then
            # Nightly, full dispatch or catch-up → both matrices
            echo "single_kind=" >> "$GITHUB_OUTPUT"
            echo "single_value=" >> "$GITHUB_OUTPUT"
            echo "lv_matrix=$ALL_LVS" >> "$GITHUB_OUTPUT"
            echo "source_matrix=$ALL_SOURCES" >> "$GITHUB_OUTPUT"
          else
            # Hourly dispatch → LVs only
            echo "single_kind=" >> "$GITHUB_OUTPUT"
            echo "single_value=" >> "$GITHUB_OUTPUT"
            echo "lv_matrix=$ALL_LVS" >> "$GITHUB_OUTPUT"
            echo "source_matrix=$EMPTY" >> "$GITHUB_OUTPUT"
          fi

  # ─── Per-Landesverband matrix: one job, one mail per LV ────────
  sync-lv:
    name: Sync LV ${{ matrix.lv }}
    needs: setup
    if: needs.setup.outputs.lv_matrix != '[]' && needs.setup.outputs.lv_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        lv: ${{ fromJSON(needs.setup.outputs.lv_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      # The sync runs on the server; this job only posts the request and wraps
      # the response. wrap-sync-result.ts needs nothing but Node 22 (type
      # stripping), so no pnpm install: each matrix job used to pull the whole
      # API tree (~1700 packages) and died with it on a GitHub-releases 504
      # for the ffmpeg-static download (#5452).
      - uses: actions/setup-node@v7
        with:
          # A floor, not '22': type stripping is on by default only from
          # 22.18, and a cached older 22.x would otherwise be picked silently.
          node-version: '>=22.18.0 <23'

      - name: Run LV sync (sends own email if anything changed)
        id: sync
        continue-on-error: true
        run: |
          # Anything but the full run crawls only the newest items; the full
          # run does the per-URL walk. Decided in `setup`, not re-derived here.
          RECENT=false
          if [ "${{ needs.setup.outputs.is_full_run }}" != "true" ]; then RECENT=true; fi
          # SL nur inkrementell, bis #3631 in Produktion ausgerollt ist: die Wolke-
          # Pfade laufen nur im Voll-Lauf (recentSkip), und der alte Code würde die
          # zwei gesperrten Freigaben sonst wieder einlesen. Nach dem Rollout entfernen.
          if [ "${{ matrix.lv }}" = "SL" ]; then RECENT=true; fi
          FORCE=false
          if [ "${{ inputs.force }}" = "true" ]; then FORCE=true; fi
          DRY_RUN=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN=true; fi

          BODY=$(jq -nc \
            --arg lv "${{ matrix.lv }}" \
            --argjson recent $RECENT \
            --argjson force $FORCE \
            --argjson dryRun $DRY_RUN \
            --arg runUrl "$RUN_URL" \
            --arg fallbackEmail "$CONTENT_SYNC_EMAIL" \
            '{landesverband: $lv, recent: $recent, forceUpdate: $force, dryRun: $dryRun, runUrl: $runUrl, fallbackEmail: $fallbackEmail}')

          # Trigger as a background job and poll — full runs outlive the
          # reverse proxy's ~5 min timeout, so a synchronous call 504s.
          HTTP_CODE=$(.github/scripts/content-sync-request.sh landesverbaende "$BODY" /tmp/sync-response.json)
          RESPONSE_BODY=$(cat /tmp/sync-response.json)
          echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"

          WRAP_FLAGS="--id landesverband-${{ matrix.lv }} --http-code $HTTP_CODE"
          if [ "$DRY_RUN" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --force"; fi
          echo "$RESPONSE_BODY" | node apps/api/wrap-sync-result.ts $WRAP_FLAGS \
            > "$GITHUB_WORKSPACE/sync-summary-lv-${{ matrix.lv }}.json"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::LV sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CONTENT_SYNC_API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}
          CONTENT_SYNC_EMAIL: ${{ vars.CONTENT_SYNC_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Das Hochladen ist reine Telemetrie für den Sammel-Digest — die Synchronisation
      # selbst ist zu diesem Zeitpunkt schon durch. Ohne diesen Schalter reißt ein
      # Aussetzer des Artefakt-Blobspeichers einen Lauf rot, der `success: true` und
      # 0 Fehler gemeldet hat (so am 16.08.2026 bei LV SL: 443 Byte JSON, Upload
      # nach 134 s abgebrochen). Fällt der Upload aus, fehlt diese Quelle im Digest —
      # das ist der billigere Schaden als ein Fehlalarm plus Fehler-Mail.
      - name: Upload summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sync-summary-lv-${{ matrix.lv }}
          path: sync-summary-lv-${{ matrix.lv }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if sync had errors
        if: steps.sync.outcome == 'failure'
        run: exit 1

  # ─── Non-LV source matrix: aggregator handles email ────────────
  sync-source:
    name: Sync ${{ matrix.source }}
    needs: setup
    if: needs.setup.outputs.source_matrix != '[]' && needs.setup.outputs.source_matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        source: ${{ fromJSON(needs.setup.outputs.source_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      # The sync runs on the server; this job only posts the request and wraps
      # the response. wrap-sync-result.ts needs nothing but Node 22 (type
      # stripping), so no pnpm install: each matrix job used to pull the whole
      # API tree (~1700 packages) and died with it on a GitHub-releases 504
      # for the ffmpeg-static download (#5452).
      - uses: actions/setup-node@v7
        with:
          # A floor, not '22': type stripping is on by default only from
          # 22.18, and a cached older 22.x would otherwise be picked silently.
          node-version: '>=22.18.0 <23'

      - name: Run content sync
        id: sync
        continue-on-error: true
        run: |
          FORCE=false
          if [ "${{ inputs.force }}" = "true" ]; then FORCE=true; fi
          DRY_RUN=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN=true; fi

          BODY=$(jq -nc --argjson force $FORCE --argjson dryRun $DRY_RUN \
            '{forceUpdate: $force, dryRun: $dryRun}')

          HTTP_CODE=$(.github/scripts/content-sync-request.sh "${{ matrix.source }}" "$BODY" /tmp/sync-response.json)
          RESPONSE_BODY=$(cat /tmp/sync-response.json)
          echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"

          WRAP_FLAGS="--id ${{ matrix.source }} --http-code $HTTP_CODE"
          if [ "$DRY_RUN" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --force"; fi
          echo "$RESPONSE_BODY" | node apps/api/wrap-sync-result.ts $WRAP_FLAGS \
            > "$GITHUB_WORKSPACE/sync-summary-source-${{ matrix.source }}.json"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CONTENT_SYNC_API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}

      # Das Hochladen ist reine Telemetrie für den Sammel-Digest — die Synchronisation
      # selbst ist zu diesem Zeitpunkt schon durch. Ohne diesen Schalter reißt ein
      # Aussetzer des Artefakt-Blobspeichers einen Lauf rot, der `success: true` und
      # 0 Fehler gemeldet hat (so am 16.08.2026 bei LV SL: 443 Byte JSON, Upload
      # nach 134 s abgebrochen). Fällt der Upload aus, fehlt diese Quelle im Digest —
      # das ist der billigere Schaden als ein Fehlalarm plus Fehler-Mail.
      - name: Upload summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sync-summary-source-${{ matrix.source }}
          path: sync-summary-source-${{ matrix.source }}.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if sync had errors
        if: steps.sync.outcome == 'failure'
        run: exit 1

  # ─── Aggregate digest: one mail to admin covering ALL artifacts ─
  aggregate:
    name: Aggregate & Report
    needs: [setup, sync-lv, sync-source]
    if: always() && (needs.setup.outputs.lv_matrix != '[]' || needs.setup.outputs.source_matrix != '[]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      # The digest needs the API tree (email service), but never ffmpeg:
      # ffmpeg-static's install script downloads ~80 MB from GitHub releases,
      # and a 504 there failed the whole run (#5452). `!` denies the build for
      # this install only.
      - run: pnpm install --frozen-lockfile --filter @gruenerator/api... --allow-build '!ffmpeg-static'

      - name: Download all summaries
        uses: actions/download-artifact@v8
        with:
          path: summaries/
          pattern: sync-summary-*
          merge-multiple: true

      - name: Aggregate summaries
        # pnpm --filter sets cwd to apps/api/, so pass an absolute path.
        # Admin digest goes out on the daily run (and manual dispatch) only.
        # Hourly runs are LV-only and the per-LV jobs send their own mails, so
        # suppress the admin digest there to avoid hourly inbox spam.
        env:
          BREVO_SMTP_HOST: ${{ secrets.BREVO_SMTP_HOST }}
          BREVO_SMTP_PORT: ${{ secrets.BREVO_SMTP_PORT }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'Grünerator <info@gruenerator.eu>' }}
          CONTENT_SYNC_EMAIL: ${{ vars.CONTENT_SYNC_EMAIL }}
          SYNC_SUMMARY_PATH: ${{ github.workspace }}/sync-summary.json
        run: |
          ARGS="--dir ${{ github.workspace }}/summaries/"
          # Digest on the full run only (and on manual dispatch). Hourly runs
          # are LV-only and those jobs send their own mails. Decided in `setup`.
          if [ "${{ needs.setup.outputs.is_full_run }}" != "true" ]; then
            ARGS="$ARGS --no-email"
          fi
          echo "Running: pnpm --filter @gruenerator/api run sync:aggregate -- $ARGS"
          pnpm --filter @gruenerator/api run sync:aggregate -- $ARGS

      - name: Generate job summary
        if: always()
        run: |
          SUMMARY_FILE="${{ github.workspace }}/sync-summary.json"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "## ❌ Content Sync — No Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The sync script did not produce a summary file. Check the [workflow logs]($RUN_URL)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TIMESTAMP=$(jq -r '.timestamp' "$SUMMARY_FILE")
          DRY_RUN=$(jq -r '.dryRun' "$SUMMARY_FILE")
          FORCE=$(jq -r '.force' "$SUMMARY_FILE")
          TOTAL_SOURCES=$(jq -r '.totals.sources' "$SUMMARY_FILE")
          SUCCEEDED=$(jq -r '.totals.succeeded' "$SUMMARY_FILE")
          FAILED=$(jq -r '.totals.failed' "$SUMMARY_FILE")
          STORED=$(jq -r '.totals.stored' "$SUMMARY_FILE")
          UPDATED=$(jq -r '.totals.updated' "$SUMMARY_FILE")
          SKIPPED=$(jq -r '.totals.skipped' "$SUMMARY_FILE")
          FETCH_ERRORS=$(jq -r '.totals.fetchErrors // 0' "$SUMMARY_FILE")
          ERRORS=$(jq -r '.totals.errors' "$SUMMARY_FILE")
          DURATION=$(jq -r '.totalDuration' "$SUMMARY_FILE")

          if [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
            STATUS_ICON="⚠️"
          else
            STATUS_ICON="✅"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            TITLE="$STATUS_ICON Content Sync — Dry Run"
          else
            TITLE="$STATUS_ICON Content Sync Report"
          fi

          {
            echo "## $TITLE"
            echo ""
            echo "**Date:** $(date -d "$TIMESTAMP" '+%d.%m.%Y %H:%M UTC' 2>/dev/null || echo "$TIMESTAMP")"
            echo "**Duration:** ${DURATION}s"
            echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
            if [ "$FORCE" = "true" ]; then echo "**Mode:** Force re-index"; fi
            echo ""
            echo "### Totals"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Sources | $TOTAL_SOURCES ($SUCCEEDED ok, $FAILED failed) |"
            echo "| New documents | $STORED |"
            echo "| Updated | $UPDATED |"
            echo "| Skipped (unchanged) | $SKIPPED |"
            if [ "$FETCH_ERRORS" -gt 0 ]; then echo "| Unreachable pages | $FETCH_ERRORS |"; fi
            if [ "$ERRORS" -gt 0 ]; then echo "| **Errors** | **$ERRORS** |"; fi
            echo ""

            # Auslesen (PDF.js, bei Scans Mistral-OCR pro Seite) ist der teure
            # Teil des Laufs und in New/Updated/Skipped unsichtbar: ein vor der
            # Extraktion übersprungenes Dokument zählt dort wie ein danach
            # übersprungenes, kostet aber nichts. "Read for nothing" ist die
            # Zahl, an der man sieht, ob die Fingerprint-Gatter greifen — sie
            # sollte über die Läufe gegen 0 gehen.
            if [ "$(jq -r 'has("extraction")' "$SUMMARY_FILE")" = "true" ]; then
              echo "### Extraction"
              echo ""
              echo "| Metric | Documents | Pages |"
              echo "|--------|----------:|------:|"
              jq -r '.extraction | "| Read this run | \(.documents) | \(.pages) |"' "$SUMMARY_FILE"
              jq -r '.extraction | "| …of that via paid OCR | \(.ocrDocuments) | \(.ocrPages) |"' "$SUMMARY_FILE"
              jq -r '.extraction | "| Read for nothing (text unchanged) | \(.redundant) | — |"' "$SUMMARY_FILE"
              jq -r '.extraction.skipped | "| Not read — gated | \(.not_modified + .same_bytes + .freshly_indexed) | — |"' "$SUMMARY_FILE"
              echo ""
              jq -r '.extraction.skipped | "Gates: \(.not_modified) × HTTP 304 · \(.same_bytes) × identical bytes · \(.freshly_indexed) × freshly indexed"' "$SUMMARY_FILE"
              echo ""
            fi

            echo "### Per Source"
            echo ""
            echo "| Source | Status | New | Updated | Skipped | Unreachable | Dead links | Errors | Duration |"
            echo "|--------|--------|----:|--------:|--------:|------------:|-----------:|-------:|---------:|"

            jq -r '.sources[] | "| \(.name) | \(if .status == "success" then "✅" else "❌" end) | \(.stored) | \(.updated) | \(.skipped) | \(.fetchErrors // 0) | \(.deadLinks // 0) | \(.errors) | \(.duration)s |"' "$SUMMARY_FILE"

            echo ""

            FAILED_SOURCES=$(jq -r '.sources[] | select(.status == "failed") | "- **\(.name):** \(.error)"' "$SUMMARY_FILE")
            if [ -n "$FAILED_SOURCES" ]; then
              echo "### ❌ Failed Sources"
              echo ""
              echo "$FAILED_SOURCES"
              echo ""
            fi

            # Eine Quelle kann `status: success` melden und trotzdem an einzelnen
            # Dokumenten scheitern — genau diese Fälle waren bisher nur als nackte
            # Zahl sichtbar, der Grund stand allein im Prod-Log. `errorSamples` ist
            # eine serverseitig gedeckelte Stichprobe, deshalb der Hinweis, wenn
            # mehr Fehler gezählt als Meldungen mitgeschickt wurden.
            ERROR_DETAILS=$(jq -r '
              .sources[] | select((.errorSamples // []) | length > 0)
              | "- **\(.name)** (\(.errors) Fehler"
                + (if (.errorSamples | length) < .errors then ", \(.errorSamples | length) davon gezeigt" else "" end)
                + "):\n"
                + ([.errorSamples[] | "  - `" + . + "`"] | join("\n"))
            ' "$SUMMARY_FILE")
            if [ -n "$ERROR_DETAILS" ]; then
              echo "### ⚠️ Fehler im Einzelnen"
              echo ""
              echo "$ERROR_DETAILS"
              echo ""
            fi

            # Getrennt von den Fehlern, weil hier nichts zu reparieren ist:
            # Seiten, die die Quelle selbst noch verlinkt, aber mit 403/404/410
            # beantwortet. In `errors` gezählt wiederholten sie sich Nacht für
            # Nacht (#2971) und machten die Zahl bedeutungslos, die eigentlich
            # „hier ist etwas kaputt" heißen soll.
            DEAD_LINK_DETAILS=$(jq -r '
              .sources[] | select((.deadLinkSamples // []) | length > 0)
              | "- **\(.name)** (\(.deadLinks) tote Links"
                + (if (.deadLinkSamples | length) < .deadLinks then ", \(.deadLinkSamples | length) davon gezeigt" else "" end)
                + "):\n"
                + ([.deadLinkSamples[] | "  - `" + . + "`"] | join("\n"))
            ' "$SUMMARY_FILE")
            if [ -n "$DEAD_LINK_DETAILS" ]; then
              echo "### 🔗 Tote Links (Upstream)"
              echo ""
              echo "$DEAD_LINK_DETAILS"
              echo ""
            fi

            # `skipped` allein verbirgt, was ein Lauf kostet: `unchanged` und
            # die Freshness-Gatter sind gratis, ein `too_old` wird jede Nacht
            # neu abgerufen, bevor der Altersfilter es verwirft (#3200).
            SKIP_REASONS=$(jq -r '
              .sources[] | select((.skipReasons // {}) | length > 0)
              | "- **\(.name):** " + ([.skipReasons | to_entries | sort_by(-.value)[] | "\(.key) \(.value)"] | join(" · "))
            ' "$SUMMARY_FILE")
            if [ -n "$SKIP_REASONS" ]; then
              echo "### ⏭️ Übersprungen, nach Grund"
              echo ""
              echo "$SKIP_REASONS"
              echo ""
            fi

            # Landesverbände only: Datenqualitäts-Defektklassen unter den
            # gespeicherten/aktualisierten Dokumenten (siehe Q4 /
            # DocumentProcessor.qualityFlagsFor) — ohne diesen Zähler fielen
            # Fallback-Titel, generische Titel und geratene Daten nur auf, wenn
            # jemand von Hand hinsah (#3573–#3580).
            QUALITY_FLAGS=$(jq -r '
              .sources[] | select((.qualityFlags // {}) | length > 0)
              | "- **\(.name):** " + ([.qualityFlags | to_entries | sort_by(-.value)[] | "\(.key) \(.value)"] | join(" · "))
            ' "$SUMMARY_FILE")
            if [ -n "$QUALITY_FLAGS" ]; then
              echo "### 🔍 Datenqualität"
              echo ""
              echo "$QUALITY_FLAGS"
              echo ""
            fi

            NEW_CONTENT=$(jq -r '.sources[] | select(.stored > 0) | "- **\(.name):** +\(.stored) new documents"' "$SUMMARY_FILE")
            if [ -n "$NEW_CONTENT" ]; then
              echo "### 📥 New Content"
              echo ""
              echo "$NEW_CONTENT"
              echo ""
            fi
          } >> $GITHUB_STEP_SUMMARY

  # ─── Single-source / single-LV manual dispatch ─────────────────
  sync-single:
    # Not "Sync <value>": last-full-sync marks a full run by the matrix job
    # named "Sync gruene-de", and a single run of gruene-de would forge it.
    name: Sync single ${{ needs.setup.outputs.single_value }}
    needs: setup
    if: needs.setup.outputs.single_kind != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The sync runs on the server; this job only posts the request and wraps
      # the response. wrap-sync-result.ts needs nothing but Node 22 (type
      # stripping), so no pnpm install: each matrix job used to pull the whole
      # API tree (~1700 packages) and died with it on a GitHub-releases 504
      # for the ffmpeg-static download (#5452).
      - uses: actions/setup-node@v7
        with:
          # A floor, not '22': type stripping is on by default only from
          # 22.18, and a cached older 22.x would otherwise be picked silently.
          node-version: '>=22.18.0 <23'

      - name: Run content sync
        id: sync
        continue-on-error: true
        env:
          KIND: ${{ needs.setup.outputs.single_kind }}
          VAL: ${{ needs.setup.outputs.single_value }}
          CONTENT_SYNC_EMAIL: ${{ vars.CONTENT_SYNC_EMAIL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CONTENT_SYNC_API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FORCE=false
          if [ "${{ inputs.force }}" = "true" ]; then FORCE=true; fi
          DRY_RUN=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN=true; fi

          if [ "$KIND" = "landesverband" ]; then
            SOURCE_PATH="landesverbaende"
            WRAP_ID="landesverband-$VAL"
            BODY=$(jq -nc --arg lv "$VAL" --argjson force $FORCE --argjson dryRun $DRY_RUN \
              --arg runUrl "$RUN_URL" --arg fallbackEmail "$CONTENT_SYNC_EMAIL" \
              '{landesverband: $lv, forceUpdate: $force, dryRun: $dryRun, runUrl: $runUrl, fallbackEmail: $fallbackEmail}')
          else
            SOURCE_PATH="$VAL"
            WRAP_ID="$VAL"
            BODY=$(jq -nc --argjson force $FORCE --argjson dryRun $DRY_RUN '{forceUpdate: $force, dryRun: $dryRun}')
          fi

          # Manual single-source runs (e.g. abgeordnetenwatch full backfill)
          # can run long — allow the poll loop the job's full 120 min budget.
          HTTP_CODE=$(POLL_TIMEOUT_SECONDS=7000 .github/scripts/content-sync-request.sh "$SOURCE_PATH" "$BODY" /tmp/sync-response.json)
          RESPONSE_BODY=$(cat /tmp/sync-response.json)
          echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"

          WRAP_FLAGS="--id $WRAP_ID --http-code $HTTP_CODE"
          if [ "$DRY_RUN" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --force"; fi
          echo "$RESPONSE_BODY" | node apps/api/wrap-sync-result.ts $WRAP_FLAGS \
            > "$GITHUB_WORKSPACE/sync-summary.json"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Generate job summary
        if: always()
        run: |
          SUMMARY_FILE="${{ github.workspace }}/sync-summary.json"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "## ❌ Content Sync — No Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The sync script did not produce a summary file. Check the [workflow logs]($RUN_URL)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TIMESTAMP=$(jq -r '.timestamp' "$SUMMARY_FILE")
          DRY_RUN=$(jq -r '.dryRun' "$SUMMARY_FILE")
          STORED=$(jq -r '.totals.stored' "$SUMMARY_FILE")
          ERRORS=$(jq -r '.totals.errors' "$SUMMARY_FILE")
          DEAD_LINKS=$(jq -r '[.sources[].deadLinks // 0] | add // 0' "$SUMMARY_FILE")
          DURATION=$(jq -r '.totalDuration' "$SUMMARY_FILE")

          if [ "$ERRORS" -gt 0 ]; then STATUS_ICON="⚠️"; else STATUS_ICON="✅"; fi
          if [ "$DRY_RUN" = "true" ]; then TITLE="$STATUS_ICON ${{ needs.setup.outputs.single_value }} — Dry Run"; else TITLE="$STATUS_ICON ${{ needs.setup.outputs.single_value }}"; fi

          {
            echo "## $TITLE"
            echo ""
            echo "**Date:** $(date -d "$TIMESTAMP" '+%d.%m.%Y %H:%M UTC' 2>/dev/null || echo "$TIMESTAMP")"
            echo "**Duration:** ${DURATION}s | **New:** +${STORED} | **Errors:** ${ERRORS}"
            if [ "$DEAD_LINKS" -gt 0 ]; then
              echo ""
              jq -r '.sources[] | select((.deadLinkSamples // []) | length > 0)
                | "Tote Links (Upstream, \(.deadLinks)):\n" + ([.deadLinkSamples[] | "- `" + . + "`"] | join("\n"))' "$SUMMARY_FILE"
            fi
            jq -r '.sources[] | select((.skipReasons // {}) | length > 0)
              | "**Übersprungen:** " + ([.skipReasons | to_entries | sort_by(-.value)[] | "\(.key) \(.value)"] | join(" · "))' "$SUMMARY_FILE"
            jq -r '.sources[] | select((.qualityFlags // {}) | length > 0)
              | "**Datenqualität:** " + ([.qualityFlags | to_entries | sort_by(-.value)[] | "\(.key) \(.value)"] | join(" · "))' "$SUMMARY_FILE"
            if [ "$(jq -r 'has("extraction")' "$SUMMARY_FILE")" = "true" ]; then
              jq -r '.extraction | "**Read:** \(.documents) docs / \(.pages) pages (OCR: \(.ocrDocuments)/\(.ocrPages)) | **For nothing:** \(.redundant) | **Gated:** \(.skipped.not_modified + .skipped.same_bytes + .skipped.freshly_indexed)"' "$SUMMARY_FILE"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if sync had errors
        if: steps.sync.outcome == 'failure'
        run: exit 1
