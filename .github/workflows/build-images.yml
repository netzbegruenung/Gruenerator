name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - test-branch
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'documentation/**'
      - 'nginx.conf'
      - 'docker-compose.prod.yml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build all images regardless of changes'
        required: false
        default: 'false'
        type: boolean
      build_web:
        description: 'Build web image only'
        required: false
        default: 'false'
        type: boolean
      build_api:
        description: 'Build API image only'
        required: false
        default: 'false'
        type: boolean
      build_docs:
        description: 'Build docs image only'
        required: false
        default: 'false'
        type: boolean
      build_mcp:
        description: 'Build MCP image only'
        required: false
        default: 'false'
        type: boolean
      build_doku:
        description: 'Build doku image only'
        required: false
        default: 'false'
        type: boolean
      build_sites:
        description: 'Build sites image only'
        required: false
        default: 'false'
        type: boolean
      build_hocuspocus:
        description: 'Build hocuspocus image only'
        required: false
        default: 'false'
        type: boolean
      build_gruen_o_mat:
        description: 'Build gruen-o-mat image only'
        required: false
        default: 'false'
        type: boolean
      build_voxtral:
        description: 'Build voxtral image only'
        required: false
        default: 'false'
        type: boolean
      build_nlp:
        description: 'Build NLP image only'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gruenerator

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      sites: ${{ steps.filter.outputs.sites }}
      docs: ${{ steps.filter.outputs.docs }}
      hocuspocus: ${{ steps.filter.outputs.hocuspocus }}
      mcp: ${{ steps.filter.outputs.mcp }}
      doku: ${{ steps.filter.outputs.doku }}
      gruen-o-mat: ${{ steps.filter.outputs.gruen-o-mat }}
      voxtral: ${{ steps.filter.outputs.voxtral }}
      nlp: ${{ steps.filter.outputs.nlp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            shared:
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/docs/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/canvas-editor/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
              - 'packages/wolke/**'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
            sites:
              - 'apps/sites/**'
              - 'packages/shared/**'
              - 'packages/sites-design/**'
            docs:
              - 'apps/docs/**'
              - 'packages/shared/**'
              - 'packages/docs/**'
              - 'packages/collab/**'
              - 'packages/ui/**'
              - 'packages/wolke/**'
              - 'packages/slides/**'
            hocuspocus:
              - 'services/hocuspocus/**'
            mcp:
              - 'services/mcp/**'
              - 'packages/shared/**'
            gruen-o-mat:
              - 'apps/gruen-o-mat/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
            voxtral:
              - 'services/voxtral/**'
            nlp:
              - 'services/nlp/**'
            doku:
              - 'documentation/**'
  build-web:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.web == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event.inputs.build_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-web:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

  build-api:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.api == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event.inputs.build_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-sites:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.sites == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event.inputs.build_sites == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-sites
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/sites/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-sites:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-sites:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

  build-docs:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.docs == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event.inputs.build_docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
