name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - test-branch
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'documentation/**'
      - 'pnpm-lock.yaml'
      - 'nginx.conf'
      - 'docker-compose.prod.yml'
      - '.github/workflows/build-images.yml'
  # Sunday 03:00 UTC: rebuild every image so base-image patches (node:22-*,
  # python:3.12-slim) reach the registry without waiting for a code push.
  # Test picks the images up via Watchtower; prod rollout stays manual
  # (docs/CLAUDE-deployment.md).
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build all images regardless of changes'
        required: false
        default: 'false'
        type: boolean
      build_web:
        description: 'Build web image only'
        required: false
        default: 'false'
        type: boolean
      build_api:
        description: 'Build API image only'
        required: false
        default: 'false'
        type: boolean
      build_doku:
        description: 'Build doku image only'
        required: false
        default: 'false'
        type: boolean
      build_hocuspocus:
        description: 'Build hocuspocus image only'
        required: false
        default: 'false'
        type: boolean
      build_gruen_o_mat:
        description: 'Build gruen-o-mat image only'
        required: false
        default: 'false'
        type: boolean
      build_nlp:
        description: 'Build NLP image only'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
  packages: write

# Serialize builds per branch so concurrent merges can't race for the `:latest` tag.
# `cancel-in-progress: false` queues runs — each commit still gets its immutable
# `:sha-XXXXXXX` tag, and `:latest` always reflects merge order.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gruenerator

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      hocuspocus: ${{ steps.filter.outputs.hocuspocus }}
      doku: ${{ steps.filter.outputs.doku }}
      gruen-o-mat: ${{ steps.filter.outputs.gruen-o-mat }}
      nlp: ${{ steps.filter.outputs.nlp }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Resolve the paths-filter base to a REAL commit SHA. Push builds are
      # unchanged — they keep using the pre-push SHA (github.event.before). Only
      # the workflow_dispatch case (the beta rebuild kicked off by
      # sync-test-branch.yml, where `before` is empty) changes: instead of the
      # literal `<sha>^` — which paths-filter can't `git fetch` (fatal: invalid
      # refspec, breaking every dispatch build) — resolve the first parent to a
      # full SHA locally (present at fetch-depth: 2).
      - id: diffbase
        run: |
          before='${{ github.event.before }}'
          if [ -n "$before" ]; then
            # push: identical to before — diff against the pre-push SHA.
            echo "sha=$before" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch (beta rebuild): resolve the first parent to a full
            # SHA instead of the un-fetchable `<sha>^`.
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Real pre-push SHA (push) or first-parent SHA (dispatch) — see diffbase.
          # For a sync merge the first parent is the previous tip, so the whole
          # incoming master delta is diffed and the right images get built.
          base: ${{ steps.diffbase.outputs.sha }}
          filters: |
            shared:
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'packages/docs/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/canvas-editor/**'
              - 'packages/presentations/**'
              - 'packages/sheets/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
              - 'packages/wolke/**'
              - 'packages/sites/**'
              - 'packages/sites-design/**'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'pnpm-lock.yaml'
            hocuspocus:
              - 'services/hocuspocus/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'pnpm-lock.yaml'
            gruen-o-mat:
              - 'apps/gruen-o-mat/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
              - 'pnpm-lock.yaml'
            nlp:
              - 'services/nlp/**'
            doku:
              - 'documentation/**'
  build-web:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.web == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-web:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

  build-api:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.api == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-hocuspocus:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.hocuspocus == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_hocuspocus == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-hocuspocus
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/hocuspocus/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-hocuspocus:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-hocuspocus:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-gruen-o-mat:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.gruen-o-mat == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_gruen_o_mat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-gruen-o-mat
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/gruen-o-mat/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-gruen-o-mat:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-gruen-o-mat:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-nlp:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.nlp == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_nlp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-nlp
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./services/nlp
          file: services/nlp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-nlp:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-nlp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  build-doku:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.doku == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_doku == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-doku
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo root, not ./documentation: the build installs from the
          # workspace's pnpm-lock.yaml, which only exists here. The narrower
          # context had no lockfile at all, so npm re-resolved every build.
          # `documentation/Dockerfile.dockerignore` keeps this context small —
          # BuildKit prefers it over the root `.dockerignore`, which excludes
          # `documentation/` and would drop the very source being built.
          context: .
          file: documentation/Dockerfile
          push: true
          # Always rebuild the static site from scratch. The Docusaurus output is
          # cheap to build, but the registry buildcache has repeatedly served a
          # stale COPY/build layer (missing newly-merged docs pages), so caching
          # the build here causes silent content drift. cache-to still refreshes
          # the buildcache with correct layers for any future cached consumer.
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-doku:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-doku:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  summary:
    needs: [build-web, build-api, build-hocuspocus, build-gruen-o-mat, build-nlp, build-doku]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api | ${{ needs.build-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| hocuspocus | ${{ needs.build-hocuspocus.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gruen-o-mat | ${{ needs.build-gruen-o-mat.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nlp | ${{ needs.build-nlp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| doku | ${{ needs.build-doku.result }} |" >> $GITHUB_STEP_SUMMARY
