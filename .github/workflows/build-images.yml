name: Build and Push Docker Images

on:
  push:
    branches:
      - master
      - test-branch
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - 'documentation/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
      - '.dockerignore'
      - 'tsconfig.base.json'
      - 'tsconfig.strict-migration.json'
      - 'CHANGELOG.md'
      - 'nginx.conf'
      - 'docker-compose.prod.yml'
      - '.github/workflows/build-images.yml'
  # Build (never push) on PRs that change what an image build does, so an
  # install break surfaces on the PR instead of on master after the merge
  # (#3366, #3368 were green on their PRs). Narrower than the push paths on
  # purpose: app code already has typecheck/test, the image build is the only
  # check for Dockerfiles and the root install files. Every path here must
  # also be in a per-image filter below, or the run is green and builds nothing.
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/*.dockerignore'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
      - '.github/workflows/build-images.yml'
  # Sunday 03:00 UTC: rebuild every image so base-image patches (node:22-*,
  # python:3.12-slim) reach the registry without waiting for a code push.
  # Test picks the images up via Watchtower; prod rollout stays manual
  # (docs/CLAUDE-deployment.md).
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build all images regardless of changes'
        required: false
        default: 'false'
        type: boolean
      build_web:
        description: 'Build web image only'
        required: false
        default: 'false'
        type: boolean
      build_api:
        description: 'Build API image only'
        required: false
        default: 'false'
        type: boolean
      build_doku:
        description: 'Build doku image only'
        required: false
        default: 'false'
        type: boolean
      build_hocuspocus:
        description: 'Build hocuspocus image only'
        required: false
        default: 'false'
        type: boolean
      build_gruen_o_mat:
        description: 'Build gruen-o-mat image only'
        required: false
        default: 'false'
        type: boolean
      build_nlp:
        description: 'Build NLP image only'
        required: false
        default: 'false'
        type: boolean
      build_browser_agent:
        description: 'Build browser-agent image only'
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
  packages: write

# Serialize builds per branch so concurrent merges can't race for the `:latest` tag.
# `cancel-in-progress: false` queues runs — each commit still gets its immutable
# `:sha-XXXXXXX` tag, and `:latest` always reflects merge order.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/gruenerator

jobs:
  detect-changes:
    # Fork PRs get neither the Docker Hub secrets nor a writable token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists a PR's files through the API instead of git.
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      hocuspocus: ${{ steps.filter.outputs.hocuspocus }}
      doku: ${{ steps.filter.outputs.doku }}
      gruen-o-mat: ${{ steps.filter.outputs.gruen-o-mat }}
      nlp: ${{ steps.filter.outputs.nlp }}
      browser-agent: ${{ steps.filter.outputs.browser-agent }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Resolve the paths-filter base to a REAL commit SHA. Push builds are
      # unchanged — they keep using the pre-push SHA (github.event.before). Only
      # the workflow_dispatch case (the beta rebuild kicked off by
      # sync-test-branch.yml, where `before` is empty) changes: instead of the
      # literal `<sha>^` — which paths-filter can't `git fetch` (fatal: invalid
      # refspec, breaking every dispatch build) — resolve the first parent to a
      # full SHA locally (present at fetch-depth: 2).
      - id: diffbase
        run: |
          before='${{ github.event.before }}'
          if [ -n "$before" ]; then
            # push: identical to before — diff against the pre-push SHA.
            echo "sha=$before" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch (beta rebuild): resolve the first parent to a full
            # SHA instead of the un-fetchable `<sha>^`.
            echo "sha=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Real pre-push SHA (push) or first-parent SHA (dispatch) — see diffbase.
          # For a sync merge the first parent is the previous tip, so the whole
          # incoming master delta is diffed and the right images get built.
          base: ${{ steps.diffbase.outputs.sha }}
          # `install` lists the root files every node image copies before
          # `pnpm install`; they decide what the install does, so a change to
          # any of them must rebuild every node image. Keep it in sync with the
          # push/pull_request `paths:` above — the two layers are independent,
          # and a path only the trigger knows yields a green run that built
          # nothing.
          filters: |
            install: &install
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'patches/**'
              - '.dockerignore'
              - '.github/workflows/build-images.yml'
            tsconfig: &tsconfig
              - 'tsconfig.base.json'
              - 'tsconfig.strict-migration.json'
            shared:
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/ggraphic-schema/**'
              - *install
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/ggraphic-schema/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'packages/docs/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/canvas-editor/**'
              - 'packages/presentations/**'
              - 'packages/sheets/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
              - 'packages/ggraphic-core/**'
              - 'packages/wolke/**'
              - 'packages/sites/**'
              - 'packages/sites-design/**'
              - 'CHANGELOG.md'
              - *install
              - *tsconfig
            api:
              - 'apps/api/**'
              - 'services/hocuspocus/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/ggraphic-schema/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - *install
              - *tsconfig
            hocuspocus:
              - 'services/hocuspocus/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/ggraphic-schema/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - *install
              - *tsconfig
            gruen-o-mat:
              - 'apps/gruen-o-mat/**'
              - 'packages/chat/**'
              - 'packages/voice/**'
              - 'packages/shared/**'
              - 'packages/core/**'
              - 'packages/ggraphic-schema/**'
              - 'packages/contracts/**'
              - 'packages/query/**'
              - 'packages/ui/**'
              - 'packages/collab/**'
              - *install
              - *tsconfig
            nlp:
              - 'services/nlp/**'
            browser-agent:
              - 'services/browser-agent/**'
            doku:
              - 'documentation/**'
              - *install
  build-web:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.web == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-web:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}

  build-api:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.api == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-api:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  build-hocuspocus:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.hocuspocus == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_hocuspocus == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-hocuspocus
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/hocuspocus/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-hocuspocus:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-hocuspocus:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  build-gruen-o-mat:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.gruen-o-mat == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_gruen_o_mat == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-gruen-o-mat
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/gruen-o-mat/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-gruen-o-mat:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-gruen-o-mat:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  build-nlp:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.nlp == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_nlp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-nlp
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./services/nlp
          file: services/nlp/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-nlp:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-nlp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  build-browser-agent:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs['browser-agent'] == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_browser_agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-browser-agent
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./services/browser-agent
          file: services/browser-agent/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-browser-agent:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-browser-agent:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  build-doku:
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.doku == 'true' ||
      github.event.inputs.force_all == 'true' ||
      github.event_name == 'schedule' ||
      github.event.inputs.build_doku == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        # Dependabot PRs see only Dependabot secrets; they pull anonymously.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-doku
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo root, not ./documentation: the build installs from the
          # workspace's pnpm-lock.yaml, which only exists here. The narrower
          # context had no lockfile at all, so npm re-resolved every build.
          # `documentation/Dockerfile.dockerignore` keeps this context small —
          # BuildKit prefers it over the root `.dockerignore`, which excludes
          # `documentation/` and would drop the very source being built.
          context: .
          file: documentation/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Always rebuild the static site from scratch. The Docusaurus output is
          # cheap to build, but the registry buildcache has repeatedly served a
          # stale COPY/build layer (missing newly-merged docs pages), so caching
          # the build here causes silent content drift. cache-to still refreshes
          # the buildcache with correct layers for any future cached consumer.
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-doku:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}-doku:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE_PREFIX) || '' }}

  # test-branch mirrors master (sync-test-branch.yml), and its images are built
  # with the same build args. Rebuilding them after every sync produced the
  # same images a second time, ~9 min per merge. Instead, once master's images
  # are pushed, `:test-branch` is pointed at them — if test-branch carries
  # nothing of its own. When it does, sync-test-branch.yml still dispatches a
  # real build, and this job leaves the tags alone.
  #
  # All seven images, not just the ones this run built: a later master commit
  # without image changes runs no build, so this is the run that has to bring
  # test-branch level. Runs are serialized per ref, so `:master` already holds
  # every earlier merge.
  promote-test-branch:
    needs:
      [
        build-web,
        build-api,
        build-hocuspocus,
        build-gruen-o-mat,
        build-nlp,
        build-browser-agent,
        build-doku,
      ]
    if: >-
      always() &&
      github.ref == 'refs/heads/master' && github.event_name != 'pull_request' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # sync-test-branch.yml usually lands within a minute, long before the
      # builds are done; the wait covers a queued sync. Only a test-branch that
      # contains this commit and whose tree equals the master commit it
      # mirrors gets the master images.
      - name: Check that test-branch mirrors this commit
        id: mirror
        run: |
          contains() { case $(gh api "repos/$REPO/compare/$1...$2" --jq .status) in identical | ahead) return 0 ;; esac; return 1; }
          tree() { gh api "repos/$REPO/commits/$1" --jq .commit.tree.sha; }

          for _ in $(seq 40); do
            if contains "$GITHUB_SHA" test-branch; then
              head=$(gh api "repos/$REPO/commits/test-branch" --jq .sha)
              # A sync merge has the master commit as its last parent; a
              # fast-forward is a master commit itself.
              if contains "$head" master; then
                mirrored=$head
              else
                mirrored=$(gh api "repos/$REPO/commits/$head" --jq '.parents[-1].sha')
              fi
              if [ "$(tree "$head")" = "$(tree "$mirrored")" ] && contains "$GITHUB_SHA" "$mirrored"; then
                echo "test-branch $head mirrors master $mirrored — promoting."
                echo "head=$head" >> "$GITHUB_OUTPUT"
              else
                echo "test-branch $head carries its own changes — sync-test-branch.yml builds it."
              fi
              exit 0
            fi
            sleep 15
          done
          echo "::warning::test-branch did not pick up $GITHUB_SHA within 10 minutes (sync conflict or queued). Its images were not promoted."

      # A test-branch build dispatched by an earlier sync (when test-branch
      # still carried changes of its own) runs in its own concurrency group.
      # Finishing after the retag, it would put the older image back on
      # `:test-branch`. So it goes first.
      - name: Wait for running test-branch builds
        if: steps.mirror.outputs.head
        run: |
          for _ in $(seq 120); do
            running=$(gh api "repos/$REPO/actions/workflows/build-images.yml/runs?branch=test-branch&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$running" -eq 0 ] && exit 0
            echo "$running test-branch build(s) still running — waiting."
            sleep 15
          done
          echo "::error::test-branch builds still running after 30 minutes — not retagging over them."
          exit 1

      - name: Login to GitHub Container Registry
        if: steps.mirror.outputs.head
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tags a test-branch build would set: the branch tag the test
      # server pulls, and the short SHA of the test-branch commit.
      - name: Point test-branch tags at the master images
        if: steps.mirror.outputs.head
        env:
          HEAD_SHA: ${{ steps.mirror.outputs.head }}
        run: |
          failed=0
          for image in web api hocuspocus gruen-o-mat nlp browser-agent doku; do
            ref="$IMAGE_PREFIX-$image"
            if docker buildx imagetools create -t "$ref:test-branch" -t "$ref:${HEAD_SHA:0:7}" "$ref:master"; then
              echo "$image: :test-branch → :master"
            else
              echo "::error::$image: retag failed"
              failed=1
            fi
          done
          exit $failed

  summary:
    needs:
      [
        build-web,
        build-api,
        build-hocuspocus,
        build-gruen-o-mat,
        build-nlp,
        build-browser-agent,
        build-doku,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| web | ${{ needs.build-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api | ${{ needs.build-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| hocuspocus | ${{ needs.build-hocuspocus.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gruen-o-mat | ${{ needs.build-gruen-o-mat.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nlp | ${{ needs.build-nlp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| browser-agent | ${{ needs.build-browser-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| doku | ${{ needs.build-doku.result }} |" >> $GITHUB_STEP_SUMMARY
