name: PR Review

# Ein Claude-Code-Lauf auf dem Runner reviewt den PR. Der Ablauf steht
# ausgeschrieben im Prompt: `.claude/` ist gitignored, ein Projekt-`/review`
# gibt es auf dem Runner nicht, und der eingebaute Befehl braucht Subagenten,
# die hier nicht freigegeben sind (#4819). Befunde landen als Inline-Kommentare
# am Code, die Übersicht als PR-Kommentar.
#
# Läuft parallel zu ci.yml — eigener Workflow, eigene Concurrency-Gruppe, keine
# gemeinsamen Jobs. Auth über den Max-Abo-Token (`claude setup-token`), wie in
# docs-freshness.yml, nicht über einen Pay-per-Token-API-Key.

on:
  # Kein `branches:`-Filter, damit gestapelte PRs (Basis = ein anderer
  # Feature-Branch) nicht durchfallen — Begruendung in ci.yml, Befund in #3100.
  # Hier wog der Filter am schwersten: ci.yml und a11y.yml lassen sich zur Not
  # von Hand starten, dieser Workflow nicht. `workflow_dispatch` waere auch kein
  # Ersatz — `track_progress` funktioniert laut Action-Doku nur auf PR-/Issue-
  # Ereignissen, ein Dispatch-Lauf traegt den PR-Kontext nicht.
  #
  # Kein `synchronize`: jeder Push startete einen vollen Review (1,6 Laeufe pro
  # PR, alle auf dem Max-Abo-Kontingent). Nach Folge-Pushes das Label
  # `claude-review` setzen — der Lauf nimmt es selbst wieder ab, damit es beim
  # naechsten Mal erneut ausloest.
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

# Kein id-token: write — das OIDC-Token brauchte nur der App-Token-Tausch, und
# den ueberspringt die Action, seit github_token gesetzt ist.
permissions:
  contents: read
  pull-requests: write

# Auf einem PR-Zweig zählt nur die Spitze: ein neuer Push macht den laufenden
# Review gegenstandslos, seine Inline-Kommentare hingen an Zeilen, die es
# schon nicht mehr gibt. Jedes andere Label landet in einer eigenen Gruppe —
# sonst braeche es einen laufenden Review ab und wuerde selbst uebersprungen.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'claude-review' && '-other-label' || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    # Drafts nicht — dort ist der Diff noch in Bewegung, und jeder Push kostet
    # einen vollen Lauf. `ready_for_review` holt sie nach.
    # Bots nicht — Dependabot-PRs gehen ohnehin über dependabot-auto-merge.yml.
    # Forks nicht — dort hat der Job weder Secrets noch Schreibrechte, der Lauf
    # würde nur mit einem irreführenden Auth-Fehler enden.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    # Der Runner idlet fast nur — die Zeit geht an den Agenten, nicht an die CPU.
    timeout-minutes: 45
    steps:
      - name: Remove trigger label
        if: github.event.action == 'labeled'
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/claude-review" --silent
        env:
          GH_TOKEN: ${{ github.token }}

      # Jeder Lauf zieht vom Max-Abo-Kontingent — ein voller Sonnet-Review lag
      # bei ~2 $ API-Gegenwert, und eine Nacht davon hat das Kontingent geleert
      # (#4819). Darum: was nur Lockfile, Generiertes, Snapshots oder Doku
      # ändert, wird gar nicht reviewt; kleine Diffs bekommen Haiku; jeder Lauf
      # hat einen Turn-Deckel. Ein Lauf am Deckel endet rot, nicht grün.
      - name: Measure reviewable diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_RE: '(^|/)pnpm-lock\.yaml$|(^|/)skills-lock\.json$|\.generated\.[^/]+$|^documentation/src/generated/|\.snap$|\.mdx?$|^\.agents/'
          SMALL_LINES: '150'
          LARGE_MODEL: ${{ vars.PR_REVIEW_MODEL || 'claude-sonnet-5' }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | "\(.additions + .deletions)\t\(.status)\t\(.filename)\t\(.deletions)"' \
            | awk -F'\t' '$3 !~ ENVIRON["SKIP_RE"]' > "$RUNNER_TEMP/review-scope.tsv"

          LINES=$(awk -F'\t' '{s += $1} END {print s + 0}' "$RUNNER_TEMP/review-scope.tsv")
          awk -F'\t' '$2 != "removed" {print $3}' "$RUNNER_TEMP/review-scope.tsv" | sort -u > "$RUNNER_TEMP/review-files.txt"
          # Pure additions: the PR diff carries every changed line of these.
          # The patch's last line proves a diff output reached the file's end.
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed" and .deletions == 0 and .patch != null)
              | {file: .filename, last: (.patch | split("\n") | map(select(length > 0)) | last)}' \
            | jq -s --arg skip "$SKIP_RE" 'map(select(.file | test($skip) | not))' > "$RUNNER_TEMP/review-additions.json"
          FILES=$(grep -c . "$RUNNER_TEMP/review-files.txt" || true)

          if [ "$LINES" -lt "$SMALL_LINES" ]; then
            MODEL=claude-haiku-5-5; MAX_TURNS=25
          else
            MODEL="$LARGE_MODEL"; MAX_TURNS=50
          fi

          echo "Reviewbar: $LINES Zeilen in $FILES Dateien → $MODEL, max. $MAX_TURNS Turns"
          {
            echo "lines=$LINES"
            echo "files=$FILES"
            echo "model=$MODEL"
            echo "max_turns=$MAX_TURNS"
            echo "skip=$([ "$LINES" -eq 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Skip review
        if: steps.scope.outputs.skip == 'true'
        run: |
          echo "Kein reviewbarer Code im Diff (nur Lockfile, Generiertes, Snapshots oder Doku) — Review übersprungen."
          echo "## Claude Review übersprungen — kein reviewbarer Code im Diff." >> "$GITHUB_STEP_SUMMARY"

      # fetch-depth: 0, damit der Agent gegen den Basis-Branch diffen und
      # umliegenden Code lesen kann. Kein pnpm install: der Review liest Code,
      # er baut nichts.
      - uses: actions/checkout@v7
        if: steps.scope.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Review pull request
        id: review
        if: steps.scope.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        # Subagenten nur im Vordergrund (#4619). Die Action nimmt das erste
        # `result` der Sitzung und hört dann auf zu lesen
        # (base-action/src/run-claude-sdk.ts). Mit Hintergrund-Agenten endet
        # der erste Zug, bevor ein einziger Befund zurück ist — die
        # strukturierte Ausgabe meldet dann „läuft noch" mit 0 Befunden.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ohne dieses Feld tauscht die Action ihr OIDC-Token gegen ein Token
          # der Claude-Code-GitHub-App — die auf diesem Repo nicht installiert
          # ist, was den Job mit 401 beendet, bevor Claude ueberhaupt startet.
          # Ein explizites github_token wird in setupGitHubToken() direkt
          # zurueckgegeben und ueberspringt den Tausch. Kommentare kommen dann
          # von github-actions[bot] statt von claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            Reviewe PR #${{ github.event.pull_request.number }} auf Fehler.

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Der PR-Branch ist bereits in das Arbeitsverzeichnis ausgecheckt.

            Arbeite selbst, ohne Subagenten, in dieser Reihenfolge:
            1. `gh pr view` und `gh pr diff` lesen. Lockfiles, generierte
               Dateien, Snapshots und reine Doku überspringen.
            2. Jede geänderte Quelldatei mit Read öffnen und den umliegenden
               Code lesen; Aufrufer und Gegenstellen per Grep suchen. Kein
               Befund ohne gelesenen Kontext.
            3. Jeden Kandidaten am Code verifizieren. CONFIRMED nur mit einem
               konkreten Fehlerszenario (Eingabe oder Zustand → falsches
               Ergebnis); sonst PLAUSIBLE oder verwerfen.

            Halte dich an die Konventionen aus der CLAUDE.md im
            Wurzelverzeichnis und an eine CLAUDE.md im betroffenen Paket.
            Besonders relevant: die Frozen-Stufen F0/F1/F2 bei Umbenennungen, der
            Vier-Schichten-Typcheck (Contract → Zod → Drizzle → ts-rest) bei
            Feature-Änderungen, und dass parteiinterne Inhalte nicht in dieses
            öffentliche Repo gehören.

            Poste das Ergebnis ausschließlich als GitHub-Kommentare, nicht als
            Antworttext:
            - Jeden überlebenden Befund per
              `mcp__github_inline_comment__create_inline_comment` (mit
              `confirmed: true`) an seine Datei und Zeile.
            - Die 2–3-Sätze-Übersicht per `gh pr comment`.
            - Nichts überlebt die Verifikation? Dann nur die Übersicht mit einem
              entsprechenden Hinweis, keine Inline-Kommentare.

            Gib am Ende die strukturierte Zusammenfassung ab. `confirmed_blocking`
            zählt NUR Befunde mit Verdikt CONFIRMED in den Kategorien
            correctness und security — die machen den Check rot. Alles andere
            (PLAUSIBLE, Stil, Vereinfachung, Effizienz, Testabdeckung) zählt zu
            `advisory` und blockiert nicht. `review_complete` ist nur dann
            `true`, wenn jeder Teil des Reviews zurück ist und Verifikation,
            Inline-Kommentare und Übersicht erledigt sind — sonst `false`.
          claude_args: |
            --model ${{ steps.scope.outputs.model }}
            --max-turns ${{ steps.scope.outputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"overview":{"type":"string"},"confirmed_blocking":{"type":"integer"},"advisory":{"type":"integer"},"blocking_titles":{"type":"array","items":{"type":"string"}},"review_complete":{"type":"boolean"}},"required":["overview","confirmed_blocking","advisory","blocking_titles","review_complete"]}'

      # Der Check wird rot, sobald ein bestätigter Korrektheits- oder
      # Sicherheitsbefund überlebt. Leere Ausgabe heißt: der Review ist nicht
      # durchgelaufen — das ist ebenfalls rot, sonst wäre ein Ausfall der Action
      # von „nichts gefunden" nicht zu unterscheiden. Dasselbe gilt für eine
      # gültige Ausgabe, deren Zug vor dem Ende des Reviews schloss: sie trägt
      # ebenfalls 0 Befunde (#4619). Darum zählt `review_complete`, nicht der
      # Wortlaut der Übersicht.
      # Läuft auch, wenn die Action rot endet: ohne `show_full_output` steht
      # sonst nirgends, welche Werkzeuge verweigert wurden und was das Modell
      # zuletzt sagte — genau das fehlte bei #4819.
      - name: Show run diagnostics
        if: always() && steps.review.outcome != 'skipped'
        run: |
          EXEC="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$EXEC" ] || { echo "Keine Ausführungsdatei."; exit 0; }
          jq -r '[.[] | select(.type == "result")] | last
            | "subtype=\(.subtype) is_error=\(.is_error) num_turns=\(.num_turns) cost_usd=\(.total_cost_usd)",
              "verweigert:", (.permission_denials[]? | "  \(.tool_name) \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:200])"),
              "Ergebnistext: \((.result // "") | .[0:1500])"' "$EXEC"
          # Was der Lauf getan hat, Aufruf für Aufruf — ohne das bleibt bei
          # einem flachen Review nur die Zahl, nicht der Grund.
          echo "Werkzeugaufrufe:"
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")
            | "  \(.name) \((.input.file_path // .input.path // .input.command // .input.pattern // "") | tostring | .[0:200])"' "$EXEC"
          jq -r '"Werkzeugergebnisse: \([.[] | select(.type == "user") | .message.content[]? | select(.type == "tool_result")] | length)"' "$EXEC"

      - name: Gate on confirmed findings
        if: steps.scope.outputs.skip != 'true'
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
          FILES: ${{ steps.scope.outputs.files }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::error::Der Review hat keine strukturierte Ausgabe geliefert — der Lauf ist nicht durchgekommen (Auth, Timeout oder Action-Fehler). Das ist kein Befund am Code."
            exit 1
          fi

          echo "$RESULT" | jq .

          if ! echo "$RESULT" | jq -e '.review_complete == true' > /dev/null; then
            echo "::error::Der Review ist nicht fertig geworden (review_complete ist nicht true) — die 0 Befunde heißen hier nicht „nichts gefunden“. Label claude-review setzen, um ihn neu zu starten."
            exit 1
          fi

          # Ein flacher Lauf meldet `review_complete: true`, ohne den Code
          # gesehen zu haben (#4818: 13 Turns, 2600 Zeilen, grün). Darum muss er
          # mindestens drei der geänderten Dateien wirklich geöffnet haben (bei
          # weniger Dateien: alle) — per Read, oder per Grep auf genau diese
          # Datei mit `output_mode: content`. Grep ohne den Modus liefert nur
          # Dateinamen, keine Zeile Code.
          # Eine Datei mit reinen Ergänzungen zählt auch, wenn ein
          # Werkzeugergebnis ihren Diff vollständig zeigte: Kopf `+++ b/<datei>`
          # und die letzte Zeile ihres Patches im selben Ergebnis (#4839, ein
          # angehängter Testblock galt dreimal als ungelesen). Ein gekürzter
          # Diff (`| head`) reicht nicht bis dorthin. Mit Löschungen bleibt
          # Lesen Pflicht — der Diff zeigt dann nicht, was stehen bleibt.
          NEED=$(( FILES < 3 ? FILES : 3 ))
          OPENED=$({
              jq -r '.[] | select(.type == "assistant") | .message.content[]?
                | select(.type == "tool_use")
                | if .name == "Read" then .input.file_path
                  elif .name == "Grep" and .input.output_mode == "content" then .input.path
                  else empty end
                | strings' \
                "$RUNNER_TEMP/claude-execution-output.json" | sed "s#^$GITHUB_WORKSPACE/##"
              jq -r --slurpfile adds "$RUNNER_TEMP/review-additions.json" '
                [.[] | select(.type == "user") | .message.content[]?
                  | select(.type == "tool_result") | .content
                  | if type == "string" then . else (map(.text? // "") | join("\n")) end] as $out
                | $adds[0][] | . as $a
                | select(any($out[]; contains("+++ b/" + $a.file) and contains($a.last)))
                | .file' \
                "$RUNNER_TEMP/claude-execution-output.json"
            } | sort -u \
            | comm -12 - "$RUNNER_TEMP/review-files.txt" | grep -c . || true)
          echo "Geöffnete geänderte Dateien: $OPENED von $FILES (nötig: $NEED)"
          if [ "$OPENED" -lt "$NEED" ]; then
            echo "::error::Der Review hat nur $OPENED der geänderten Dateien gelesen (nötig: $NEED) — das ist kein Review, egal was die Ausgabe meldet. Label claude-review setzen, um ihn neu zu starten."
            exit 1
          fi

          # Ein reiner Lösch-PR hat nichts zum Öffnen — sein Risiko sind
          # verwaiste Verweise, also muss der Lauf danach gesucht haben.
          if [ "$FILES" -eq 0 ]; then
            GREPS=$(jq '[.[] | select(.type == "assistant") | .message.content[]?
                | select(.type == "tool_use" and .name == "Grep")] | length' \
                "$RUNNER_TEMP/claude-execution-output.json" || echo 0)
            if [ "$GREPS" -eq 0 ]; then
              echo "::error::Der PR löscht nur, und der Review hat nicht nach verbliebenen Verweisen gesucht (kein Grep). Label claude-review setzen, um ihn neu zu starten."
              exit 1
            fi
          fi

          BLOCKING=$(echo "$RESULT" | jq -r '.confirmed_blocking // 0')
          ADVISORY=$(echo "$RESULT" | jq -r '.advisory // 0')

          {
            echo "## Claude Review"
            echo
            echo "$RESULT" | jq -r '.overview'
            echo
            echo "| | Anzahl |"
            echo "|---|---|"
            echo "| Bestätigt, blockierend | $BLOCKING |"
            echo "| Beratend | $ADVISORY |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BLOCKING" -gt 0 ]; then
            echo
            echo "$RESULT" | jq -r '.blocking_titles[]' | while read -r t; do
              echo "::error::$t"
            done
            echo "$BLOCKING bestätigte(r) Befund(e) — siehe die Inline-Kommentare am PR."
            exit 1
          fi

          echo "Keine bestätigten blockierenden Befunde ($ADVISORY beratend)."
