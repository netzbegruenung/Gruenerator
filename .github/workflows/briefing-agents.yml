name: Briefing Agents

permissions:
  contents: read

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: {}

concurrency:
  group: briefing-agents
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Validate secrets
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN secret is not set. Configure it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ADMIN_TOKEN is configured"

      - name: Trigger due briefing agents
        env:
          API_URL: ${{ vars.API_URL || 'https://gruenerator.eu' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "Triggering briefing agent execution at $(date -u)"

          MAX_RETRIES=3
          RETRY_DELAY=10

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "Attempt ${ATTEMPT}/${MAX_RETRIES}"

            RESPONSE=$(curl -sf -w "\n%{http_code}" -X POST "${API_URL}/api/internal/briefing/execute-due" \
              -H "x-admin-token: ${ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              --connect-timeout 30 \
              --max-time 300 2>&1) && CURL_EXIT=0 || CURL_EXIT=$?

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "HTTP Status: ${HTTP_CODE}"
            echo "Response: ${BODY}"

            # Success
            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -lt 400 ]; then
              break
            fi

            # Auth failure — no point retrying
            if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "::error::Authentication failed (HTTP ${HTTP_CODE}). Check that ADMIN_TOKEN matches the server's ADMIN_TOKEN env var."
              exit 1
            fi

            # Retryable failure
            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "::warning::Attempt ${ATTEMPT} failed (exit=${CURL_EXIT}, HTTP=${HTTP_CODE}). Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            else
              echo "::error::All ${MAX_RETRIES} attempts failed. Last: exit=${CURL_EXIT}, HTTP=${HTTP_CODE}"
              exit 1
            fi
          done

          # Extract stats for GitHub summary
          PROCESSED=$(echo "$BODY" | jq -r '.processed // 0')
          SUCCEEDED=$(echo "$BODY" | jq -r '.succeeded // 0')
          FAILED=$(echo "$BODY" | jq -r '.failed // 0')

          echo "## Briefing Agents Execution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Processed | ${PROCESSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Succeeded | ${SUCCEEDED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::${FAILED} briefing agent(s) failed"
          fi
