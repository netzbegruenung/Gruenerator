name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Required for the merge queue: GitHub builds each queued PR on a temporary
  # `gh-readonly-queue/*` branch and fires `merge_group`. Without this trigger
  # the required checks never report on the queue and it hangs forever.
  merge_group:

permissions:
  contents: read

# On PR branches, superseding a run is what you want — only the tip matters.
# On master it is not: every push there is the post-merge verification of one
# merge, and cancelling it means that merge is never verified. Merging several
# PRs in a row used to cancel all but the last run, so a break could land
# unnoticed (it did — see #1988, where 6 of 7 master runs were cancelled and
# only the last one caught a red format:check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Singleton dependency versions
        run: node scripts/check-singleton-versions.mjs

      # Tours target elements via [data-tour="..."] selectors; a refactor that
      # renames or drops the attribute breaks the tour silently (waitForElement
      # times out, the step never shows). Keep selectors and JSX anchors 1:1.
      - name: Tour anchors in sync
        run: node scripts/check-tour-anchors.mjs

      # A swallowed error in the chat stack is invisible: the turn looks
      # successful and the artefact/answer is silently missing. Ratchet against
      # a baseline — the count may fall, never rise.
      - name: No new silent error swallows
        run: node scripts/check-silent-swallows.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: TypeScript type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier format check
        run: pnpm format:check

      # Generated artifacts that drift silently when their source changes on a
      # DIFFERENT branch. docs-build.yml already checks these, but it is
      # path-filtered — so a PR that does not touch documentation/ skips it and
      # can still merge stale. As an always-on required check these catch the
      # cross-branch drift that broke master repeatedly (docs index, UiLabel
      # manifest, settings catalog).
      - name: Generated artifacts in sync
        run: |
          pnpm --filter @gruenerator/documentation labels:check
          pnpm --filter @gruenerator/documentation settings:check
          pnpm --filter @gruenerator/documentation docs:index:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, docs, sites, wordpress]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @gruenerator/${{ matrix.app }}...

      - name: Build ${{ matrix.app }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: pnpm turbo run build --filter=@gruenerator/${{ matrix.app }}
