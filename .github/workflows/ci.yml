name: CI

on:
  push:
    branches: [master, main]
  # BEWUSST OHNE `branches:`-Filter. Der Filter greift auf den BASIS-Branch, ein
  # gestapelter PR (Basis = ein anderer Feature-Branch) fiel damit komplett aus
  # dieser Lane heraus — bei einem Stapel also alles ausser dem untersten PR.
  # Gemessen an #3097 (Basis ein Feature-Branch) gegen #3098 (derselbe Commit,
  # Basis master): 7 gegen 19 Checks. #3094 wurde so in einen Feature-Branch
  # gemergt, ohne je getypecheckt oder reviewt worden zu sein (#3100).
  #
  # Der Preis dafuer ist gering: von ~400 PRs waren 14 gestapelt, und keiner
  # zielte je auf einen langlebigen Branch — `test-branch` wird per push
  # synchronisiert (sync-test-branch.yml), nicht per PR. `push:` bleibt auf
  # master beschraenkt.
  pull_request:
  # Required for the merge queue: GitHub builds each queued PR on a temporary
  # `gh-readonly-queue/*` branch and fires `merge_group`. Without this trigger
  # the required checks never report on the queue and it hangs forever.
  merge_group:
  # Von Hand auslösbar, damit der volle Lauf ohne offenen PR auf den Runner
  # geht statt lokal zu laufen: `gh workflow run ci.yml --ref <branch>`.
  # typecheck/lint/format/test lokal zu wiederholen kostet ~6 GB RAM — hier
  # laufen sie ohnehin bei jedem PR.
  workflow_dispatch:

permissions:
  contents: read

# On PR branches, superseding a run is what you want — only the tip matters.
# On master it is not: every push there is the post-merge verification of one
# merge, and cancelling it means that merge is never verified. Merging several
# PRs in a row used to cancel all but the last run, so a break could land
# unnoticed (it did — see #1988, where 6 of 7 master runs were cancelled and
# only the last one caught a red format:check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The Turborepo remote cache belongs in EVERY job that runs a turbo task, not
# just `build`. typecheck and lint are the two most expensive things this
# workflow does (261s and 242s of a 613s job) and both were running stone cold
# on every single run because these two variables were scoped to the build job
# alone. On a PR that touches one package, the other 22 typecheck tasks and 12
# lint tasks are cache hits.
#
# Fork PRs get empty strings here; turbo then silently runs without a remote
# cache instead of failing.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  # turbo hashes it for every `test` task (turbo.json), so the plan job has to
  # see the same value as the test jobs or its hashes never match theirs.
  MIGRATIONS_TEST_DATABASE_URL: postgresql://gruenerator@localhost:5433/gruenerator

jobs:
  # A PR whose turbo tasks would all be cache hits still paid for 16 jobs:
  # checkout, pnpm install (30-50 s) and a Postgres container each, for 2-3 s
  # of replayed logs (#4820: 22 job-minutes per push for one YAML file). This
  # job asks turbo first — `--dry=json` needs no node_modules and reports the
  # remote-cache status per task — and drops every job whose tasks are all
  # hits. The hashes are the ones the real jobs compute: on 901c6167 all 106
  # task hashes of typecheck, lint, every test shard and every build matched
  # the CI logs.
  #
  # Only pull_request skips anything. master, the merge queue and manual runs
  # get the full set, the test jobs there with --force as before. A hit means
  # a run with byte-identical inputs passed; a test reading a file outside its
  # turbo `inputs` is what the post-merge --force run is for.
  #
  # Skipping needs an explicit `false`. Any turbo error leaves the value empty
  # and the job runs.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      typecheck: ${{ steps.plan.outputs.typecheck }}
      lint: ${{ steps.plan.outputs.lint }}
      tests: ${{ steps.plan.outputs.tests }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # HEAD^1 of the PR merge ref is the base tip, for the manifest diff.
          fetch-depth: 2

      # One job per package group, the two big suites sharded. All test tasks
      # in one job ran concurrently on 4 vCPUs: run 37010012025 spent 12:37 in
      # `turbo run test`, api (632 s) and web (626 s) fighting chat and canvas
      # for the same cores, and jsdom tests hit the 5 s default (#4010). `rest`
      # is every package not named here, so a new package lands in it without
      # an edit. turbo hashes the pass-through `--shard`, so each shard caches
      # alone.
      #
      # `mobile native` is the app's Jest lane (`test:native`, jest-expo): the
      # screen and hook tests that need the real RN runtime. `test` there is
      # only Vitest, so without this entry those suites never ran in CI and a
      # stale one merged green (#4225).
      - name: Decide which jobs have work
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SHARDS: >-
            [
              {"name": "api 1/3", "pkg": "api", "shard": "1/3"},
              {"name": "api 2/3", "pkg": "api", "shard": "2/3"},
              {"name": "api 3/3", "pkg": "api", "shard": "3/3"},
              {"name": "web 1/2", "pkg": "web", "shard": "1/2"},
              {"name": "web 2/2", "pkg": "web", "shard": "2/2"},
              {"name": "chat", "pkg": "chat"},
              {"name": "mobile native", "pkg": "mobile", "task": "test:native"},
              {"name": "rest"}
            ]
          # Web builds `build:check`, not `build`: its output is a few hundred
          # MB, most of it copied from public/, and Vercel rejects that upload
          # with a 400, so the cache never held it and every PR rebuilt (#4824).
          # `build:check` caches only the log. Cutting public/ out of the
          # `build` outputs instead would let a cache hit restore a bundle
          # without Pyodide or illustrations.
          APPS: >-
            [
              {"app": "web", "task": "build:check"},
              {"app": "api", "task": "build"},
              {"app": "docs", "task": "build"},
              {"app": "wordpress", "task": "build"}
            ]
        run: |
          TURBO="npx --yes turbo@$(grep -m1 -oE '^  turbo@[0-9.]+' pnpm-lock.yaml | cut -d@ -f2)"

          # Prints true/false: does any task of this run miss the cache?
          needed() {
            local dry
            dry=$($TURBO run --dry=json "$@")
            jq '[.tasks[] | select(.command != "<NONEXISTENT>" and .cache.status != "HIT")] | length > 0' <<< "$dry"
          }

          if [ "$EVENT" != pull_request ]; then
            {
              echo "typecheck=true"
              echo "lint=true"
              echo "tests=$(jq -c . <<< "$SHARDS")"
              echo "builds=$(jq -c . <<< "$APPS")"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TYPECHECK=$(needed typecheck)
          # The typecheck job also runs the two checks that read node_modules
          # against the manifests. A manifest change has to reach them even
          # when every typecheck task is a hit.
          # A file, not a pipe: under pipefail an early `grep -q` exit kills
          # git diff with SIGPIPE and the condition reads as false.
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -qE '(^|/)package\.json$|^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^\.npmrc$|^scripts/check-(override-ranges|installed-lockfile-drift)\.mjs$' "$RUNNER_TEMP/changed.txt"; then
            TYPECHECK=true
          fi
          LINT=$(needed lint)

          TESTS='[]'
          while read -r entry; do
            pkg=$(jq -r '.pkg // empty' <<< "$entry")
            task=$(jq -r '.task // "test"' <<< "$entry")
            shard=$(jq -r '.shard // empty' <<< "$entry")
            if [ -n "$pkg" ]; then
              filters=("--filter=@gruenerator/$pkg")
            else
              filters=(--filter=!@gruenerator/api --filter=!@gruenerator/web --filter=!@gruenerator/chat)
            fi
            args=("$task" "${filters[@]}")
            [ -n "$shard" ] && args+=(-- "--shard=$shard")
            run=$(needed "${args[@]}")
            echo "Tests ($(jq -r .name <<< "$entry")): needed=$run"
            [ "$run" = false ] || TESTS=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$TESTS")
          done < <(jq -c '.[]' <<< "$SHARDS")

          BUILDS='[]'
          while read -r entry; do
            app=$(jq -r .app <<< "$entry")
            run=$(needed "$(jq -r .task <<< "$entry")" "--filter=@gruenerator/$app")
            echo "Build $app: needed=$run"
            [ "$run" = false ] || BUILDS=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$BUILDS")
          done < <(jq -c '.[]' <<< "$APPS")

          echo "Typecheck: needed=$TYPECHECK"
          echo "ESLint: needed=$LINT"
          {
            echo "typecheck=$TYPECHECK"
            echo "lint=$LINT"
            echo "tests=$TESTS"
            echo "builds=$BUILDS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Plan"
            echo
            echo "Jobs whose turbo tasks are all cache hits are skipped."
            echo
            echo "| Job | Runs |"
            echo "|---|---|"
            echo "| Typecheck | $TYPECHECK |"
            echo "| ESLint | $LINT |"
            echo "| Tests | $(jq -r 'map(.name) | join(", ") | if . == "" then "none" else . end' <<< "$TESTS") |"
            echo "| Build | $(jq -r 'join(", ") | if . == "" then "none" else . end' <<< "$BUILDS") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Bare-node guards: no pnpm store restore (27s), no install (20s). They cost
  # about a second each and are the cheapest possible signal, so they get their
  # own job and nothing waits on them — a failure here shows up red next to the
  # slower jobs rather than gating them.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Dependabot only alerts on what GitHub's advisory graph maps onto the
      # lockfile. `pnpm audit` reads the same lockfile against the registry's
      # advisory database and found brace-expansion 1.x (high) that Dependabot
      # never flagged (#3185). Production dependencies only, fails on high or
      # critical, needs no install. Advisories without a usable patch are
      # listed in package.json `pnpm.auditConfig.ignoreGhsas`; each one has a
      # dismissed Dependabot alert carrying the reason and a re-check date
      # (docs/CLAUDE-deps.md › B2/B3).
      - name: pnpm audit (production deps, high or worse)
        run: pnpm audit --prod --audit-level high

      - name: Singleton dependency versions
        run: node scripts/check-singleton-versions.mjs

      # Dependabot cannot edit pnpm.overrides, so a bump of an overridden
      # package lands the new version in the lockfile's overrides block only.
      # `pnpm install --frozen-lockfile` then dies with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, which reads like a corrupt lockfile
      # instead of the one-line manifest edit it is (#2097, #2098). Runs before
      # install, on bare node, so the failure names the real cause.
      - name: pnpm.overrides in sync with the lockfile
        run: node scripts/sync-pnpm-overrides.mjs --check

      # Kein `@gruenerator/*`-Name ist auf npm registriert. Ein interner
      # Dependency-Spec, der nicht `workspace:` sagt, wandert damit zur
      # öffentlichen Registry — genau die Lücke, die ein Angreifer besetzen
      # kann (Dependency Confusion, gemeldet 30.07.2026).
      - name: Workspace packages private and workspace-resolved
        run: node scripts/check-workspace-packages.mjs

      # Tours target elements via [data-tour="..."] selectors; a refactor that
      # renames or drops the attribute breaks the tour silently (waitForElement
      # times out, the step never shows). Keep selectors and JSX anchors 1:1.
      - name: Tour anchors in sync
        run: node scripts/check-tour-anchors.mjs

      # A portalled popup on shadcn's default z-50 lands below the sidebars
      # (z-[1001]/z-[1005]) and below any open dialog (z-[1010]). It stays
      # visible but unclickable, which reads as a dead control, not a z-index
      # bug. Pin every portalled surface to the modal/popup/tooltip scale.
      - name: Overlay z-index layers
        run: node scripts/check-overlay-layers.mjs

      # `(?<=…)`/`(?<!…)` need Safari 16.4; apps/web builds for safari15. WebKit
      # below that throws `Invalid regular expression: invalid group specifier
      # name` at the pattern and unmounts the React subtree around it. Neither
      # tsc, ESLint, esbuild nor vitest (V8) sees it — GlitchTip issue 561.
      - name: No regex lookbehind in browser code
        run: node scripts/check-browser-lookbehind.mjs

      # A swallowed error in the chat stack is invisible: the turn looks
      # successful and the artefact/answer is silently missing. Ratchet against
      # a baseline — the count may fall, never rise.
      - name: No new silent error swallows
        run: node scripts/check-silent-swallows.mjs

      # This repo is public. Party-internal content (skill prompt bodies, corpus
      # dumps) must stay out of it — and .gitignore alone does not do that for
      # files git already tracks. A push here is irreversible in practice.
      - name: No internal content exposed
        run: node scripts/check-internal-content.mjs

      # Decision-point ids in DECISION_POINTS (apps/api/utils/decisionJournal.ts)
      # land in committed decision-map snapshots, which makes them F1 —
      # internally frozen (see CLAUDE.md). Catch drift before tsc even runs:
      # unknown ids, time-shaped inputs keys (they'd turn every diff into
      # noise), registry points with no call site, and recordDecision() calls
      # made from test files.
      - name: Decision journal registry in sync
        run: node scripts/check-decision-journal.mjs

      # A test file named `.test.ts` instead of `.vitest.ts` is invisible to
      # every vitest config's `include` glob — it never runs, in CI or
      # locally, no matter what its own header comment claims.
      - name: No orphaned test files
        run: node scripts/check-orphan-tests.mjs

      # The Claude Review gate decides from tool output whether a changed file
      # was really read. Its rules are easy to loosen by accident; these cases
      # pin both directions (#4854).
      - name: Claude Review read gate
        run: node --test .github/scripts/review-read-gate.test.mjs

      # A file copied by a Dockerfile but missing from that image's
      # paths-filter means a change to it builds nothing: the workflow runs,
      # every job is skipped, and the merged change never ships. Nothing turns
      # red — so this does. Also checks the push/pull_request triggers against
      # the filters, the second layer that can drift the same way (#3389).
      - name: Image build filters cover their Dockerfiles
        run: node scripts/check-image-build-filters.mjs

      # The routing table is generated; the privacy notice's list of
      # sub-processors is hand-kept. Cortecs wrote most answers for a month
      # without being named there (#3517).
      - name: Privacy notice names every model host
        run: node scripts/check-privacy-subprocessors.mjs

  typecheck:
    name: Typecheck
    needs: plan
    if: needs.plan.outputs.typecheck != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Ein Override ERSETZT den Bereich, den ein Paket selbst deklariert, und
      # pnpm prueft nicht nach, ob die erzwungene Version ihn noch erfuellt —
      # bei regulaeren dependencies warnt es dafuer auch nicht. So hielt das
      # Override @assistant-ui/core auf 0.2.21, waehrend der mitgezogene
      # @assistant-ui/react 0.14.29 schon ^0.2.23 brauchte: master war rot, aber
      # erst im Bundler (MISSING_EXPORT fileMatchesAccept). Der Check braucht
      # node_modules und haengt deshalb an diesem Job statt an `guards`.
      - name: Overrides erfuellen die deklarierten Bereiche
        run: node scripts/check-override-ranges.mjs

      # Alle anderen Dependency-Checks vergleichen Deklarationen miteinander;
      # keiner sieht den installierten Baum. `node-linker=hoisted` legt EINEN
      # flachen Baum an, den sich die Worktrees teilen — ein Install aus einem
      # fremden Branch schreibt dessen Versionen hinein, und `pnpm install`
      # meldet danach "Already up to date" (Workspace-State-Cache), auch mit
      # --force. Sichtbar wird der Bruch erst beim Laden eines Moduls
      # (17.09.2026: @assistant-ui/core 0.3.18 statt 0.3.16 -> vier
      # jsdom-Suiten an einem fehlenden assistant-cloud-Export).
      - name: node_modules deckt sich mit dem Lockfile
        run: node scripts/check-installed-lockfile-drift.mjs

      - name: TypeScript type check
        run: pnpm typecheck

  lint:
    name: ESLint
    needs: plan
    if: needs.plan.outputs.lint != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ESLint
        run: pnpm lint

  format:
    name: Format & Generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prettier format check
        run: pnpm format:check

      # Generated artifacts that drift silently when their source changes on a
      # DIFFERENT branch. docs-build.yml already checks these, but it is
      # path-filtered — so a PR that does not touch documentation/ skips it and
      # can still merge stale. As an always-on required check these catch the
      # cross-branch drift that broke master repeatedly (docs index, UiLabel
      # manifest, settings catalog).
      - name: Generated artifacts in sync
        run: |
          pnpm --filter @gruenerator/documentation labels:check
          pnpm --filter @gruenerator/documentation settings:check
          pnpm --filter @gruenerator/documentation docs:index:check
          # Same class as the three above: the committed chat-capabilities
          # manifest vs. what the generator reads out of the code. This is NOT
          # the capabilities AUDIT (undocumented capability → GitHub issue,
          # deliberately non-blocking in docs-capabilities.yml) — it is the
          # staleness check, which existed in package.json but had no caller.
          pnpm --filter @gruenerator/documentation capabilities:check
          # Lives in packages/shared, so a PR that never touches
          # documentation/ can add a tool and leave the guide's table a
          # row short — exactly the cross-branch drift this block is for.
          pnpm --filter @gruenerator/documentation agent-tools:check

  # No `needs:` on test/build. Gating them behind the quality job bought
  # nothing — Actions minutes are free on a public repo, wall-clock is the
  # scarce resource, and the gate was costing it dearly: on run 30631684791 the
  # tests sat in the queue for 721s and Build web for 1260s, almost all of it
  # waiting for a job whose failure they do not depend on.
  #
  # The shard list and why it looks like this: `SHARDS` in the plan job, which
  # hands on only the shards that have work.
  test-shard:
    name: Tests (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.tests != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    # An empty database for `migrations.db.vitest.ts`: builds the schema from
    # zero the way a fresh instance does on first boot (#2895). A grown
    # database never shows a migration that only works on top of another.
    # Trust auth on a throwaway container: no password literals, which secret
    # scanners (GitGuardian) would flag. Port 5433, not 5432: other suites
    # fall back to localhost:5432/gruenerator when no DB is configured
    # (authRegressions, deepAgentTurn) and would otherwise run against, and
    # pre-fill, the database this test needs empty.
    # Not 55432 either: that sits in Linux's ephemeral range (32768-60999), so
    # the runner's own outbound connections could hold it and the service
    # container failed to bind ("address already in use", #3754).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ matrix.pkg && format('--filter=@gruenerator/{0}...', matrix.pkg) || '' }}

      # The app role owns its database but is no superuser. schema.sql creates
      # its own extensions, which only works while they stay trusted ones.
      # CREATEDB is for tests only: trashSchema.db.vitest.ts migrates a database
      # of its own, because migrations.db.vitest.ts needs this one empty.
      - name: Create the app role and its empty database
        run: >-
          psql postgresql://postgres@localhost:5433/postgres
          -c "CREATE ROLE gruenerator LOGIN CREATEDB"
          -c "CREATE DATABASE gruenerator OWNER gruenerator"

      # Only pull_request trusts the cache. The merge queue and master run past
      # it: a test reading a file its turbo `inputs` do not name (see the
      # package turbo.json files) would otherwise stay green on a stale hit.
      - name: Run tests
        run: >-
          pnpm turbo run ${{ matrix.task || 'test' }}
          ${{ matrix.pkg && format('--filter=@gruenerator/{0}', matrix.pkg) || '--filter=!@gruenerator/api --filter=!@gruenerator/web --filter=!@gruenerator/chat' }}
          ${{ github.event_name != 'pull_request' && '--force' || '' }}
          ${{ matrix.shard && format('-- --shard={0}', matrix.shard) || '' }}

  # Stable check name for the matrix above (check names are F0). `skipped`
  # counts only when the plan itself succeeded and found no shard with work.
  test:
    name: Tests
    needs: [plan, test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test shards passed
        run: >-
          test "${{ needs.test-shard.result }}" = success ||
          { test "${{ needs.plan.result }}" = success && test '${{ needs.plan.outputs.tests }}' = '[]'; }

  # The NLP service is Python and sits outside the pnpm workspace, so `pnpm
  # test` never sees it. Its scoring, filtering and blocklist logic feeds the
  # `themes`/`persons`/`keywords` payloads in Qdrant,
  # where a regression surfaces as quietly wrong facets rather than as an error.
  #
  # No pnpm, no node_modules. `de_core_news_sm` (~15 MB) instead of the
  # production `de_core_news_lg` (~610 MB): the model tier checks pipeline
  # wiring, not model quality, and every other test builds its spaCy Docs by
  # hand and needs no model at all.
  nlp:
    name: NLP Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/nlp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The interpreter is named ONCE, in the Dockerfile's FROM lines, and read
      # from there. A literal `python-version` here is a second source of truth
      # that cannot go red: it kept testing 3.12 no matter what the image
      # shipped, so a base-image bump was verified against the wrong
      # interpreter (#3304).
      - name: Read Python version from the Dockerfile
        id: python-version
        run: |
          version=$(grep -m1 -oE '^FROM python:[0-9]+\.[0-9]+' Dockerfile | cut -d: -f2)
          test -n "$version" || { echo "::error::no 'FROM python:<x.y>' line in services/nlp/Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: 'pip'
          cache-dependency-path: services/nlp/requirements-dev.txt

      # requirements-dev.txt is the pinned closure INCLUDING the [dev] extra
      # (pytest, httpx); requirements.txt is the runtime-only closure the image
      # installs. Both come from `uv pip compile pyproject.toml [--extra dev]`.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt ".[dev]"

      - name: Install spaCy model
        run: python -m spacy download de_core_news_sm

      - name: Run tests
        run: pytest

  build:
    name: Build ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @gruenerator/${{ matrix.app }}...

      - name: Build ${{ matrix.app }}
        run: pnpm turbo run ${{ matrix.task }} --filter=@gruenerator/${{ matrix.app }}
