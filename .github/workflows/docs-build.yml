name: Docs Build

# Builds the Docusaurus site on PRs so three guarantees have teeth:
#   1. labels:check fails if src/generated/ui-labels.json is stale vs. the app's
#      UI catalog configs (a title changed in code but the manifest wasn't
#      regenerated).
#   2. docusaurus build fails if any <UiLabel id="…"> references an id that no
#      longer exists in the manifest (a renamed/removed catalog entry).
#   3. docs:index --check fails if the chat's committed documentation index is
#      stale vs. documentation/docs (a page added, renamed or restructured
#      without regenerating), which would make the chat cite dead deep links or
#      miss the page entirely.
#   4. tools:check / office:check / agent-tools:check fail if the tool-overview,
#      Office or agent-builder manifests are stale vs. the configs, contracts
#      and catalogs they derive from.
# Triggers on doc changes and on the catalog source files the manifests derive
# from. Blocking on purpose — all of these are real drift the author must fix.
#
# The chat-capabilities manifest is deliberately NOT checked here: an
# undocumented chat capability is reported as a GitHub issue by
# docs-capabilities.yml instead, so a backend change never breaks the docs build.
# Same split applies to the new manifests: a STALE manifest blocks here, but a
# tool or operation that merely lacks German prose is an issue from
# docs-tools.yml, never a failed build.

on:
  pull_request:
    paths:
      - 'documentation/**'
      - 'apps/web/src/features/global-search/toolCatalog.ts'
      - 'apps/web/src/config/workplaceToolsConfig.ts'
      - 'apps/web/src/components/layout/Header/menuData.tsx'
      - 'packages/shared/src/agents/landesverbaende.ts'
      - 'apps/web/src/config/routes.ts'
      # Agentura manifest sources
      - 'apps/web/src/features/agentura/lib/categories.ts'
      - 'packages/shared/src/agents/types.ts'
      # Office manifest sources — the contracts plus the two files that decide
      # what actually reaches the user (runtime skips, import limits).
      - 'packages/contracts/src/schemas/docs.ts'
      - 'packages/contracts/src/schemas/sheets.ts'
      - 'packages/contracts/src/schemas/presentations.ts'
      - 'packages/contracts/src/schemas/boardFlow.ts'
      - 'packages/sheets/src/ai/applySheetOperations.ts'
      - 'apps/web/src/features/docs/docTypeMeta.tsx'
      - 'apps/web/src/features/sheets/SheetImportDialog.tsx'
      # agent-tools manifest source — the catalog behind the builder's
      # checkboxes; a new tool there and the guide's table is a row short.
      - 'packages/shared/src/agents/userTools.ts'
      # reference manifest sources
      - 'packages/chat/src/lib/fileUtils.ts'
      - 'apps/api/config/systemCollectionsConfig.ts'
      - 'apps/api/services/mcp/McpRegistryService.ts'

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter @gruenerator/documentation...

      - name: Check ui-labels.json is in sync with the app source
        run: pnpm --filter @gruenerator/documentation labels:check

      - name: Check tools.json is in sync with the app's tool configs
        run: pnpm --filter @gruenerator/documentation tools:check

      - name: Check office.json is in sync with the contracts and the editor
        run: pnpm --filter @gruenerator/documentation office:check

      # No audit counterpart: the market's category catalog carries its own
      # German labels AND descriptions, so there is no hand-written half that
      # could go missing — staleness is the only failure mode.
      - name: Check agentura.json is in sync with the market's categories
        run: pnpm --filter @gruenerator/documentation agentura:check

      # Upload limits, MCP collections and the connector directory — plain facts
      # the articles used to restate in prose. No audit either: nothing to pair
      # them with, so staleness is the only failure mode.
      # Same shape as agentura.json: the catalog carries the German label and
      # description the picker itself shows, so staleness is the only failure
      # mode and there is nothing to audit.
      - name: Check agent-tools.json is in sync with the builder's tool catalog
        run: pnpm --filter @gruenerator/documentation agent-tools:check

      - name: Check reference.json is in sync with its sources
        run: pnpm --filter @gruenerator/documentation reference:check

      # Which model serves which task, at which host — read out of the routing
      # code itself. Same reasoning as reference.json: pure facts, no
      # hand-written half, so staleness is the only failure mode. A lane that
      # moves host without a regenerate would leave the sustainability page
      # claiming the wrong country.
      - name: Check models.json is in sync with the routing code
        run: pnpm --filter @gruenerator/documentation models:check

      - name: Build docs (fails on unknown UiLabel ids)
        run: pnpm --filter @gruenerator/documentation build

      # Dependency-free (plain node, reads documentation/docs + the committed
      # module), so it needs no extra install beyond the docs filter above.
      - name: Check the chat's docs index is in sync
        run: pnpm --filter @gruenerator/documentation docs:index:check
