name: Canvas-Editor

# Eigener Workflow statt eines Jobs in ci.yml — dieselbe Begruendung wie bei
# a11y.yml: die Lane braucht einen Playwright-Browser und einen laufenden
# Dev-Server.
#
# Was sie prueft, kann keine der bestehenden Lanes pruefen: die Resize-Geometrie
# entsteht erst aus Konvas Transformer, echten Zeigerereignissen und echtem
# Layout. Die node-vitest-Lane deckt die Arithmetik ab, aber sie muss die
# Konva-Skalierung annehmen — und genau in dieser Annahme sass der Fehler, den
# dieser Workflow festhaelt (Path-Formen wuchsen beim Verkleinern).
#
# ABSICHTLICH NUR MANUELL. Der frueher hier stehende pull_request-Trigger
# (pfad-gefiltert auf packages/canvas-editor/**) lief bei jeder Editor-Aenderung
# mit und kostete jedes Mal Minuten fuer eine Geometrie, die sich fast nie
# aendert — am 19.08.2026 haengte er sich zudem 18 Minuten in apt-get fest und
# lief ins Timeout, ohne den Test je erreicht zu haben. Vor Aenderungen an
# primitives/ (Transformer, shapeTransform, GenericCanvasElement) von Hand
# starten:
#
#   gh workflow run canvas.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  resize:
    name: Resize-Geometrie (Konva-Transformer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nur Chromium: geprueft wird Konvas Geometrie ueber der Canvas-2D-API,
      # nicht das Rendering-Verhalten einzelner Engines.
      - name: Playwright-Version ermitteln
        id: playwright
        run: |
          echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser aus dem Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      # Bewusst OHNE --with-deps: das ruft apt-get auf, und der Ubuntu-Mirror der
      # Runner haengte am 19.08.2026 reproduzierbar (zweimal, 18 und 8 Minuten,
      # jeweils stumm nach "noble-security InRelease"). Das Runner-Image bringt
      # Chromiums Systembibliotheken bereits mit — der apt-Lauf war die ganze
      # Zeit ueber nur Ballast. Bleibt Chromium irgendwann doch eine Bibliothek
      # schuldig, ist `playwright install-deps chromium` als eigener Schritt der
      # richtige Ort, nicht die Kopplung an den Browser-Download.
      - name: Playwright-Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @gruenerator/web exec playwright install chromium

      - name: Build shared packages
        run: pnpm build:shared

      # Der Harness braucht weder Auth noch Backend — er mountet eine nackte
      # Konva-Stage. Faellt der Dev-Server aus, faellt der Test aus; die Suite
      # kennt keinen Skip-Pfad, ein gruener Haken hier heisst also wirklich
      # "gelaufen und bestanden".
      - name: Resize-Lane
        working-directory: apps/web
        run: pnpm exec playwright test canvas-shape-resize.spec.ts --reporter=github,list

      - name: Bericht hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canvas-resize-report
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
