# Triage Dependabot pull requests: auto-approve patch/minor, label the rest.
# Merging stays manual — see the "Enable auto-merge" note below.
# Documentation: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Auto-approve safe updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No auto-merge step on purpose. It used to run
      # `gh pr merge --auto --squash`, which failed on every single patch PR
      # ("Auto merge is not allowed for this repository") because the repo has
      # allow_auto_merge disabled — so the job went red for free. It also used
      # --squash, which this repo forbids: test-branch is long-lived and squash
      # breaks commit identity across the master↔test-branch sync.
      # Re-enabling it needs BOTH: allow_auto_merge on the repo AND --merge.

      - name: Comment on minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr comment "$PR_URL" --body "This is a **minor** version update. Auto-approved but requires manual merge after CI passes.

          Please review the changelog for any breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "This is a **major** version update that may contain breaking changes.

          Please:
          1. Review the changelog and migration guide
          2. Test locally before merging
          3. Consider the impact on other packages in the monorepo"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
