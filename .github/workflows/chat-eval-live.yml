name: Chat Eval (Live)

# Runs the live chat eval corpus (multi-turn scenarios + adversarial cases +
# golden long threads) against the DEPLOYED TEST ENVIRONMENT on both model
# lanes, then the LLM-judge pass over the traces. Regressions vs the committed
# per-lane baseline fail the job.
#
# Manual only (workflow_dispatch) — deliberately not on a schedule:
#   - a full run takes ~150 minutes across both lanes.
#   - it needs a deployed test environment plus the repo secrets below.
#   - judged results are sampling-unstable: apps/api/evals/README.md documents
#     the same scenarios passing 3/4 or 4/4 identical runs, so an unattended
#     cron would just produce noisy, non-actionable red/green flips.
#
# Required repo secrets:
#   EVAL_BASE_URL      https://<test-env-host>  (backend with ALLOW_DEV_AUTH_BYPASS=true)
#   EVAL_BYPASS_TOKEN  the test env's DEV_AUTH_BYPASS_TOKEN
#   LITELLM_BASE_URL   verdigado LiteLLM proxy (judge; no /v1 suffix)
#   LITELLM_API_KEY    judge model access (free verdigado models)

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Write this run as the new per-lane baseline and open a PR'
        type: boolean
        default: false
      filter:
        description: 'EVAL_FILTER substring (empty = full corpus)'
        type: string
        default: ''

concurrency:
  group: chat-eval-live
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  eval:
    name: Eval (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        lane: [mistral, gemma-4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe test-env reachability
        run: |
          # Missing secrets otherwise surface as ~100 identical case failures
          # ("Failed to parse URL from /api/chat-graph/stream") — fail loud here.
          if [ -z "$EVAL_BASE_URL" ]; then
            echo "::error::Repo secret EVAL_BASE_URL is not set — the eval has no backend to run against."
            exit 1
          fi
          if [ -z "$EVAL_BYPASS_TOKEN" ]; then
            echo "::error::Repo secret EVAL_BYPASS_TOKEN is not set — every request would be rejected as unauthenticated."
            exit 1
          fi
          echo "Backend git SHA (env drift check):"
          curl -sf --max-time 15 "$EVAL_BASE_URL/health" || echo "(no /health — continuing)"
        env:
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_BYPASS_TOKEN: ${{ secrets.EVAL_BYPASS_TOKEN }}

      - name: Run chat eval (${{ matrix.lane }})
        run: pnpm --filter @gruenerator/api eval:chat
        env:
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_BYPASS_TOKEN: ${{ secrets.EVAL_BYPASS_TOKEN }}
          EVAL_MODEL_ID: ${{ matrix.lane }}
          EVAL_SLOW: '1'
          EVAL_FILTER: ${{ inputs.filter }}
          EVAL_BASELINE: apps/api/evals/baseline.${{ matrix.lane }}.json
          EVAL_UPDATE_BASELINE: ${{ inputs.update_baseline && '1' || '' }}

      - name: Run LLM judge
        if: always()
        run: pnpm --filter @gruenerator/api eval:judge
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          EVAL_JUDGE_BLOCKING: '1'

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-traces-${{ matrix.lane }}
          path: |
            apps/api/evals/last-run.json
            apps/api/evals/judge-verdicts.json
          retention-days: 30

      - name: Open baseline PR
        if: inputs.update_baseline
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/eval-baseline-${{ matrix.lane }}
          title: 'chore(evals): update ${{ matrix.lane }} eval baseline'
          commit-message: 'chore(evals): update ${{ matrix.lane }} eval baseline'
          body: 'Automated baseline refresh from workflow_dispatch run.'
          add-paths: apps/api/evals/baseline.${{ matrix.lane }}.json
