name: Daily Offboarding

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without processing (uncheck to run a real offboarding)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: offboarding
  cancel-in-progress: false

jobs:
  offboard:
    name: Run Offboarding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: ${{ vars.OFFBOARDING_API_URL || 'https://gruenerator.eu' }}
    steps:
      - name: Check offboarding config & connectivity
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "Checking offboarding service at $API_URL..."
          # Capture body AND status even on HTTP error (no -f) so a config/connectivity
          # failure surfaces the upstream reason instead of a bare curl exit code. The
          # /status endpoint now live-probes the Grüne API, so a rejected credential or
          # unreachable upstream is caught here in preflight.
          RESPONSE=$(curl -s -w $'\n%{http_code}' \
            -H "x-admin-token: $ADMIN_TOKEN" \
            "$API_URL/api/internal/offboarding/status")
          HTTP=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          echo "$BODY" | jq . || echo "$BODY"

          if [ -z "$HTTP" ] || [ "$HTTP" = "000" ]; then
            echo "::error::Offboarding service unreachable at $API_URL (no HTTP response)"
            exit 1
          fi
          if [ "$HTTP" -ge 400 ]; then
            MSG=$(echo "$BODY" | jq -r '.message // "unknown error"')
            echo "::error::Offboarding preflight failed (HTTP $HTTP): $MSG"
            exit 1
          fi

      - name: Run offboarding
        id: offboard
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Scheduled runs are dry-run "for now": report how many users would be
          # processed without deleting/anonymizing anything. A real run requires a
          # manual dispatch with the dry_run input unchecked.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DRY=true
          else
            DRY="${{ inputs.dry_run }}"
          fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"

          if [ "$DRY" = "true" ]; then
            echo "Running offboarding dry run (no changes will be made)..."
          else
            echo "Running LIVE offboarding (will delete/anonymize users)..."
          fi

          # Capture body AND status (no -f) so a 500 surfaces the service's
          # { error } message instead of a bare curl exit 22.
          RESPONSE=$(curl -s -w $'\n%{http_code}' -X POST "$API_URL/api/internal/offboarding/run-sync" \
            -H "x-admin-token: $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\": $DRY}" \
            --max-time 1800)
          HTTP=$(printf '%s' "$RESPONSE" | tail -n1)
          RESULT=$(printf '%s' "$RESPONSE" | sed '$d')

          echo "$RESULT" | jq . || echo "$RESULT"

          if [ -z "$HTTP" ] || [ "$HTTP" = "000" ] || [ "$HTTP" -ge 400 ]; then
            ERR=$(echo "$RESULT" | jq -r '.error // .message // empty')
            [ -z "$ERR" ] && ERR="no error body"
            echo "::error::Offboarding run failed (HTTP ${HTTP:-none}): $ERR"
            {
              echo "error<<EOF"
              echo "HTTP ${HTTP:-none}: $ERR"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        run: |
          RESULT='${{ steps.offboard.outputs.result }}'
          ERROR='${{ steps.offboard.outputs.error }}'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$RESULT" ] || [ "$RESULT" = "" ]; then
            {
              echo "## :x: Offboarding — Failed"
              echo ""
              if [ -n "$ERROR" ]; then
                echo "The offboarding service returned an error:"
                echo ""
                echo '```'
                echo "$ERROR"
                echo '```'
              else
                echo "The offboarding service did not return a result."
              fi
              echo ""
              echo "Check the [workflow logs]($RUN_URL)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ steps.offboard.outputs.dry }}" = "true" ]; then
            WOULD_PROCESS=$(echo "$RESULT" | jq -r '.wouldProcess')
            NOT_FOUND=$(echo "$RESULT" | jq -r '.notFound')
            FAILED=$(echo "$RESULT" | jq -r '.failed')
            DURATION=$(echo "$RESULT" | jq -r '.durationMs')
            DURATION_S=$(( DURATION / 1000 ))

            {
              echo "## :mag: Offboarding Dry Run (no changes made)"
              echo ""
              echo "**Date:** $(date -u '+%d.%m.%Y %H:%M UTC')"
              echo "**Duration:** ${DURATION_S}s"
              echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
              echo ""
              echo "| Metric | Count |"
              echo "|--------|------:|"
              echo "| Would be processed | $WOULD_PROCESS |"
              echo "| Not found in DB | $NOT_FOUND |"
              echo "| Lookup errors | $FAILED |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            SUCCESS=$(echo "$RESULT" | jq -r '.success')
            PROCESSED=$(echo "$RESULT" | jq -r '.processed')
            DELETED=$(echo "$RESULT" | jq -r '.deleted')
            ANONYMIZED=$(echo "$RESULT" | jq -r '.anonymized')
            NOT_FOUND=$(echo "$RESULT" | jq -r '.notFound')
            FAILED=$(echo "$RESULT" | jq -r '.failed')
            RETRIES=$(echo "$RESULT" | jq -r '.retriesProcessed')
            DURATION=$(echo "$RESULT" | jq -r '.durationMs')
            DURATION_S=$(( DURATION / 1000 ))

            if [ "$SUCCESS" = "true" ] && [ "$FAILED" = "0" ]; then
              ICON=":white_check_mark:"
            elif [ "$SUCCESS" = "true" ]; then
              ICON=":warning:"
            else
              ICON=":x:"
            fi

            {
              echo "## $ICON Offboarding Report"
              echo ""
              echo "**Date:** $(date -u '+%d.%m.%Y %H:%M UTC')"
              echo "**Duration:** ${DURATION_S}s"
              echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
              echo ""
              echo "| Metric | Count |"
              echo "|--------|------:|"
              echo "| Processed | $PROCESSED |"
              echo "| Deleted | $DELETED |"
              echo "| Anonymized | $ANONYMIZED |"
              echo "| Not found | $NOT_FOUND |"
              echo "| Failed | $FAILED |"
              echo "| Retries processed | $RETRIES |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if offboarding had errors
        if: steps.offboard.outcome == 'failure'
        run: exit 1
