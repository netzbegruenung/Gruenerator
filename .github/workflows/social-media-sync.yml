name: Social Media Sync

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 04:00 CET (03:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without storing'
        type: boolean
        default: false
      force:
        description: 'Force re-index even if unchanged'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: social-media-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync social media examples
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter @gruenerator/api...

      - name: Run social media sync
        id: sync
        continue-on-error: true
        run: |
          FORCE=false
          if [ "${{ inputs.force }}" = "true" ]; then FORCE=true; fi
          DRY_RUN=false
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN=true; fi

          BODY=$(jq -nc --argjson force $FORCE --argjson dryRun $DRY_RUN \
            '{forceUpdate: $force, dryRun: $dryRun}')

          echo "POST $CONTENT_SYNC_API_URL/api/internal/content-sync/source/social-media ($BODY)"
          RESPONSE=$(curl -s -w '\n%{http_code}' -X POST \
            "$CONTENT_SYNC_API_URL/api/internal/content-sync/source/social-media" \
            -H "x-admin-token: $ADMIN_TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" --max-time 3300)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$RESPONSE_BODY" | jq . 2>/dev/null || echo "$RESPONSE_BODY"

          WRAP_FLAGS="--id social-media --http-code $HTTP_CODE"
          if [ "$DRY_RUN" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then WRAP_FLAGS="$WRAP_FLAGS --force"; fi
          echo "$RESPONSE_BODY" | pnpm --silent --filter @gruenerator/api run sync:wrap-result -- $WRAP_FLAGS \
            > "$GITHUB_WORKSPACE/sync-summary.json"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CONTENT_SYNC_API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}

      - name: Generate job summary
        if: always()
        run: |
          SUMMARY_FILE="${{ github.workspace }}/sync-summary.json"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "## Social Media Sync — No Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The sync script did not produce a summary file. Check the [workflow logs]($RUN_URL)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # A summary that isn't valid JSON (pnpm banner leaking into the file,
          # truncated write) must not fail an otherwise successful sync.
          if ! jq -e . "$SUMMARY_FILE" > /dev/null 2>&1; then
            {
              echo "## Social Media Sync — Unreadable Summary"
              echo ""
              echo "\`sync-summary.json\` is not valid JSON. Check the [workflow logs]($RUN_URL)."
              echo ""
              echo '```'
              head -c 500 "$SUMMARY_FILE"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TIMESTAMP=$(jq -r '.timestamp' "$SUMMARY_FILE")
          STORED=$(jq -r '.totals.stored' "$SUMMARY_FILE")
          ERRORS=$(jq -r '.totals.errors // 0' "$SUMMARY_FILE")
          DURATION=$(jq -r '.totalDuration // 0' "$SUMMARY_FILE")

          if [ "$ERRORS" -gt 0 ]; then STATUS_ICON="⚠️"; else STATUS_ICON="✅"; fi

          {
            echo "## ${STATUS_ICON} Social Media Sync"
            echo ""
            echo "**Date:** $(date -d "$TIMESTAMP" '+%d.%m.%Y %H:%M UTC' 2>/dev/null || echo "$TIMESTAMP")"
            echo "**Duration:** ${DURATION}s | **New:** +${STORED} | **Errors:** ${ERRORS}"
          } >> $GITHUB_STEP_SUMMARY

      - name: Update content stats page
        if: always()
        run: |
          curl -sfS -H "x-admin-token: $ADMIN_TOKEN" \
            "$CONTENT_SYNC_API_URL/api/internal/content-sync/stats" \
            | jq -r '.markdown' > documentation/docs/sonstiges/inhaltsdatenbank.md
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CONTENT_SYNC_API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}

      - name: Create PR for stats page update
        if: always()
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'docs: update content stats after social media sync [skip ci]'
          title: 'docs: update content stats'
          body: 'Automated content stats update from Social Media Sync workflow.'
          branch: automated/content-stats-update
          add-paths: documentation/docs/sonstiges/inhaltsdatenbank.md
          delete-branch: true
          labels: automated

      - name: Fail if sync had errors
        if: steps.sync.outcome == 'failure'
        run: exit 1
