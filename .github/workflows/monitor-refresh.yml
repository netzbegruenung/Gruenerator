name: Monitor Refresh

on:
  schedule:
    - cron: '15 * * * *' # Hourly at :15 (offset from other crons)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per deployment. Without this, the cron only ever reached ONE
  # instance and every other environment answered `GET /api/monitor/latest`
  # with 404 forever — `getLatestSnapshot` has no lazy rebuild, so an instance
  # that is never refreshed cannot heal itself.
  #
  # Only `prod` is required. Beta is best-effort: it is frequently mid-deploy,
  # and a red cron there would train everyone to ignore this workflow.
  refresh:
    name: Refresh monitor snapshot (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.target.name != 'prod' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: prod
            url: ${{ vars.MONITOR_API_URL || 'https://gruenerator.eu' }}
          - name: beta
            url: ${{ vars.MONITOR_BETA_API_URL }}
    # Per target, so prod and beta never queue behind each other.
    concurrency:
      group: monitor-refresh-${{ matrix.target.name }}
      cancel-in-progress: false
    env:
      API_URL: ${{ matrix.target.url }}
    steps:
      # An unset URL means that environment isn't configured — skip rather than
      # curl an empty host. The guard sits on the steps, not on the job: the
      # `matrix` context is not available in `jobs.<id>.if`.
      - name: Trigger refresh
        id: refresh
        if: matrix.target.url != ''
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN repository secret is empty or unset."
            echo "status=missing-secret" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Triggering monitor refresh at $API_URL..."
          HTTP_CODE=$(curl -s -o /tmp/refresh-body -w '%{http_code}' \
            -X POST "$API_URL/api/internal/monitor/refresh" \
            -H "x-admin-token: $ADMIN_TOKEN" \
            --max-time 600 || echo "000")

          BODY=$(cat /tmp/refresh-body 2>/dev/null || echo "")
          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          {
            echo "status=$HTTP_CODE"
            echo "result<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi

      - name: Generate summary
        if: always() && matrix.target.url != ''
        run: |
          STATUS='${{ steps.refresh.outputs.status }}'
          RESULT='${{ steps.refresh.outputs.result }}'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO="${{ github.repository }}"
          TARGET='${{ matrix.target.name }}'

          if [ "$STATUS" = "missing-secret" ]; then
            {
              echo "## :x: Monitor Refresh ($TARGET) — ADMIN_TOKEN missing"
              echo ""
              echo "The \`ADMIN_TOKEN\` repository secret is empty or unset."
              echo "Set it with: \`gh secret set ADMIN_TOKEN --repo $REPO\`"
              echo "(value must match \`env.ADMIN_TOKEN\` on the server at $API_URL)"
              echo ""
              echo "[Workflow logs]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STATUS" = "403" ]; then
            {
              echo "## :x: Monitor Refresh ($TARGET) — Auth rejected (HTTP 403)"
              echo ""
              echo "The API rejected the admin token. The \`ADMIN_TOKEN\` GitHub secret does not match the server's \`env.ADMIN_TOKEN\` at $API_URL."
              echo ""
              echo "[Workflow logs]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STATUS" = "000" ] || [ -z "$STATUS" ]; then
            {
              echo "## :x: Monitor Refresh ($TARGET) — Network failure"
              echo ""
              echo "Could not reach $API_URL (timeout, DNS, or TLS error)."
              echo ""
              echo "[Workflow logs]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$STATUS" != "200" ]; then
            {
              echo "## :x: Monitor Refresh ($TARGET) — HTTP $STATUS"
              echo ""
              echo "Refresh endpoint at $API_URL returned an unexpected status."
              echo ""
              echo "[Workflow logs]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          TOTAL_ARTICLES=$(echo "$RESULT" | jq -r '.totalArticles // 0')
          ACTIVE_TOPICS=$(echo "$RESULT" | jq -r '.activeTopics // 0')

          if [ "$SUCCESS" = "true" ]; then
            ICON=":white_check_mark:"
          else
            ICON=":x:"
          fi

          {
            echo "## $ICON Monitor Refresh ($TARGET)"
            echo ""
            echo "**Date:** $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| Total articles | $TOTAL_ARTICLES |"
            echo "| Active topics | $ACTIVE_TOPICS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if refresh had errors
        if: matrix.target.url != '' && steps.refresh.outcome == 'failure'
        run: exit 1
