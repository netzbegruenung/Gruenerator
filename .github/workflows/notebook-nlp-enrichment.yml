name: Nightly Notebook NLP Enrichment

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      collection:
        description: 'Single Qdrant collection to enrich (empty = all)'
        required: false
        type: string
      mode:
        description: "Enrichment mode: 'missing' (new/changed only) or 'all' (full re-tag)"
        required: false
        type: choice
        default: missing
        options:
          - missing
          - all

permissions:
  contents: read

concurrency:
  group: notebook-nlp-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich notebook documents
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_URL: ${{ vars.NOTEBOOK_API_URL || 'https://gruenerator.eu' }}
    steps:
      - name: Build request payload
        id: payload
        run: |
          PAYLOAD=$(jq -nc --arg mode "${{ inputs.mode || 'missing' }}" '{mode: $mode}')
          if [ -n "${{ inputs.collection }}" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq -c --arg c "${{ inputs.collection }}" '. + {collection: $c}')
          fi
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "Payload: $PAYLOAD"

      - name: Trigger enrichment
        id: enrich
        continue-on-error: true
        run: |
          echo "POST $API_URL/api/internal/notebook/enrich"
          RESULT=$(curl -sfS -X POST "$API_URL/api/internal/notebook/enrich" \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '${{ steps.payload.outputs.payload }}' \
            --max-time 7000)

          echo "$RESULT" | jq .
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate summary
        if: always()
        run: |
          RESULT='${{ steps.enrich.outputs.result }}'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$RESULT" ] || [ "$RESULT" = "" ]; then
            {
              echo "## :x: NLP Enrichment — No Result"
              echo ""
              echo "Service did not return a result. Check [workflow logs]($RUN_URL)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SUCCESS=$(echo "$RESULT" | jq -r '.success')
          if [ "$SUCCESS" = "true" ]; then ICON=":white_check_mark:"; else ICON=":x:"; fi

          {
            echo "## $ICON Notebook NLP Enrichment"
            echo ""
            echo "**Date:** $(date -u '+%d.%m.%Y %H:%M UTC')"
            echo "**Run:** [${{ github.run_id }}]($RUN_URL)"
            echo ""
            echo "| Collection | Scanned | Enriched | Skipped | No ID | NLP failures |"
            echo "|------------|--------:|---------:|--------:|------:|-------------:|"
            echo "$RESULT" | jq -r '.results[] | "| \(.collection) | \(.scanned) | \(.enriched) | \(.skipped) | \(.noId) | \(.nlpFailures) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if enrichment errored
        if: steps.enrich.outcome == 'failure'
        run: exit 1
