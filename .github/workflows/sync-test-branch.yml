# Keeps the long-lived `test-branch` in sync with `master`, and rebuilds the
# beta Docker images after each sync.
#
# Fires on every push to master (i.e. whenever a PR is merged): merges master
# into test-branch (regular merge — test-branch is never squashed), pushes, then
# dispatches build-images.yml so the beta images rebuild.
#
# Why the explicit dispatch: a push made with the default GITHUB_TOKEN does NOT
# re-trigger other workflows, so the push alone won't rebuild. A workflow_dispatch
# triggered with GITHUB_TOKEN DOES run — so we sync with GITHUB_TOKEN (no PAT
# needed) and kick the build explicitly. build-images.yml detects which images
# changed in the merge (see its detect-changes base fallback).
name: Sync test-branch

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

# Serialize runs so two rapid master merges can't race on the same push.
# Don't cancel in-progress: every merge should be applied, not dropped.
concurrency:
  group: sync-test-branch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write # to dispatch build-images.yml after a sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # never run local git hooks (commitlint) in CI
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout test-branch (full history)
        uses: actions/checkout@v7
        with:
          ref: test-branch
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Needed only for the lockfile-conflict path below (pnpm regenerates it).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Merge master into test-branch
        id: merge
        run: |
          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "test-branch already contains master — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge origin/master --no-verify --no-edit \
              -m "chore: sync test-branch with master"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pnpm-lock.yaml conflicts on essentially every sync: both branches
          # take dependency updates, and the lockfile is a GENERATED artifact —
          # merging it line by line is meaningless. Take master's and regenerate
          # against the merged manifests. Any other conflicted path is a real
          # code conflict and still needs a human.
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ "$conflicts" != "pnpm-lock.yaml" ]; then
            behind=$(git rev-list --count HEAD..origin/master)
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            # Hand the paths to the issue step. Without them the issue says only
            # "conflict" and every reader has to open the run log to learn which
            # three files it was — the one fact the report exists to carry.
            #
            # Randomised delimiter, per GitHub's own guidance for multiline
            # outputs: the value is repository content (conflicting paths), and
            # a path that were literally the delimiter would close the block
            # early, leaving the rest to be parsed as further keys — corrupting
            # `behind` and letting anything after it set outputs of its own.
            # Reaching that needs a file of exactly this name on master or
            # test-branch, so this is defence in depth, not a live hole.
            delim="CONFLICTS_EOF_$(openssl rand -hex 8)"
            {
              echo "conflicts<<$delim"
              echo "$conflicts"
              echo "$delim"
              echo "behind=$behind"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Merge conflict merging master into test-branch — manual resolution required. Conflicts: $(echo "$conflicts" | tr '\n' ' ')"
            exit 1
          fi

          echo "Only pnpm-lock.yaml conflicted — regenerating it."
          git checkout origin/master -- pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml
          git commit --no-verify -m "chore: sync test-branch with master"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push test-branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin test-branch

      - name: Rebuild beta images
        if: steps.merge.outputs.changed == 'true'
        run: |
          # workflow_dispatch (not push) so it runs under GITHUB_TOKEN.
          # build-images.yml detects which images the merge touched.
          gh workflow run build-images.yml --ref test-branch

      # Every later push to master re-runs this sync, hits the SAME conflict and
      # said so again: #1756 collected 99 identical comments, #2143 53, #2960 21.
      # The repeat carries no new fact — only a different trigger SHA — so it is
      # posted only when the conflicting path set actually changes. The failed
      # run itself stays visible either way.
      - name: Open issue on conflict
        if: failure() && steps.merge.outputs.conflict == 'true'
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          title="Sync failed: merge conflict master → test-branch"
          fingerprint=$(printf '%s' "$CONFLICTS" | LC_ALL=C sort | sha256sum | cut -c1-12)
          marker="<!-- sync-conflict:$fingerprint -->"
          body=$(printf '%s\n`master` could not be auto-merged into `test-branch` (conflict).\n\n`test-branch` is %s commits behind `master`. Conflicting paths:\n\n```\n%s\n```\n\nResolve manually:\n```\ngit fetch origin\ngit switch test-branch\ngit merge origin/master   # resolve conflicts\ngit push origin test-branch\n```\n\nTriggered by %s. [Workflow run](%s/%s/actions/runs/%s).' \
            "$marker" "$BEHIND" "$CONFLICTS" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body" --label "ci" 2>/dev/null \
              || gh issue create --title "$title" --body "$body"
            exit 0
          fi
          # Marker anywhere in the thread means this exact path set is already
          # reported and still unresolved.
          if gh issue view "$existing" --json body,comments \
               --jq '.body, .comments[].body' | grep -qF "$marker"; then
            echo "Same conflict set already reported on #$existing — not commenting again."
            exit 0
          fi
          gh issue comment "$existing" --body "$body"
