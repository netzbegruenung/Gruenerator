name: Mobile E2E

# Nightly, not per-PR: a full prebuild + Gradle build + emulator boot runs
# ~25 min, which is too slow to sit in front of every mobile change. The
# per-PR gate stays Mobile Bundle Check; this catches the native-integration
# regressions (safe area, keyboard, session restore, react dedupe) that no
# unit test can see.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      flows:
        description: 'Maestro flow or directory to run'
        required: false
        default: 'maestro/'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro (android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build canvas-editor CSS bundle
        run: pnpm --filter @gruenerator/canvas-editor build:css

      - name: Prebuild native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      # The dev auth bypass is gated on __DEV__, which is false in a release
      # bundle — that guard is deliberate (e478007b9) and must not be relaxed
      # for E2E. So build the DEBUG variant, but with the JS bundle embedded, so
      # no Metro server has to run next to the emulator.
      - name: Build debug APK with embedded bundle
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_DEV_AUTH_BYPASS: 'true'
          EXPO_PUBLIC_API_URL: ${{ secrets.MOBILE_E2E_API_URL }}
          EXPO_NO_TELEMETRY: '1'
        run: ./gradlew assembleDebug -PbundleInDebug=true --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output maestro-report.xml \
              "apps/mobile/${{ inputs.flows || 'maestro/' }}"

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
