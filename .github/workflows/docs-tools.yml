name: Docs Tools & Office

# Keeps two articles honest about what the app actually offers:
#   - documentation/docs/basics/tools.mdx (the tool overview),
#   - documentation/docs/features/** (the Office tutorials, now under Features).
#
# Both follow the same split as the chat-capabilities article: the STRUCTURE
# (which tools exist, which AI operations an editor understands) is generated
# from the app's own configs and contracts, while the German prose — what a tool
# is for, the sentence a user would actually type — is hand-written.
#
# When something new appears in code without that prose, this reports it as ONE
# deduplicated GitHub issue per article and closes it again once the gap is
# filled. Deliberately not a blocking check: adding a tool or an operation should
# never break someone else's docs build. A *stale committed manifest* is a
# different matter and does block, in docs-build.yml.
#
# On PRs touching the sources it additionally leaves one sticky comment, so the
# author sees the gap while the change is still fresh.

on:
  push:
    branches: [master]
    # Kept in sync with the pull_request paths below by hand — GitHub Actions
    # does not support YAML anchors.
    paths:
      - 'apps/web/src/config/workplaceToolsConfig.ts'
      - 'apps/web/src/config/routes.ts'
      - 'apps/web/src/features/global-search/toolCatalog.ts'
      - 'apps/web/src/features/docs/docTypeMeta.tsx'
      - 'apps/web/src/features/sheets/SheetImportDialog.tsx'
      - 'packages/contracts/src/schemas/docs.ts'
      - 'packages/contracts/src/schemas/sheets.ts'
      - 'packages/contracts/src/schemas/presentations.ts'
      - 'packages/contracts/src/schemas/boardFlow.ts'
      - 'packages/sheets/src/ai/applySheetOperations.ts'
      - 'documentation/src/components/ToolOverview/**'
      - 'documentation/src/components/OfficeOps/**'
      - 'documentation/src/generated/tools.json'
      - 'documentation/src/generated/office.json'
  pull_request:
    paths:
      - 'apps/web/src/config/workplaceToolsConfig.ts'
      - 'apps/web/src/config/routes.ts'
      - 'apps/web/src/features/global-search/toolCatalog.ts'
      - 'apps/web/src/features/docs/docTypeMeta.tsx'
      - 'apps/web/src/features/sheets/SheetImportDialog.tsx'
      - 'packages/contracts/src/schemas/docs.ts'
      - 'packages/contracts/src/schemas/sheets.ts'
      - 'packages/contracts/src/schemas/presentations.ts'
      - 'packages/contracts/src/schemas/boardFlow.ts'
      - 'packages/sheets/src/ai/applySheetOperations.ts'
      - 'documentation/src/components/ToolOverview/**'
      - 'documentation/src/components/OfficeOps/**'
      - 'documentation/src/generated/tools.json'
      - 'documentation/src/generated/office.json'
  schedule:
    - cron: '45 5 * * 5' # Friday 05:45 UTC, after the capabilities audit
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: docs-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit documented tools and Office capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --filter @gruenerator/documentation...

      # On master and on the weekly run: file / update / close each issue. The
      # two audits are independent, so a failure in one must not hide the other.
      - name: Audit tools and sync issue
        if: github.event_name != 'pull_request'
        run: pnpm --filter @gruenerator/documentation tools:audit -- --apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Office and sync issue
        if: github.event_name != 'pull_request'
        run: pnpm --filter @gruenerator/documentation office:audit -- --apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On PRs: sticky comments, never a failure.
      - name: Audit tools and comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm --filter @gruenerator/documentation tools:audit -- --pr-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Audit Office and comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm --filter @gruenerator/documentation office:audit -- --pr-comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
