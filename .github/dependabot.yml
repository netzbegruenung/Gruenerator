# Dependabot configuration for Gruenerator monorepo
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

registries:
  npm-npmjs:
    type: npm-registry
    url: https://registry.npmjs.org
    replaces-base: true

updates:
  # =============================================================================
  # ROOT WORKSPACE - Monorepo tooling and shared dev dependencies
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'root'
    groups:
      release-tooling:
        patterns:
          - '@semantic-release/*'
          - '@commitlint/*'
          - 'semantic-release'
          - 'husky'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@semantic-release/*'
          - '@commitlint/*'
          - 'semantic-release'
          - 'husky'
          - 'typescript'
          - '@types/*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # FRONTEND - React web application (apps/web)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      react-ecosystem:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router*'
          - '@types/react*'
      radix-ui:
        patterns:
          - '@radix-ui/*'
          - 'radix-ui'
      remotion:
        patterns:
          - 'remotion'
          - '@remotion/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      tauri:
        patterns:
          - '@tauri-apps/*'
      build-tools:
        dependency-type: 'development'
        patterns:
          - 'vite*'
          - '@vitejs/*'
          - 'eslint*'
          - 'terser'
          - 'tailwindcss'
          - '@tailwindcss/*'
      testing:
        dependency-type: 'development'
        patterns:
          - '@testing-library/*'
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - 'react-router*'
          - '@radix-ui/*'
          - 'radix-ui'
          - 'remotion'
          - '@remotion/*'
          - '@tanstack/*'
          - '@tauri-apps/*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # BACKEND - Node.js Express API server (apps/api)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
    labels:
      - 'dependencies'
      - 'backend'
    groups:
      ai-sdks:
        patterns:
          - '@ai-sdk/*'
          - '@anthropic-ai/*'
          - '@mistralai/*'
          - 'openai'
          - 'ai'
      langchain:
        patterns:
          - 'langchain'
          - '@langchain/*'
      express-middleware:
        patterns:
          - 'express'
          - 'express-*'
          - 'cors'
          - 'helmet'
          - 'morgan'
          - 'compression'
          - 'multer'
      auth:
        patterns:
          - 'passport*'
          - 'openid-client'
          - 'jose'
      database:
        patterns:
          - 'pg'
          - 'redis'
          - 'ioredis'
          - '@qdrant/*'
      document-processing:
        patterns:
          - 'pdf-lib'
          - 'pdfjs-dist'
          - 'docx'
          - 'cheerio'
          - 'turndown'
      sentry:
        patterns:
          - '@sentry/*'
      tus:
        patterns:
          - '@tus/*'
      dev-tools:
        dependency-type: 'development'
        patterns:
          - 'vitest*'
          - 'tsx'
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@ai-sdk/*'
          - '@anthropic-ai/*'
          - '@mistralai/*'
          - 'openai'
          - 'ai'
          - 'langchain'
          - '@langchain/*'
          - 'express*'
          - 'cors'
          - 'helmet'
          - 'morgan'
          - 'compression'
          - 'multer'
          - 'passport*'
          - 'openid-client'
          - 'jose'
          - 'pg'
          - 'redis'
          - 'ioredis'
          - '@qdrant/*'
          - 'pdf-lib'
          - 'pdfjs-dist'
          - 'docx'
          - 'cheerio'
          - 'turndown'
          - '@sentry/*'
          - '@tus/*'

  # =============================================================================
  # DOCS - Collaborative document editor (apps/docs)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/docs'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docs'
    groups:
      blocknote:
        patterns:
          - '@blocknote/*'
      mantine:
        patterns:
          - '@mantine/*'
      all-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@blocknote/*'
          - '@mantine/*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # SITES - Site builder/management interface (apps/sites)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/sites'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'sites'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # GRUEN-O-MAT (apps/gruen-o-mat)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/gruen-o-mat'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '08:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'gruen-o-mat'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # MOBILE - Expo React Native app (apps/mobile)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/mobile'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'mobile'
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
      react-navigation:
        patterns:
          - '@react-navigation/*'
      react-native-core:
        patterns:
          - 'react-native'
          - 'react-native-gesture-handler'
          - 'react-native-reanimated'
          - 'react-native-screens'
          - 'react-native-safe-area-context'
      react-native-ui:
        patterns:
          - 'react-native-*'
          - '@gorhom/*'
        exclude-patterns:
          - 'react-native'
          - 'react-native-gesture-handler'
          - 'react-native-reanimated'
          - 'react-native-screens'
          - 'react-native-safe-area-context'
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # SHARED PACKAGE (packages/shared)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/shared'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'shared'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # CHAT PACKAGE (packages/chat)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/chat'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'chat'
    groups:
      assistant-ui:
        patterns:
          - '@assistant-ui/*'
      all-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@assistant-ui/*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # DOCS PACKAGE (packages/docs)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/docs'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '08:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docs-package'
    groups:
      blocknote:
        patterns:
          - '@blocknote/*'
      all-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@blocknote/*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # ESLINT CONFIG (packages/eslint-config)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/eslint-config'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'eslint-config'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # MCP SERVER (services/mcp)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/services/mcp'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'mcp'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # HOCUSPOCUS SERVER (services/hocuspocus)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/services/hocuspocus'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '07:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'hocuspocus'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # REMOTION SERVICE (services/remotion)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/services/remotion'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '08:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'remotion'
    groups:
      remotion:
        patterns:
          - 'remotion'
          - '@remotion/*'
      all-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'remotion'
          - '@remotion/*'

  # =============================================================================
  # DOCUMENTATION - Docusaurus site (documentation/)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/documentation'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '10:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'documentation'
    groups:
      docusaurus:
        patterns:
          - '@docusaurus/*'
      all-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@docusaurus/*'

  # =============================================================================
  # DESKTOP - Tauri desktop app npm deps (apps/desktop)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/desktop'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '11:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop'
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'

  # =============================================================================
  # DESKTOP - Tauri Rust dependencies (Cargo)
  # =============================================================================
  - package-ecosystem: 'cargo'
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '12:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop'
      - 'rust'
    groups:
      tauri-rust:
        patterns:
          - 'tauri*'
      serde:
        patterns:
          - 'serde*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'tauri*'
          - 'serde*'

  # =============================================================================
  # DOCS DESKTOP - Tauri docs desktop app (apps/docs-desktop)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/docs-desktop'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '13:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docs-desktop'
    groups:
      tauri:
        patterns:
          - '@tauri-apps/*'

  # =============================================================================
  # DOCS DESKTOP - Tauri Rust dependencies (Cargo)
  # =============================================================================
  - package-ecosystem: 'cargo'
    directory: '/apps/docs-desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '14:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'docs-desktop'
      - 'rust'
    groups:
      tauri-rust:
        patterns:
          - 'tauri*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'tauri*'

  # =============================================================================
  # VOXTRAL - Self-hosted transcription service (Python)
  # =============================================================================
  - package-ecosystem: 'pip'
    directory: '/services/voxtral'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'voxtral'
    groups:
      ml-deps:
        patterns:
          - 'torch'
          - 'transformers'
          - 'mistral-common'
      server-deps:
        patterns:
          - 'fastapi'
          - 'uvicorn'
          - 'python-multipart'

  # =============================================================================
  # WORDPRESS (apps/wordpress)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/apps/wordpress'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '15:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'wordpress'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # CANVAS EDITOR PACKAGE (packages/canvas-editor)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/canvas-editor'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '15:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'canvas-editor'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # COLLAB PACKAGE (packages/collab)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/collab'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '16:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'collab'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # UI PACKAGE (packages/ui)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/ui'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '16:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ui'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # VOICE PACKAGE (packages/voice)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/voice'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '17:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'voice'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # WOLKE PACKAGE (packages/wolke)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/wolke'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '17:30'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'wolke'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # SITES DESIGN PACKAGE (packages/sites-design)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/packages/sites-design'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '18:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'sites-design'
    groups:
      all-dependencies:
        patterns:
          - '*'

  # =============================================================================
  # GITHUB ACTIONS - CI/CD workflows (DAILY for security)
  # =============================================================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
