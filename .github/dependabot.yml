# Dependabot configuration for Gruenerator monorepo
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ONE npm entry for the WHOLE pnpm workspace — do not add per-directory npm
# entries back.
#
# Dependabot's npm ecosystem reads /package.json and follows the workspace
# definition (pnpm-workspace.yaml: apps/*, packages/*, services/hocuspocus,
# documentation). A `directory: '/'` entry therefore already
# covers every workspace member. The 24 per-directory entries this file used to
# carry were not additional coverage, they were DUPLICATE coverage:
#
#   - the same bump opened twice (once from '/', once from '/apps/mobile'),
#     both regenerating the single root pnpm-lock.yaml and conflicting;
#   - the per-directory `ignore:` rules looked authoritative but did not apply
#     to the PRs the root entry raised, so bumps we had explicitly ignored for
#     apps/mobile and apps/wordpress kept reappearing (e.g. #1966-#1969).
#
# There is exactly ONE pnpm-lock.yaml, at the repo root, so every npm update in
# this repo is a root-level change no matter which manifest it edits. The
# config now matches that reality: one entry, one ignore list, grouped PRs.
#
# The cargo entry stays separate — apps/desktop/src-tauri is a Cargo workspace,
# not part of the pnpm one.
#
# -----------------------------------------------------------------------------
# EVERY npm PR that bumps a package listed in root `pnpm.overrides` arrives
# BROKEN — this is expected, and it is a two-command repair, not a bad bump.
#
# Dependabot has no notion of `pnpm.overrides`: it regenerates the lockfile
# (whose `overrides:` block then carries the NEW version) but leaves the
# `pnpm.overrides` entry in package.json on the OLD one. Every job then fails in
# its first step with
#
#   ERR_PNPM_LOCKFILE_CONFIG_MISMATCH  Cannot proceed with the frozen
#   installation. The current "overrides" configuration doesn't match the value
#   found in the lockfile
#
# which looks like a corrupt lockfile and is not. It hit #2097
# (@assistant-ui/react-markdown) and #2098 (jsdom); ~60 of the ~98 override
# entries are direct dependencies, so it will keep happening.
#
# Repair, on the Dependabot branch:
#
#   pnpm overrides:fix && pnpm install --no-frozen-lockfile
#   git commit -am 'chore(deps): sync pnpm.overrides with the lockfile'
#
# `pnpm overrides:check` (scripts/sync-pnpm-overrides.mjs) runs in CI before
# install so the red step names this instead of the pnpm error.
#
# Do NOT "solve" it by adding the affected packages to `ignore:` below —
# @assistant-ui/*, @tiptap/*, @blocknote/*, @tanstack/react-query and friends
# are overridden precisely because they must stay singletons, and they are the
# packages that most need updates. `ignore:` is for bumps we do not want at all
# (see the entries there), not for bumps that need a manifest line.
# -----------------------------------------------------------------------------

version: 2

updates:
  # =============================================================================
  # NPM — entire pnpm workspace (root + apps/* + packages/* + services + docs)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    # Seven days between a version's publish date and Dependabot proposing
    # it: the hijacked releases of 2025 (chalk/debug, Shai-Hulud) were pulled
    # within 48 h. Security updates are exempt from the cooldown. pnpm
    # enforces the same window at install time via minimumReleaseAge in
    # pnpm-workspace.yaml, so Dependabot never proposes what pnpm refuses.
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    groups:
      # Toolchain packages must move monorepo-wide in ONE PR — a partial bump
      # desyncs the shared lint/type config across workspaces.
      #
      # `typescript-eslint` (the bare meta-package) is listed on its own because
      # NONE of the other patterns reach it: 'typescript' is an exact match,
      # 'eslint-*' is a prefix, '@typescript-eslint/*' is scoped. Without the
      # line it fell into minor-patch and stayed behind while eslint-plugin and
      # parser moved, which is how #3069 shipped 8.67.0 and 8.68.0 side by side.
      # Under node-linker=hoisted the older tree nests under
      # node_modules/typescript-eslint/node_modules/ and picks up the stale
      # ts-api-utils@1.4.3 that @typescript-eslint/typescript-estree@6.21.0
      # drags in — the three scoped `>ts-api-utils` overrides do not cover that
      # copy — so every type-aware rule died with
      # `tsutils.unionConstituents is not a function`.
      typescript-toolchain:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
      commit-tooling:
        patterns:
          - '@commitlint/*'
          - 'husky'
      # The Gutenberg toolchain (apps/wordpress) is one coherent unit driven by
      # wp-scripts' webpack config — never bump a part of it on its own.
      wordpress-gutenberg:
        patterns:
          - '@wordpress/*'
          - 'sass'
          - 'sass-loader'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'
          - '@commitlint/*'
          - 'husky'
          - '@wordpress/*'
          - 'sass'
          - 'sass-loader'
    ignore:
      # --- React: deliberately NOT auto-updated at all ---------------------
      # react/react-dom are decoupled between web and mobile on purpose (see
      # CLAUDE.md > Expo Apps): apps/mobile pins the EXACT version its Expo SDK
      # ships, because react-native-renderer rejects any mismatch, while web
      # tracks '^'. A single workspace-wide entry cannot bump one without
      # touching the other's manifest, so react moves by hand only:
      #   mobile -> `npx expo install react react-dom` during an SDK upgrade
      #   web    -> a deliberate PR
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

      # --- Blocked upstream, not by us -------------------------------------
      # eslint 10 / TypeScript 7:
      #   eslint-plugin-react@7.37.5 (latest) peers eslint '<=^9.7'
      #   typescript-eslint@8.x peers typescript '>=4.8.4 <6.1.0'
      # Drop these once both ship support, then bump in ONE PR.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @wordpress/scripts 33 pulls a typescript-eslint/ts-api-utils combination
      # that breaks linting monorepo-wide. Drop once the ts-api-utils override
      # in pnpm.overrides can go (i.e. after the eslint-10 bump above).
      #
      # The rest of the Gutenberg stack is gated on the SAME unblock: wp-scripts
      # owns the webpack/babel/sass pipeline, so @wordpress/components 37,
      # block-editor 16, base-styles 11 and sass-loader 17 cannot land while
      # scripts stays on 31 — they would desync the build. Drop ALL of these
      # together and do the Gutenberg upgrade in ONE deliberate PR.
      - dependency-name: '@wordpress/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'sass-loader'
        update-types: ['version-update:semver-major']

      # --- Neutralised by pnpm.overrides -----------------------------------
      # zod is pinned to ^3.24.1 in pnpm.overrides, so a v4 bump would only
      # change manifests while v3 stays installed — a lie, not an update.
      # Drop this ignore as part of the dedicated zod-4 migration (which also
      # removes the better-auth>zod / knip>zod scoped overrides).
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']

      # --- Expo SDK owns these versions — ALL update types ------------------
      # `expo/bundledNativeModules.json` pins 46 of apps/mobile's 74 direct
      # dependencies, and `npx expo install --check` is the only authority on
      # what is compatible. Semver does not describe that relationship: MINOR
      # bumps of SDK-managed packages are rejected just like majors, e.g.
      #   react-native-webview 13.16.1 -> 13.17.0   (#1978, minor, rejected)
      #   react-native-keyboard-controller 1.21.9 -> 1.22.2 (minor, rejected)
      #   react-native-worklets 0.10.0 -> 0.11.2    (minor, rejected)
      # so an `update-types: [semver-major]` ignore cannot express it. Earlier
      # attempts enumerated the pinned packages one by one and kept missing
      # some — this ignores the SDK-owned namespaces outright instead.
      #
      # apps/mobile therefore updates exactly once per SDK upgrade, via
      # `npx expo install --fix`, which is already the documented workflow
      # (CLAUDE.md > Expo Apps: "Use `npx expo install` (not `pnpm add`)").
      #
      # Known cost: these direct deps are NOT SDK-managed but match the
      # patterns, so they now need manual bumps —
      #   react-native-drawer-layout, react-native-markdown-display,
      #   react-native-qrcode-svg, @react-native-vector-icons/ionicons,
      #   expo-atlas, expo-speech-recognition,
      #   expo-image-and-video-compressor, @expo/ngrok,
      #   @expo/react-native-action-sheet
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-*/*'

  # =============================================================================
  # PIP - services/nlp (outside the pnpm workspace, own lockfile)
  # =============================================================================
  # pyproject.toml only carries `>=` floors; requirements.txt is the pinned
  # closure (`uv pip compile pyproject.toml -o requirements.txt`) and the file
  # Dependabot bumps. Without it every image build resolved a different set.
  - package-ecosystem: 'pip'
    directory: '/services/nlp'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'python'
    groups:
      python:
        patterns:
          - '*'

  # =============================================================================
  # DOCKER - base images of the six Dockerfiles we ship
  # =============================================================================
  # Only the FROM lines. Majors (node:22 -> 24, python:3.12 -> 3.13) are a
  # deliberate project, not a bump: node 22 is the version every CI lane and
  # every base image agree on (see CLAUDE.md › Code Quality, third failure
  # mode), and reaches end of life on 2027-04-30.
  - package-ecosystem: 'docker'
    directories:
      - '/apps/api'
      - '/apps/web'
      - '/apps/gruen-o-mat'
      - '/services/hocuspocus'
      - '/services/nlp'
      - '/documentation'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'docker'
    groups:
      base-images:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # CARGO - Tauri desktop shell (separate workspace, own lockfile)
  # =============================================================================
  - package-ecosystem: 'cargo'
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '12:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop'
      - 'rust'
    groups:
      tauri-rust:
        patterns:
          - 'tauri*'
      serde:
        patterns:
          - 'serde*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'tauri*'
          - 'serde*'

  # =============================================================================
  # GITHUB ACTIONS - CI/CD workflows (DAILY for security)
  # =============================================================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
