# Dependabot configuration for Gruenerator monorepo
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ONE npm entry for the WHOLE pnpm workspace — do not add per-directory npm
# entries back.
#
# Dependabot's npm ecosystem reads /package.json and follows the workspace
# definition (pnpm-workspace.yaml: apps/*, packages/*, services/hocuspocus,
# services/mcp, documentation). A `directory: '/'` entry therefore already
# covers every workspace member. The 24 per-directory entries this file used to
# carry were not additional coverage, they were DUPLICATE coverage:
#
#   - the same bump opened twice (once from '/', once from '/apps/mobile'),
#     both regenerating the single root pnpm-lock.yaml and conflicting;
#   - the per-directory `ignore:` rules looked authoritative but did not apply
#     to the PRs the root entry raised, so bumps we had explicitly ignored for
#     apps/mobile and apps/wordpress kept reappearing (e.g. #1966-#1969).
#
# There is exactly ONE pnpm-lock.yaml, at the repo root, so every npm update in
# this repo is a root-level change no matter which manifest it edits. The
# config now matches that reality: one entry, one ignore list, grouped PRs.
#
# The cargo entry stays separate — apps/desktop/src-tauri is a Cargo workspace,
# not part of the pnpm one.

version: 2

updates:
  # =============================================================================
  # NPM — entire pnpm workspace (root + apps/* + packages/* + services + docs)
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '05:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Toolchain packages must move monorepo-wide in ONE PR — a partial bump
      # desyncs the shared lint/type config across workspaces.
      typescript-toolchain:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'prettier-*'
      commit-tooling:
        patterns:
          - '@commitlint/*'
          - 'husky'
      # React Native / Expo move together with the SDK, never piecemeal.
      react-native:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'typescript'
          - '@types/*'
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'prettier-*'
          - '@commitlint/*'
          - 'husky'
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-*/*'
    ignore:
      # --- React: deliberately NOT auto-updated at all ---------------------
      # react/react-dom are decoupled between web and mobile on purpose (see
      # CLAUDE.md > Expo Apps): apps/mobile pins the EXACT version its Expo SDK
      # ships, because react-native-renderer rejects any mismatch, while web
      # tracks '^'. A single workspace-wide entry cannot bump one without
      # touching the other's manifest, so react moves by hand only:
      #   mobile -> `npx expo install react react-dom` during an SDK upgrade
      #   web    -> a deliberate PR
      - dependency-name: 'react'
      - dependency-name: 'react-dom'

      # --- Blocked upstream, not by us -------------------------------------
      # eslint 10 / TypeScript 7:
      #   eslint-plugin-react@7.37.5 (latest) peers eslint '<=^9.7'
      #   typescript-eslint@8.x peers typescript '>=4.8.4 <6.1.0'
      # Drop these once both ship support, then bump in ONE PR.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @wordpress/scripts 33 pulls a typescript-eslint/ts-api-utils combination
      # that breaks linting monorepo-wide. Drop once the ts-api-utils override
      # in pnpm.overrides can go (i.e. after the eslint-10 bump above).
      - dependency-name: '@wordpress/scripts'
        update-types: ['version-update:semver-major']

      # --- Neutralised by pnpm.overrides -----------------------------------
      # zod is pinned to ^3.24.1 in pnpm.overrides, so a v4 bump would only
      # change manifests while v3 stays installed — a lie, not an update.
      # Drop this ignore as part of the dedicated zod-4 migration (which also
      # removes the better-auth>zod / knip>zod scoped overrides).
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']

      # --- Expo SDK owns these versions ------------------------------------
      # `npx expo install --check` is the authority for apps/mobile. Majors
      # (gesture-handler 3, webview 14, async-storage 3) ride the next SDK
      # upgrade and need device testing.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native-*/*'
        update-types: ['version-update:semver-major']
      # These four are SDK-pinned outright: `expo install --check` flags every
      # bump, including minors, as "may not work correctly".
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-pager-view'
      # 0.10 -> 0.11 is semver-MINOR, so the major ignore above misses it.
      - dependency-name: 'react-native-worklets'
      # Tracks the Expo SDK major (56 -> 57 belongs to the SDK 57 upgrade).
      - dependency-name: '@expo/dom-webview'

  # =============================================================================
  # CARGO - Tauri desktop shell (separate workspace, own lockfile)
  # =============================================================================
  - package-ecosystem: 'cargo'
    directory: '/apps/desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '12:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'desktop'
      - 'rust'
    groups:
      tauri-rust:
        patterns:
          - 'tauri*'
      serde:
        patterns:
          - 'serde*'
      minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'tauri*'
          - 'serde*'

  # =============================================================================
  # GITHUB ACTIONS - CI/CD workflows (DAILY for security)
  # =============================================================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
      - 'github-actions'
    groups:
      actions:
        patterns:
          - '*'
