events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Timeouts for long-running AI requests
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Use Docker's embedded DNS resolver so upstream IPs are re-resolved
    # after containers are recreated (prevents 502s on docker compose up)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Social crawler detection for OG link preview injection
    map $http_user_agent $is_crawler {
        default                 0;
        ~*facebookexternalhit   1;
        ~*Twitterbot            1;
        ~*Slackbot              1;
        ~*LinkedInBot           1;
        ~*Discordbot            1;
        ~*WhatsApp              1;
        ~*TelegramBot           1;
        ~*Applebot              1;
        ~*Pinterest             1;
        ~*Googlebot             1;
        ~*bingbot               1;
    }

    # Strip leading "docs." segment from host for redirect target:
    #   docs.gruenerator.eu       → gruenerator.eu
    #   docs.beta.gruenerator.eu  → beta.gruenerator.eu
    map $host $redirect_target_host {
        default          gruenerator.eu;
        ~^docs\.(.+)$    $1;
    }

    # Legacy docs subdomain — permanent redirect to canonical web app.
    # The docs SPA was decommissioned; documents now live at /office/:id on the
    # primary domain. Old share links of the form /document/<uuid> get a
    # single-hop 301 directly to the new path so crawlers see correct OG meta.
    server {
        listen 80;
        server_name ~^docs\.;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location ~ ^/(?:document|docs)/([a-f0-9-]+)$ {
            return 301 https://$redirect_target_host/office/$1;
        }

        location / {
            return 301 https://$redirect_target_host$request_uri;
        }
    }

    # Sites subdomain — direct to sites (candidate website builder) service
    server {
        listen 80;
        server_name ~^sites\.;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Proxy API requests to the API service so sites app can reach /api
        location /api/ {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cookie_path / /;
        }

        # Auth routes (must go to API for session consistency)
        location /auth/ {
            set $upstream_auth http://api:3001;
            rewrite ^/auth/(.*) /api/auth/$1 break;
            proxy_pass $upstream_auth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cookie_path / /;
        }

        location / {
            set $upstream_sites http://sites:80;
            proxy_pass $upstream_sites;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # Doku subdomain — direct to doku (Docusaurus) service
    server {
        listen 80;
        server_name ~^doku\.;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $upstream_doku http://doku:80;
            proxy_pass $upstream_doku;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # MCP subdomain — direct to MCP server (with SSE/WebSocket support)
    server {
        listen 80;
        server_name ~^mcp\.;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # v2: authenticated MCP server (OAuth), served in-process by the API.
        # The legacy public server below keeps / and /mcp unchanged. Regex
        # covers the common trailing-slash normalization (/v2/).
        location ~ ^/v2/?$ {
            set $upstream_api http://api:3001;
            rewrite ^ /api/mcp-server break;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 300s;
        }

        # OAuth discovery for the v2 resource (RFC 9728 path-insertion suffixes
        # included). AS metadata is mirrored here for clients that resolve it
        # at the resource origin instead of the issuer origin.
        location ^~ /.well-known/oauth-protected-resource {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location ^~ /.well-known/oauth-authorization-server {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location / {
            set $upstream_mcp http://mcp:3004;
            proxy_pass $upstream_mcp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Nango subdomain — OAuth connector service (Dashboard + API)
    server {
        listen 80;
        server_name ~^nango\.;

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            set $upstream_nango http://nango:3003;
            proxy_pass $upstream_nango;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }

    # Main domain — path-based routing (catch-all)
    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Auth routes (must go to API for session consistency)
        location /auth/ {
            set $upstream_auth http://api:3001;
            rewrite ^/auth/(.*) /api/auth/$1 break;
            proxy_pass $upstream_auth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cookie_path / /;
        }

        # Hocuspocus WebSocket — real-time collaboration
        location /ws {
            set $upstream_hocuspocus http://hocuspocus:1240;
            proxy_pass $upstream_hocuspocus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Internal admin endpoints (content-sync, offboarding) hold the
        # connection for the whole run — up to 90 min for the
        # abgeordnetenwatch backfill. The 300s default 504s them mid-run.
        location /api/internal/ {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_connect_timeout 75s;
            proxy_cookie_path / /;
        }

        # API routes
        # OAuth 2.1 discovery (RFC 8414/9728) — the Better Auth authorization
        # server for the MCP endpoint lives in the API, but clients resolve
        # these at the issuer origin ROOT (with optional path-insertion suffix).
        location ^~ /.well-known/oauth-authorization-server {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location ^~ /.well-known/oauth-protected-resource {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/ {
            set $upstream_api http://api:3001;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            # Must cover the subtitler video upload limit (MAX_UPLOAD_SIZE,
            # 500MB) — the API enforces per-route limits itself.
            client_max_body_size 500M;
            proxy_cookie_path / /;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            proxy_busy_buffers_size 32k;
        }

        # MCP server routes (AI tool integrations)
        location /mcp-server/ {
            set $upstream_mcp http://mcp:3004;
            rewrite ^/mcp-server/(.*) /$1 break;
            proxy_pass $upstream_mcp;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /mcp-server {
            return 301 /mcp-server/;
        }

        # Docusaurus documentation
        location /doku/ {
            set $upstream_doku http://doku:80;
            rewrite ^/doku/(.*) /$1 break;
            proxy_pass $upstream_doku;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Sites (candidate website builder)
        location /sites/ {
            set $upstream_sites http://sites:80;
            rewrite ^/sites/(.*) /$1 break;
            proxy_pass $upstream_sites;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /sites {
            return 301 /sites/;
        }

        # OG link previews: route social crawlers to API for dynamic meta tags.
        # Uses rewrite...last so the rewritten /api/og/docs/:id URL re-enters
        # the location /api/ block above (avoids nginx "if + proxy_pass" pitfall).
        # Matches /office/:id and the legacy /docs/:id share links.
        location ~ ^/(?:office|docs)/([a-f0-9-]+)$ {
            if ($is_crawler = 1) {
                rewrite ^/(?:office|docs)/(.+)$ /api/og/docs/$1 last;
            }

            set $upstream_web http://web:80;
            proxy_pass $upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Frontend (default)
        location / {
            set $upstream_web http://web:80;
            proxy_pass $upstream_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
