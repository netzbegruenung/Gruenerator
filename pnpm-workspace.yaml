packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/hocuspocus'
  - 'documentation'

# Supply-chain settings (docs/CLAUDE-deps.md › B6). Both need pnpm >= 10.21;
# `packageManager` in package.json pins the version CI and corepack use.
#
# A version must be seven days old before pnpm resolves it, transitives
# included. The hijacked releases of 2025 (chalk/debug, Shai-Hulud) were
# pulled within 48 h. Existing lockfile entries are untouched, so
# --frozen-lockfile installs never see this. Excluded: the two families we
# sometimes need on the day a bugfix ships.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix GHSA-vwc7-r8mq-g2x9 (symlink extraction escape) used at runtime
  # in apps/api; 0.6.1 was blocked only by the age gate, not by any trust signal.
  - 'adm-zip'
  - '@assistant-ui/*'
  # Same publisher and monorepo as @assistant-ui/*, pulled in lockstep by each
  # release; without them the scoped exclusion cannot install a fresh bugfix.
  - 'assistant-stream'
  - 'assistant-cloud'
  - 'safe-content-frame'
  - '@blocknote/*'
# Fail the install when a package's provenance trust level drops between
# releases (trusted publishing -> token), the signature of a taken-over
# maintainer account.
trustPolicy: no-downgrade
# Trust is compared by PUBLISH DATE, not semver, so a backport published after
# a provenance-carrying later release reads as a downgrade: semver@6.3.1 (2023-07,
# behind @babel/core), fbjs@3.0.5, ua-parser-js@1.0.41, tailwind-merge@2.6.0. All
# are long-locked and shipped, and every one of them aborted `pnpm install
# --lockfile-only` (the check stops at the first hit, so the list was unbounded).
# Only check releases younger than one year; minimumReleaseAge above already holds
# every new version for seven days, which is the window the hijacks this policy
# guards against (chalk/debug, Shai-Hulud) were live. Unit is MINUTES.
trustPolicyIgnoreAfter: 525600
# The window does not cover the whole family. tailwind-merge@2.6.1 (2026-01-30) is
# a 2.x backport of a single bugfix, published from the maintainer's own npm
# account — the same one that published 2.6.0 — after the 3.x line had already
# moved to trusted publishing. So it reads as a downgrade AND is young enough to
# still be checked: declaring tailwind-merge in any workspace package re-resolves
# the entry and aborts the install (#3325). Its only source is @blocknote/shadcn's
# `^2.6.0`, so rather than excluding the package from the policy — a permanent
# hole, and the first-hit abort only ever reveals the next offender — the pin
# `@blocknote/shadcn>tailwind-merge` in pnpm.overrides puts that one subtree on
# 2.6.0: same range, already in the tree for @univerjs/design, and old enough to
# predate the trusted-publishing era. Exact on purpose — a caret resolves straight
# back to 2.6.1.
