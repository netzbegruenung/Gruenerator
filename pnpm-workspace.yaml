packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/hocuspocus'
  - 'documentation'

# Supply-chain settings (docs/CLAUDE-deps.md › B6). Both need pnpm >= 10.21;
# `packageManager` in package.json pins the version CI and corepack use.
#
# A version must be three days old before pnpm resolves it, transitives
# included. The known npm hijacks (chalk/debug, Shai-Hulud, nx, ua-parser-js,
# axios 2026) were pulled within hours to under 48 h, so 72 h keeps more than
# half the window as margin. Shortened from seven days on 2026-10-14: the longer
# gate's real cost was a string of exact-version exclusions for fixes we needed
# within the week, each of which would have passed a three-day gate unaided.
# No family is excluded wholesale -- a blanket entry has no age protection at
# all, which is the opposite of what this gate is for.
#
# pnpm 12 checks the WHOLE lockfile against this gate on every install,
# --frozen-lockfile in CI and in the image builds included, not only new
# resolutions. A young entry can therefore only sit in the lockfile if it has
# an exact exclusion (see below); resolving one that has not is refused. So a
# lockfile that passed the gate never blocks a later re-resolution. When one does
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION naming entries nobody just added),
# the lockfile was written around the gate -- that is the finding, not the
# gate. Under pnpm 10, which re-checked locked entries only when re-resolving,
# the same state froze every dependency change for the whole window (#3216).
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Locked by #4533 under the former blanket @assistant-ui/* exclusion, published
  # 2026-10-12/13. Exact versions only; inert from 2026-10-16 09:07 UTC, remove then.
  - '@assistant-ui/core@0.3.28'
  - '@assistant-ui/react@0.15.28'
  - '@assistant-ui/react-markdown@0.14.22'
  - '@assistant-ui/store@0.3.20'
  - '@assistant-ui/tap@0.9.23'
  - 'assistant-stream@0.3.51'
  - 'safe-content-frame@0.0.34'
  # The hosted voice agent (`extra/voice-agents/browser`) first shipped in 3.0;
  # the voice-agent test page needs it. Published 2026-10-20 17:23 UTC.
  # Inert from 2026-10-23 17:23 UTC, remove then.
  - '@mistralai/mistralai@3.1.0'
# No exemption by semver: the hijacked releases this gate exists for (chalk/debug,
# Shai-Hulud) shipped as patch bumps. An urgent fix gets an exact-version entry
# in a `minimumReleaseAgeExclude:` list here (`name@x.y.z`, with why, publish date
# and "inert from <date + 3 days>, remove then") -- `pnpm audit --fix` writes one
# itself for a too-young security patch.
# Prune drops exact entries once `pnpm add`/`update`/`remove`/`install` writes a
# lockfile that no longer resolves them. An entry whose version stays locked is
# kept, but it stops mattering once the version is three days old.
minimumReleaseAgeExcludePrune: true
# Fail the install when a package's provenance trust level drops between
# releases (trusted publishing -> token), the signature of a taken-over
# maintainer account.
trustPolicy: no-downgrade
# Trust is compared by PUBLISH DATE, not semver, so a backport published after
# a provenance-carrying later release reads as a downgrade: semver@6.3.1 (2023-07,
# behind @babel/core), fbjs@3.0.5, ua-parser-js@1.0.41, tailwind-merge@2.6.0. All
# are long-locked and shipped, and every one of them aborted `pnpm install
# --lockfile-only` (the check stops at the first hit, so the list was unbounded).
# Only check releases younger than one year; minimumReleaseAge above already holds
# every new version for three days, longer than the hijacks this policy guards
# against (chalk/debug, Shai-Hulud) were live. Unit is MINUTES.
trustPolicyIgnoreAfter: 525600
# The window does not cover the whole family. tailwind-merge@2.6.1 (2026-01-30) is
# a 2.x backport of a single bugfix, published from the maintainer's own npm
# account — the same one that published 2.6.0 — after the 3.x line had already
# moved to trusted publishing. So it reads as a downgrade AND is young enough to
# still be checked: declaring tailwind-merge in any workspace package re-resolves
# the entry and aborts the install (#3325). Its only source is @blocknote/shadcn's
# `^2.6.0`, so rather than excluding the package from the policy — a permanent
# hole, and the first-hit abort only ever reveals the next offender — the pin
# `@blocknote/shadcn>tailwind-merge` in pnpm.overrides puts that one subtree on
# 2.6.0: same range, and old enough to predate the trusted-publishing era.
# Exact on purpose — a caret resolves straight back to 2.6.1.

# Moved here from .npmrc: pnpm 11 reads only auth and registry settings from
# .npmrc. Kept as hoisted because Metro/React Native in apps/mobile cannot
# resolve through a symlinked store; the Dockerfiles override it per build with
# --node-linker=isolated --shamefully-hoist for speed.
nodeLinker: hoisted

# pnpm 12 changed the default of this setting from `false` to `install`: every
# `pnpm run` and `pnpm exec` first checks node_modules against the lockfile and,
# on a mismatch, runs an install itself. That check is structurally wrong for
# this repo, because the Dockerfiles install a deliberately FILTERED subset
# (`--filter @gruenerator/api...`) and copy only that subset's manifests into
# the image. The verifier compares against the whole workspace, always sees a
# mismatch, and the install it then starts is unfiltered AND without
# --frozen-lockfile -- so it re-resolves `workspace:*` deps whose packages were
# never copied in and aborts:
#
#   × installing dependencies
#   ╰─▶ Failed to resolve dependency tree: In /app/packages/contracts:
#       "@gruenerator/eslint-config@workspace:*" is in the dependencies but no
#       package named "@gruenerator/eslint-config" is present in the workspace
#
# That killed the api, web, gruen-o-mat and hocuspocus images (#3351 bumped
# pnpm 10 -> 12; the doku image only survived because it is the one build whose
# filtered scope happens to cover every manifest in its image -- it still paid
# 27 s for the redundant install). Nothing in an image build should ever
# re-resolve after the one explicit `pnpm install --frozen-lockfile`.
#
# Setting it here is the only place that works: pnpm 11+ no longer reads
# settings from .npmrc or from `npm_config_*` env vars (both were measured
# against pnpm 12.4.2 and ignored), and pnpm-workspace.yaml is already copied
# into every image. `false` is also the pnpm 10 behaviour this monorepo was
# built around -- an implicit full install fired by a `pnpm --filter x test` is
# never wanted here, least of all on a 16 GB machine running several agents.
verifyDepsBeforeRun: false

# Moved here from package.json's `pnpm` field, which pnpm 11 no longer reads.
# Replaces neverBuiltDependencies: ['canvas'] — canvas ships prebuilt binaries
# we do not want compiled from source.
allowBuilds:
  # Written down when pnpm 11 turned unapproved builds from a warning into
  # ERR_PNPM_IGNORED_BUILDS. The batch was NOT behaviour-preserving for the two
  # ffmpeg packages below: the old `neverBuiltDependencies: ['canvas']` was a
  # BLOCKLIST, so pnpm 10 ran every script except canvas's. Setting all of them
  # to false silently stripped both media binaries out of the API image
  # (measured against ghcr.io/...-api from 2026-09-01 vs 2026-09-16):
  # ffmpeg gone entirely, ffprobe shipped without its execute bit. Voice
  # answered 500 (spawn ... ENOENT), the subtitler would have hit EACCES.
  # Flipping any of these to true grants that package arbitrary code execution
  # at install time -- do it per package, with a reason, not as a batch.
  canvas: false
  # `chmod u+x ffprobe`, nothing else -- no network, no compiler. Without it the
  # binary that ships INSIDE the tarball is installed unusable (EACCES).
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-arm': true
  '@ffprobe-installer/linux-arm64': true
  '@ffprobe-installer/linux-ia32': true
  '@ffprobe-installer/linux-x64': true
  '@ffprobe-installer/win32-ia32': true
  '@ffprobe-installer/win32-x64': true
  '@parcel/watcher': false
  '@swc/core': false
  better-sqlite3: false
  core-js: false
  core-js-pure: false
  esbuild: false
  # The package is a downloader: the npm tarball carries no binary, install.js
  # fetches ffmpeg (~80 MB, release tag pinned in its package.json) from GitHub
  # releases. With the build off it installs as a stub and every ffmpeg call
  # dies with ENOENT. The download is NOT covered by the lockfile integrity
  # hash -- that is the price of this entry; the alternatives are a Debian
  # `apt-get install ffmpeg` in the image (+459 MB, measured) or
  # @ffmpeg-installer/ffmpeg, which ships the binary in the tarball but is
  # stuck on ffmpeg 4.2 from 2021.
  ffmpeg-static: true
  msw: false
  node-sass: false
  protobufjs: false
  unrs-resolver: false
  # Its postinstall downloads the sentry-cli binary. Mobile never runs it: the
  # upload hooks come from the Expo config plugin, which is deliberately not
  # installed (see apps/mobile/services/errorReporting.ts).
  '@sentry/cli': false
  # postinstall (install-libs) copies the prebuilt Skia binaries into the package;
  # without it the iOS/Android native build has no libs to link.
  '@shopify/react-native-skia': true

# The two dependencies we ship with a local fix. `decode-uri-component@0.2.2`
# (GHSA-vcc3-ghjq-m6fr) decodes malformed percent-encoded input superlinearly:
# on the installed copy, `'%A0'.repeat(400)` (a 1.2 KB query value) takes 2.6 s
# and `.repeat(600)` 6.8 s, on the JS thread, and it keeps growing. It is
# reachable from untrusted input — expo-router's getStateFromPath() runs
# queryString.parse() over the query of every incoming deep link — so any link
# handed to a user freezes the mobile app. Guarded by
# apps/mobile/test/queryStringDos.vitest.ts.
#
# Neither of the two obvious fixes works, both checked:
#   * Bumping expo-router: every line still declares `query-string: ^7.1.3`,
#     including 57.0.21 (latest), 58.0.3 (next) and the 58 canary.
#   * Overriding decode-uri-component to the patched >=0.5.0: 0.4.0 and up are
#     ESM-only, and query-string@7.1.3 is CommonJS. Verified against a real
#     install — `queryString.parse()` dies with "decodeComponent is not a
#     function". check-override-ranges.mjs would NOT have caught this: it only
#     flags overrides BELOW a declared range, and `^0.2.2` -> 0.5.0 points up.
#
# So the patch ports upstream 0.5.0's linear scanner into the 0.2.2 CommonJS
# file and leaves the rest byte-identical. Over 50 000 random percent-encoded
# strings the patched output equals upstream 0.5.0 exactly; it equals 0.2.2
# except on malformed input, where 0.2.2 fabricates characters (upstream fixed
# that in the same rewrite). 360 KB of hostile input now decodes in 20 ms.
#
# Drop the patch — and the ignore below — as soon as expo-router moves off
# query-string@7. pnpm fails the install when the patch no longer applies, so a
# version bump underneath cannot pass silently.
#
# `mdast-util-gfm-autolink-literal@2.0.1` builds its email autolink pattern with
# `new RegExp()` at transform time, and that pattern opens with the lookbehind
# `(?<=^|\s|\p{P}|\p{S})`. WebKit without lookbehind support (Safari below
# 16.4 — `target: [..., 'safari15']` in apps/web/vite.config.ts is the support
# line we build for) throws `SyntaxError: Invalid regular expression: invalid
# group specifier name` out of it, which unmounts every markdown surface behind
# an error boundary: chat messages, tool output, research cards, slides.
# GlitchTip issue 561, event 01a0b96f8e3e754db3acf39980a54365.
#
# esbuild rewrites lookbehind in a regex LITERAL into a `new RegExp()` call for
# such a target (a runtime error instead of a whole chunk failing to parse),
# but a pattern the package assembles itself is a string — the build cannot see
# it, so nothing warns. remark-gfm has no option to turn the extension off, and
# 2.0.1 is the latest release.
#
# The assertion is redundant, which is what makes dropping it safe: `findEmail`
# rejects the same matches through `previous(match, true)`, whose test is
# `index === 0 || unicodeWhitespace(code) || unicodePunctuation(code)`, and
# micromark's `unicodePunctuation` is exactly `/\p{P}|\p{S}/u`. A rejected
# match resumes at `index + 1`, which is where the lookbehind would have let the
# engine continue anyway. Checked against the unpatched package over 20 052
# inputs (52 hand-picked, 20 000 random strings over an alphabet of letters,
# `@`, `.`, `-`, `_`, `+`, `/`, `,`, umlauts, an emoji, `§` and newlines): the
# produced link nodes are identical for every one of them.
#
# `@better-auth/oauth-provider` (1.7.6, still in 1.7.7) seeds `ba_oauth_resources` in its plugin
# `init` (because `mcp({ resource })` in apps/api/config/betterAuth.ts passes a
# resource). `betterAuth()` runs that init at module import, before
# PostgresService has applied the migration that creates the table, and caches
# the result in `auth.$context`. The plugin means to defer on a missing table,
# but its MISSING_TABLE_PATTERN only tests `err.message`, and Drizzle wraps the
# pg error as `Failed query: …` with `relation … does not exist` in `cause`. So
# the first boot after a deploy rejected `$context` for good, and every auth
# request answered 500 until the process restarted (beta, 24.09.2026, #3670).
#
# The patch catches the init-time seed and logs a warning. The library's own
# lazy path (`getResource` -> `seedResourcesOnce`) then seeds on the first
# resource access. It is not a silent swallow: that path resets and rethrows on
# failure, so a seed that keeps failing fails every resource lookup loudly and
# is retried on the next one. Only the resource endpoints fail, not sign-in.
# The patch is chosen over building `auth` lazily after migrations because
# `auth` is a module-level export that 15 files import. Guarded by incident 7 in
# apps/api/config/authRegressions.vitest.ts. Drop it once upstream matches the
# pattern against `cause` or stops seeding in `init`. pnpm fails the install when
# the patch no longer applies, so a better-auth bump cannot skip it silently.
#
# `react-native-markdown-display@7.0.2` keys every AST node from a global
# counter (`getUniqueID()` in tokensToAST.js and AstRenderer.js), so each parse
# hands React new keys and it remounts the whole native tree of a message. In
# the chat that happens per streamed token: one 2.4k-character answer mounted
# 35 000 host views, and a code fence remounted its CodeBlock 150 times. The
# patch keys nodes by type and position among their siblings, which is all a
# React key needs; a re-parse then updates the tree in place. 7.0.2 is the
# latest release. Guarded by apps/mobile/test/markdownStableKeys.vitest.ts.
#
# `expo@57.0.26`: a DOM component (`'use dom'`, our KaTeX MathViewDOM) emits
# its props to the webview in a mount effect, and again on every render
# because the props object is rebuilt each time. The page is not loaded at
# mount, and the wrapper sends the props again on `DOM_READY`, so that emit
# does nothing. It still costs one synchronous hop to the main thread: the
# native `injectJavaScript` takes a view argument, and Expo looks the view up
# on the main thread. Opening a 200-message thread in the iOS simulator spent
# 72-125 ms of JS in it while the UI thread mounted the rows. The patch skips
# the emit on mount and whenever the serialized props are unchanged. Still
# unfixed upstream in 57.0.27. Guarded by apps/mobile/test/domPropsEmit.test.tsx.
# Lockfile: `expo` depends on packages that peer-depend on `expo`, a peer
# cycle. pnpm writes the ~140 peer suffixes that close it as a bare
# `(expo@57.0.26)`, without the patch hash, by design; the importer and the
# `expo` snapshot carry the hash. pnpm <= 12.8 read that as stale
# (ERR_PNPM_INCONSISTENT_PATCH_HASH, pnpm/pnpm#16418, fixed in 12.9). Do not
# add the hash to these suffixes by hand: the next re-resolution strips it
# again and every lockfile diff grows by 139 lines (#4552).
#
# `y-indexeddb@9.0.12` chains `.then()` onto its `_db` open promise twice
# without a catch: in the constructor (the initial load) and in `destroy()`.
# When the open fails, both derived promises reject unhandled even though the
# caller catches `_db` itself (packages/collab useCollaboration does). Chrome
# Android rejects the open with "AbortError: The connection was closed" when
# the page is torn down mid-open, which Sentry reported as an unhandled
# rejection (GlitchTip #682). Neither promise is reachable from outside, so no
# caller-side catch can fix it. The patch catches the constructor chain (with a
# console.warn, so a failed load stays visible) and makes `destroy()` resolve
# when there is no connection to close. Only `src/` is patched: the web build
# and vitest resolve the ESM entry, the CJS `dist/` is unused. 9.0.12 is the
# latest release. Guarded by packages/collab/src/hooks/idbOpenFailure.vitest.ts.
#
# `@blocknote/xl-ai@0.55.0` declares the `id` of its AI suggestion marks
# (`insertion`/`deletion`/`modification`) as `{ default: null, validate:
# "number" }`, while its agent creates the preview marks without an id
# (`pmSchema.mark("insertion", {})`, src/prosemirror/agent.ts). prosemirror-model
# does not validate a default, so the mark is born with `id: null`. Once the
# user types inside the AI preview, the DOM observer re-parses the range and the
# mark view hands back `{ mark, attrs: mark.attrs }`; now `id: null` is passed
# explicitly and `validate` throws "Expected value of type number for attribute
# id on type insertion, got null", dropping the keystroke (GlitchTip #702/#703).
# The upstream comment "validate is supported in prosemirror but not in tiptap"
# is outdated: tiptap 3 passes `validate` through. The patch widens it to
# "number|null". The app cannot fix this from outside: tiptap builds `attrs`
# after `extendMarkSchema`, and a mark's own `addAttributes` beats
# `addGlobalAttributes`. Unchanged in 0.56.0. Only the ESM entry is patched: the
# web build and vitest resolve it, the CJS main entry is unused (the API only
# imports `@blocknote/xl-ai/server`). Guarded by
# packages/docs/src/lib/aiSuggestionMarks.vitest.ts.
patchedDependencies:
  '@better-auth/oauth-provider@1.7.7': patches/@better-auth__oauth-provider@1.7.7.patch
  '@blocknote/xl-ai@0.55.0': patches/@blocknote__xl-ai@0.55.0.patch
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  expo@57.0.26: patches/expo@57.0.26.patch
  mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch
  react-native-markdown-display@7.0.2: patches/react-native-markdown-display@7.0.2.patch
  y-indexeddb@9.0.12: patches/y-indexeddb@9.0.12.patch

# Moved here from package.json's `pnpm.auditConfig`.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-gv7w-rqvm-qjhr
    - GHSA-g7r4-m6w7-qqqr
    - GHSA-8988-4f7v-96qf
    - GHSA-h67p-54hq-rp68
    - GHSA-rmmh-p597-ppvv
    - GHSA-64mm-vxmg-q3vj
    - GHSA-7pqw-9j4j-h8q3
    - GHSA-jmr9-qjv8-65gv
    - GHSA-528h-pc64-c93x
    # decode-uri-component DoS — fixed by patchedDependencies above, but
    # pnpm audit matches the advisory by version, not by file content.
    - GHSA-vcc3-ghjq-m6fr
    # node-forge <=1.4.0 PKCS#1 v1.5 signature verification (no patched
    # release). Only reached via apps/mobile build tooling: @expo/cli and
    # expo-updates/cli → @expo/code-signing-certificates; no runtime build/
    # imports it, and app.json configures no update code signing. Re-check
    # 2026-11-02; drop once node-forge ships a fix.
    - GHSA-86w9-cpqp-85rv
    # http-cache-semantics <=4.2.0 max-stale cross-user disclosure (no patched
    # release). Only via apps/api → @crawlee/* → got-scraping → got →
    # cacheable-request; that code runs only when got gets a `cache` option,
    # and neither crawlee nor our UrlCrawler passes one. Re-check 2026-11-02.
    - GHSA-ch52-4w7c-c8xp
    # braces <=3.0.3 stack exhaustion on nested patterns (no patched release).
    # Via apps/mobile → react-native → metro-file-map → micromatch (the
    # bundler, fed with our own config globs, never shipped in the app).
    # Re-check 2026-11-02.
    - GHSA-vfj7-8cjw-p6xm
    # tinypool <2.1.2 prototype pollution → RCE via worker/run() options. The
    # only copy is tinypool 1.1.1 under documentation → @docusaurus/core, which
    # declares ^1.0.2 and has no patched 1.x; a >=2.1.2 floor would cross that
    # major. Build-time only: Docusaurus passes its own options while building
    # the docs site, no user input reaches them. Re-check 2026-11-02.
    - GHSA-5gmw-xhrv-c9v3
    - GHSA-85c8-ppgw-ccpr
    # stream-json <3.6.0 prototype pollution (GHSA-mjw6-4jj6-33hc) and
    # quadratic rescan (GHSA-hqr4-qq8f-hg3x). The apps/api path (@crawlee/*)
    # is fixed by crawlee 3.18.2 (stream-json ~3.7.0). What remains is
    # apps/mobile → expo-atlas 0.4.3 → stream-json 1.9.1: expo-atlas declares
    # ^1.8.0 and no 1.x carries the fix, so a >=3.6.0 floor would cross two
    # majors (3.x is ESM-only). Dev tooling only — the Metro bundle inspector
    # parses its own stats file, nothing ships in the app. Re-check 2026-11-14.
    - GHSA-mjw6-4jj6-33hc
    - GHSA-hqr4-qq8f-hg3x
    # postcss-selector-parser <7.1.6 (GHSA-rj75-hqrm-r3gf). Only 6.1.4 under
    # apps/wordpress → @wordpress/scripts / sass-loader → webpack → cssnano
    # (stylehacks, postcss-merge-rules, postcss-minify-selectors declare
    # ^6.0.16, postcss-calc ^6.0.11); no patched 6.x, a >=7.1.6 floor would
    # cross the major. Build-time CSS minification of our own plugin styles.
    # Re-check 2026-11-14.
    - GHSA-rj75-hqrm-r3gf
    # @opentelemetry/instrumentation-{pg,mysql2,knex,mysql,mongoose,tedious}
    # (GHSA-qqmp-wf37-98f9). Only via apps/wordpress → @wordpress/scripts →
    # @wordpress/e2e-test-utils-playwright → lighthouse → @sentry/node 9.47.1,
    # which pins every instrumentation exactly (e.g. instrumentation-pg
    # 0.51.1), so no floor is possible. Lighthouse runs no database driver;
    # wp-scripts is build/e2e tooling only. Re-check 2026-11-14.
    - GHSA-qqmp-wf37-98f9
    # sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c, no patched release). Only via
    # packages/shared → gray-matter → js-yaml 3 → argparse 1 → sprintf-js
    # 1.0.3. gray-matter is a devDependency used by scripts/build-agents.ts
    # and scripts/build-skills.ts at build time, and argparse is only loaded
    # by js-yaml's CLI (bin/js-yaml.js), not by the library — it reaches no
    # web, mobile or api runtime bundle. Re-check 2026-11-14.
    - GHSA-hp3w-g68c-fv3c
    # zod <4.6.6 unbounded issue accumulation on oversized arrays
    # (GHSA-mrhx-c7xc-m3w5). Meant for the 3.x line we validate with (api,
    # contracts, shared, web), which has no patched release. ignoreGhsas cannot
    # be scoped to a version, so it would also hide a zod 4 copy below 4.6.6:
    # every `>zod` override below must stay at ^4.6.6, and `grep '^  zod@'
    # pnpm-lock.yaml` must show no 4.x below 4.6.6. Exposure is real but
    # bounded by express.json's 50 MB limit; accepted until the zod 4
    # migration (#4546) lands. Re-check 2026-11-25.
    - GHSA-mrhx-c7xc-m3w5

