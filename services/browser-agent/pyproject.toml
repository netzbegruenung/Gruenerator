[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gruenerator-browser-agent"
version = "0.1.0"
description = "Headless browser agent with a filtering egress proxy for Grünerator"
requires-python = ">=3.13"
# Exakte Pins stehen in requirements.txt.
dependencies = [
    "browser-use==0.13.14",
    "fastapi",
    "uvicorn",
    "pillow",
    "anyio",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Das Paket wird im Testlauf nicht installiert; pytest soll `import browser_agent`
# wie im Image über src/ auflösen.
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
