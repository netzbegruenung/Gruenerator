[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gruenerator-nlp"
version = "0.1.0"
description = "Topic classification service for Grünerator Monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "spacy>=3.7.0",
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
]
