services:
  gruenerator-mcp:
    build: .
    ports:
      - '${PORT:-3000}:3000'
    # Prod deploy templates env via Salt (states/gruenerator-docker), not this file.
    environment:
      - QDRANT_URL=${QDRANT_URL:?}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:?}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_BASIC_AUTH_USERNAME=${QDRANT_BASIC_AUTH_USERNAME}
      - QDRANT_BASIC_AUTH_PASSWORD=${QDRANT_BASIC_AUTH_PASSWORD}
      - PORT=${PORT:-3000}
      - PUBLIC_URL=${PUBLIC_URL}
      - GRUENERATOR_API_URL=${GRUENERATOR_API_URL}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped
