services:
  iconify:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3100:3100'
    environment:
      - PORT=3100
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/collections']
      interval: 30s
      timeout: 5s
      retries: 3
